-- LDoc config for Hull's Lua stdlib (`stdlib/lua/hull/`).
-- Output: build/api/lua/
--
-- Run via:  make docs-api-lua
--
-- LDoc reference: https://stevedonovan.github.io/ldoc/

project      = 'Hull Lua API'
title        = 'Hull — Lua stdlib reference'
description  = "Per-function reference for Hull's Lua 5.4 standard library"

-- Source scan
file = {
    'stdlib/lua/hull',
    exclude = {
        'stdlib/lua/hull/tests',
        'stdlib/lua/vendor',
    }
}

-- Output
dir          = 'build/api/lua'
format       = 'markdown'      -- LDoc renders markdown in comments
style        = '!fixed'        -- two-column layout

-- Doc style
all          = true            -- include items even without explicit @export
boilerplate  = true            -- skip the license block at the top of each file
merge        = true            -- merge module fragments split across files
no_summary   = false
no_lua_ref   = false           -- link to Lua reference manual
sort_modules = true

-- Section naming — group middleware modules together
custom_tags  = { { 'manifest', title = 'Required manifest fields' } }

-- Default kind detection: treat tables exposed at file scope as modules,
-- and `function module.fn(...)` as exported APIs.
package      = 'hull'
