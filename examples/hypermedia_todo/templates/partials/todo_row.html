<li id="todo-{{ id }}">
  <input type="checkbox"
         {% if done %}checked{% end %}
         hx-post="/todos/{{ id }}/toggle"
         hx-target="#todo-{{ id }}"
         hx-swap="outerHTML">
  <span {% if done %}style="text-decoration: line-through"{% end %}>{{ title }}</span>
  <button hx-delete="/todos/{{ id }}"
          hx-target="#todo-{{ id }}"
          hx-swap="delete"
          hx-confirm="Delete this todo?">×</button>
</li>
