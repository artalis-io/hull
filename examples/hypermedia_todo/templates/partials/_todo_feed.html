<ul id="todos" class="todo-list">
{% if has_todos %}
  {% for t in todos %}
    {% include "partials/todo_row.html" %}
  {% end %}
{% else %}
  {% if has_query %}
  <li class="todo-empty">No todos match "{{ q }}".</li>
  {% else %}
  <li class="todo-empty">Nothing here yet - add your first todo above.</li>
  {% end %}
{% end %}
</ul>

{% include "partials/_pagination.html" %}
