{% extends "base.html" %}

{% block title %}Photo Log{% end %}

{% block body %}
<header class="app-header">
  <h1>Photo Log</h1>

</header>

<input id="search-input" placeholder="Search entries…" value="{{ q }}"

<div id="entry-feed" class="entry-feed">
  {% include "partials/_entry_feed.html" %}
</div>
{% end %}
