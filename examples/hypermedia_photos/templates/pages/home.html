{% extends "base.html" %}

{% block title %}Photo Log{% end %}

{% block body %}
<header class="app-header">
  <h1>Photo Log</h1>
  <p class="muted">A hypermedia photo diary built with Hull + HTMX.</p>
</header>

{% include "partials/entry_form.html" %}

<input type="search" name="q" id="search-input"
       placeholder="Search entries…"
       autocomplete="off"
       value="{{ q }}"
       hx-get="/search"
       hx-trigger="keyup changed delay:300ms, search"
       hx-target="#entry-feed"
       hx-swap="innerHTML"
       hx-push-url="true">

<div id="entry-feed" class="entry-feed">
  {% include "partials/_entry_feed.html" %}
</div>
{% end %}
