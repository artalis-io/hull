<form id="new-entry"
      hx-post="/entries"
      hx-target="#entry-feed"
      hx-swap="innerHTML">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <input type="text" name="title" placeholder="New entry"
         value="{{ values.title }}"
         {{ title_attrs | raw }}
         required autofocus>
  {{ title_error | raw }}
  <button type="submit" data-loading-label="Adding…">Add</button>
</form>
