name: Hull reproducible build container
description: >
  Build the registry-less, snapshot-pinned reproducible build image
  (.github/docker/Dockerfile.build) and run a command inside it with the repo
  bind-mounted at /src. Immutability across time comes from the base-image
  digest pin plus the apt snapshot pin, not from a published image, so nothing
  is pushed or pulled from a Hull-controlled registry. Roadmap 0.3.1;
  see docs/security.md "Build-environment immutability".

inputs:
  run:
    description: Command(s) to execute inside the container (multi-line ok).
    required: true
  source-date-epoch:
    description: >
      Optional SOURCE_DATE_EPOCH apt-snapshot pin. Empty derives it from the
      digest-pinned base image, which is already deterministic.
    required: false
    default: ""
  user:
    description: >
      Container user. Default (empty) runs as root, fine when the job only
      builds + uploads. Set to "host" to run as the runner's uid:gid so build
      outputs are host-owned; required when later HOST steps write into build/
      (e.g. the release Platform-sig E2E does keygen/sign into build/).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build reproducible container
      shell: bash
      # Retry the BUILD, not just apt inside it.
      #
      # Dockerfile.build already sets Acquire::Retries=10 with apt's exponential
      # backoff, and its comment explains why: snapshot.ubuntu.com is a single
      # Canonical service with no public mirror, so a transient 5xx cannot be
      # routed around. Those retries happen INSIDE one apt invocation; when
      # they are exhausted the layer build exits 100 and the whole job fails,
      # which apt cannot help with.
      #
      # Measured 2026-09-16: four unrelated PRs failed here in one day - one
      # touching a shell test script, one a workflow and a doc - and every one
      # passed on a manual re-run minutes later. That is the exact shape a
      # delayed automatic retry absorbs, and it was costing a re-run per PR.
      #
      # Safe here in a way it would not be for an ordinary image: the base is
      # digest-pinned and apt is snapshot-pinned, so attempt N builds the same
      # image as attempt 1 or fails the same way. It cannot paper over a real
      # Dockerfile error either - that fails identically three times and still
      # stops the job.
      #
      # The budget is TIME, not attempts: a 502/503 spell on the snapshot
      # service usually lasts minutes (2026-11-06: three reproducible-build
      # jobs on one PR and a release run failed, and a rerun minutes later
      # passed), which three attempts over ~45s never covered. So attempts
      # back off exponentially (30s, 60s, 120s, then every 240s) until 15
      # minutes have passed since the first one; one more attempt starts only
      # inside that window. A real Dockerfile error therefore costs ~15
      # minutes before it stops the job - the price of not needing a manual
      # `gh run rerun --failed` for an outage of that length.
      #
      # It does NOT defend against a LONG outage. On 2026-09-08 the service
      # returned 502/503 across all three of its IPs for hours. That still
      # needs something that skips the network, and the layer cache tried at
      # hull#473 evicted the artifacts the reproducibility compare depends on,
      # so it remains open.
      env:
        HULL_SDE: ${{ inputs.source-date-epoch }}
      run: |
        budget=900
        delay=30
        attempt=1
        start=$SECONDS
        while :; do
          if docker build \
               --build-arg SOURCE_DATE_EPOCH="$HULL_SDE" \
               -t hull-build:pinned \
               -f .github/docker/Dockerfile.build \
               .github/docker; then
            [ "$attempt" = 1 ] || echo "container build succeeded on attempt $attempt"
            break
          fi
          elapsed=$((SECONDS - start))
          if [ $((elapsed + delay)) -gt "$budget" ]; then
            echo "::error::reproducible container build failed $attempt times over ${elapsed}s - if"
            echo "::error::this is snapshot.ubuntu.com returning 5xx, see the note in"
            echo "::error::.github/docker/Dockerfile.build: retries do not cover a long outage"
            exit 1
          fi
          echo "container build failed (attempt $attempt, ${elapsed}s of ${budget}s); retrying in ${delay}s"
          sleep "$delay"
          attempt=$((attempt + 1))
          delay=$((delay * 2))
          [ "$delay" -le 240 ] || delay=240
        done
    - name: Run in reproducible container
      shell: bash
      # The payload is passed as an environment variable and eval'd INSIDE the
      # container. It must not be embedded in a double-quoted host string, or
      # host bash would expand any $(...) / $VAR before docker runs. The host
      # only ever sees the single-quoted 'eval "$HULL_RUN"'.
      env:
        HULL_RUN: ${{ inputs.run }}
        HULL_USER: ${{ inputs.user }}
      run: |
        user_args=()
        if [ "$HULL_USER" = host ]; then
          # Run as the runner user so build/ outputs are host-owned and later
          # host steps can read/execute/write them. HOME is set because the
          # uid has no /etc/passwd entry in the image.
          user_args=(--user "$(id -u):$(id -g)" -e HOME=/tmp)
        fi
        docker run --rm \
          "${user_args[@]}" \
          -e HULL_RUN \
          -v "$PWD":/src -w /src \
          hull-build:pinned \
          bash -euo pipefail -c 'eval "$HULL_RUN"'
