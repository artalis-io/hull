          path: libhull_feature-mysql-${{ matrix.name }}.a

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [build-cosmo, build-native, build-wamrc, build-tcc, build-platform-cosmo-flavors, build-feature-native, build-feature-gpu, build-feature-tui, build-feature-postgres, build-feature-mysql, build-feature-lua, build-feature-js]
    permissions:
      contents: write       # publish GitHub release + assets
      id-token: write       # SLSA: OIDC for Sigstore signing
      attestations: write   # SLSA: write build-provenance attestation

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          mv artifacts/hull-cosmo/hull-cosmo                              dist/hull-cosmo
          mv artifacts/hull-linux-x86_64/hull-linux-x86_64                dist/hull-linux-x86_64
          mv artifacts/hull-linux-aarch64/hull-linux-aarch64              dist/hull-linux-aarch64
          mv artifacts/hull-darwin-arm64/hull-darwin-arm64                dist/hull-darwin-arm64
          mv artifacts/hull-wamrc-linux-x86_64/hull-wamrc-linux-x86_64    dist/hull-wamrc-linux-x86_64
          mv artifacts/hull-wamrc-linux-aarch64/hull-wamrc-linux-aarch64  dist/hull-wamrc-linux-aarch64
          mv artifacts/hull-wamrc-darwin-arm64/hull-wamrc-darwin-arm64    dist/hull-wamrc-darwin-arm64
          mv artifacts/hull-tcc-linux-x86_64/hull-tcc-linux-x86_64        dist/hull-tcc-linux-x86_64
          mv artifacts/hull-tcc-linux-aarch64/hull-tcc-linux-aarch64      dist/hull-tcc-linux-aarch64
          # Per-flavor platform libs. Consumed by `hull platform install
          # <flavor>` -> `hull build --flavor`. Native files:
          # libhull_platform-<flavor>-<arch>.a; cosmo files (dual-arch):
          # libhull_platform-<flavor>.{x86_64,aarch64}-cosmo.a. All match the
          # `libhull_platform-*.a` glob in the SHA-256 + publish steps below,
          # so they inherit the release signature automatically.
          mv artifacts/platform-flavors-linux-x86_64/*.a  dist/
          mv artifacts/platform-flavors-linux-aarch64/*.a dist/
          mv artifacts/platform-flavors-darwin-arm64/*.a  dist/
          mv artifacts/platform-cosmo-flavor-pure-compute/*.a  dist/
          # libhull: the no-runtime embedding archive (libhull L-4). Native
          # per-arch (libhull-<arch>.a) + dual-arch cosmo
          # (libhull.{x86_64,aarch64}-cosmo.a). Added explicitly to the
          # SHA-256 + publish steps below so they inherit the release signature.
          mv artifacts/libhull-linux-x86_64/libhull-linux-x86_64.a    dist/
          mv artifacts/libhull-linux-aarch64/libhull-linux-aarch64.a  dist/
          mv artifacts/libhull-darwin-arm64/libhull-darwin-arm64.a    dist/
          mv artifacts/libhull-cosmo/*.a                              dist/
          # Composable DuckDB feature archives (libhull_feature-duckdb-<arch>.a),
          # native-only. Pulled by `hull feature install duckdb`. Added to the
          # SHA-256 + publish steps below so they inherit the release signature.
          mv artifacts/feature-duckdb-linux-x86_64/*.a   dist/
          mv artifacts/feature-duckdb-linux-aarch64/*.a  dist/
          mv artifacts/feature-duckdb-darwin-arm64/*.a   dist/
          # Composable GPU feature archives (libhull_feature-gpu-<arch>.a),
          # native-only. Pulled by `hull feature install gpu`. Covered by the
          # libhull_feature-*.a glob in the SHA-256 + publish steps below.
          mv artifacts/feature-gpu-linux-x86_64/*.a   dist/
          mv artifacts/feature-gpu-linux-aarch64/*.a  dist/
          mv artifacts/feature-gpu-darwin-arm64/*.a   dist/
          # Composable TUI feature archives (libhull_feature-tui-<arch>.a),
          # native-only. Pulled by `hull feature install tui`. Covered by the
          # libhull_feature-*.a glob in the SHA-256 + publish steps below.
          mv artifacts/feature-tui-linux-x86_64/*.a   dist/
          mv artifacts/feature-tui-linux-aarch64/*.a  dist/
          mv artifacts/feature-tui-darwin-arm64/*.a   dist/
          # Composable runtime feature archives (libhull_feature-{lua,js}-<arch>.a),
          # native-only. Embedded in hull + auto-composed; published for provenance
          # + source builds. Covered by the libhull_feature-*.a glob below.
          mv artifacts/feature-lua-linux-x86_64/*.a   dist/
          mv artifacts/feature-lua-linux-aarch64/*.a  dist/
          mv artifacts/feature-lua-darwin-arm64/*.a   dist/
          mv artifacts/feature-js-linux-x86_64/*.a    dist/
          mv artifacts/feature-js-linux-aarch64/*.a   dist/
          mv artifacts/feature-js-darwin-arm64/*.a    dist/
          # Composable PostgreSQL feature archives (libhull_feature-postgres-<arch>.a),
          # native-only. Pulled by `hull feature install postgres`. Covered by the
          # libhull_feature-*.a glob in the SHA-256 + publish steps below.
          mv artifacts/feature-postgres-linux-x86_64/*.a   dist/
          mv artifacts/feature-postgres-linux-aarch64/*.a  dist/
          mv artifacts/feature-postgres-darwin-arm64/*.a   dist/
          # Composable MySQL/MariaDB feature archives (libhull_feature-mysql-<arch>.a),
          # native-only. Pulled by `hull feature install mysql`. Covered by the
          # libhull_feature-*.a glob in the SHA-256 + publish steps below.
          mv artifacts/feature-mysql-linux-x86_64/*.a   dist/
          mv artifacts/feature-mysql-linux-aarch64/*.a  dist/
          mv artifacts/feature-mysql-darwin-arm64/*.a   dist/

      - name: Make binaries executable
        run: chmod +x dist/*

      - name: Generate SBOM (single canonical, from linux-x86_64 binary)
        # §0.3.9. Generate the SBOM AS a release artifact, then include
        # it in hull.sha256 so it inherits the release signature. The
        # linux-x86_64 binary is used to generate; the resulting JSON
        # describes the vendored components shared across all platforms
        # (binary_sha256 inside reflects the linux-x86_64 hash; consumers
        # verifying other platforms use hull verify-self for that).
        working-directory: dist
        run: |
          chmod +x ./hull-linux-x86_64
          ./hull-linux-x86_64 sbom --format=json      > hull.sbom.json
          ./hull-linux-x86_64 sbom --format=cyclonedx > hull.sbom.cdx.json
          ./hull-linux-x86_64 sbom --format=spdx      > hull.sbom.spdx.json
          # libhull-scoped SBOM: describes the no-runtime embedding archive
          # (drops the Lua/QuickJS runtimes). Same signature inheritance.
          ./hull-linux-x86_64 sbom --subject=libhull --format=json      > libhull.sbom.json
          ./hull-linux-x86_64 sbom --subject=libhull --format=cyclonedx > libhull.sbom.cdx.json
          ./hull-linux-x86_64 sbom --subject=libhull --format=spdx      > libhull.sbom.spdx.json
          # Per-flavor SBOMs for the published `hull build --flavor` platform
          # libs. Named to match libhull_platform-<flavor>.a. Today only
          # pure-compute differs (drops Keel + mbedTLS); the others equal the
          # full hull SBOM minus the binary hash, published for symmetry so a
          # `hull platform install <flavor>` consumer has its own bill.
          for f in pure-compute; do
            ./hull-linux-x86_64 sbom --flavor="$f" --format=json      > "libhull_platform-$f.sbom.json"
            ./hull-linux-x86_64 sbom --flavor="$f" --format=cyclonedx > "libhull_platform-$f.sbom.cdx.json"
            ./hull-linux-x86_64 sbom --flavor="$f" --format=spdx      > "libhull_platform-$f.sbom.spdx.json"
          done
          ls -la hull.sbom.* libhull.sbom.* libhull_platform-*.sbom.*

      - name: Generate build-environment manifest
        # §0.3.14. Capture the release-workflow runner identity, commit,
        # and workflow-run URL into hull.build-env.json. Goes into
        # hull.sha256 below so it inherits all three signature layers
        # (Ed25519 + Sigstore + SLSA). Per-platform compile environment
        # (cc version, runner image per matrix arch, build flags) is
        # captured separately by the SLSA build-provenance attestation
        # for each binary; query via:
        #   gh attestation list --repo artalis-io/hull
        # The note inside the JSON points consumers there. Full per-arch
        # env capture in this file is §0.3.14b (deferred; needs each
        # build-native matrix job to upload its own env artifact).
        working-directory: dist
        run: |
          cat > hull.build-env.json <<EOF
          {
            "release_tag": "${GITHUB_REF_NAME}",
            "commit_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "repository": "${GITHUB_REPOSITORY}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "release_runner": {
              "os": "${ImageOS:-unknown}",
              "image_version": "${ImageVersion:-unknown}",
              "runner_arch": "${RUNNER_ARCH:-unknown}",
              "uname": "$(uname -srm)"
            },
            "per_binary_provenance_hint": "Per-platform build-runner details are recorded in the SLSA build-provenance attestation for each binary; query via 'gh attestation list --repo ${GITHUB_REPOSITORY}'."
          }
          EOF
          cat hull.build-env.json

      - name: Compute SHA-256 checksums
        # `hull tools install <name>` looks up entries by exact asset
        # name in this manifest — keep the file list in sync with the
        # tool registry in src/hull/tools_install.c.
        # SBOM + build-env files included here so they inherit the
        # release signature (Ed25519 + Sigstore + SLSA).
        working-directory: dist
        run: |
          sha256sum hull-cosmo hull-linux-x86_64 hull-linux-aarch64 hull-darwin-arm64 \
                    hull-wamrc-linux-x86_64 hull-wamrc-linux-aarch64 hull-wamrc-darwin-arm64 \
                    hull-tcc-linux-x86_64 hull-tcc-linux-aarch64 \
                    hull.sbom.json hull.sbom.cdx.json hull.sbom.spdx.json \
                    libhull.sbom.json libhull.sbom.cdx.json libhull.sbom.spdx.json \
                    libhull_platform-*.sbom.* \
                    hull.build-env.json \
                    libhull_platform-*.a \
                    libhull-linux-x86_64.a libhull-linux-aarch64.a libhull-darwin-arm64.a \
                    libhull.x86_64-cosmo.a libhull.aarch64-cosmo.a \
                    libhull_feature-*.a \
                    > hull.sha256
          cat hull.sha256

      - name: Sign release manifest (Ed25519)
        env:
          HULL_RELEASE_KEY: ${{ secrets.HULL_RELEASE_KEY }}
        working-directory: dist
        run: |
          # The native-linux artifact embeds the 'hull sign-release'
          # subcommand. We use it to sign the SHA-256 manifest with the
          # Ed25519 secret key from the repo secret HULL_RELEASE_KEY
          # (128 hex chars, generated offline with 'hull keygen release').
          # If the secret is unset, the release ships without .sig and
          # 'hull update' falls back to SHA-256 only.
          if [ -z "$HULL_RELEASE_KEY" ]; then
            echo "::warning::HULL_RELEASE_KEY is not set; release will ship without hull.sha256.sig"
            exit 0
          fi
          umask 077
          printf '%s\n' "$HULL_RELEASE_KEY" > /tmp/release.key
          chmod +x ./hull-linux-x86_64
          ./hull-linux-x86_64 sign-release hull.sha256 --key /tmp/release.key
          rm -f /tmp/release.key
          test -s hull.sha256.sig
          echo "--- hull.sha256.sig:"
          cat hull.sha256.sig

      - name: Install cosign
        # §0.3.4 prerequisite. Installs the Sigstore cosign binary so we
        # can publish the release manifest to the Rekor transparency log.
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Publish manifest to Rekor transparency log
        # §0.3.4. Sign hull.sha256 via Sigstore (OIDC -> Fulcio short-lived
        # cert) and submit the signature + cert + manifest digest to
        # https://rekor.sigstore.dev. The Rekor log entry is append-only
        # and externally auditable; anyone can prove a release wasn't
        # backdated. Independent of HULL_RELEASE_KEY (separate trust
        # root); HULL_RELEASE_KEY signing remains the primary path for
        # `hull update` clients with no Sigstore dependency.
        working-directory: dist
        run: |
          cosign sign-blob hull.sha256 \
            --rekor-url=https://rekor.sigstore.dev \
            --yes \
            --output-signature=hull.sha256.cosign.sig \
            --output-certificate=hull.sha256.cosign.pem
          echo "--- hull.sha256.cosign.sig (Sigstore):"
          cat hull.sha256.cosign.sig
          echo "--- hull.sha256.cosign.pem (first 3 lines):"
          head -3 hull.sha256.cosign.pem

      - name: Attest build provenance (SLSA)
        # §0.3.5. Sigstore-signed attestation linking each binary to this
        # commit + workflow run + runner image. Verifiable with
        # `gh attestation verify <binary> --repo artalis-io/hull`.
        # Independent of HULL_RELEASE_KEY: provenance is signed via
        # GitHub OIDC + Fulcio short-lived cert, not the gethull key.
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v2
        with:
          subject-path: |
            dist/hull-cosmo
            dist/hull-linux-x86_64
            dist/hull-linux-aarch64
            dist/hull-darwin-arm64
            dist/hull-wamrc-linux-x86_64
            dist/hull-wamrc-linux-aarch64
            dist/hull-wamrc-darwin-arm64
            dist/hull-tcc-linux-x86_64
            dist/hull-tcc-linux-aarch64
            dist/hull.sha256
            dist/hull.sbom.json
            dist/hull.sbom.cdx.json
            dist/hull.sbom.spdx.json
            dist/hull.build-env.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build asset list — include hull.sha256.sig only if it was produced.
          assets=(
            dist/hull-cosmo
            dist/hull-linux-x86_64
            dist/hull-linux-aarch64
            dist/hull-darwin-arm64
            dist/hull-wamrc-linux-x86_64
            dist/hull-wamrc-linux-aarch64
            dist/hull-wamrc-darwin-arm64
            dist/hull-tcc-linux-x86_64
            dist/hull-tcc-linux-aarch64
            dist/hull.sha256
            dist/hull.sbom.json
            dist/hull.sbom.cdx.json
            dist/hull.sbom.spdx.json
            dist/hull.build-env.json
            dist/hull.sha256.cosign.sig
            dist/hull.sha256.cosign.pem
          )
          # Per-flavor platform libs (libhull_platform-<flavor>-<arch>.a), so
          # `hull platform install <flavor>` can fetch them. Covered by
          # hull.sha256 above, so they inherit the release signature.
          assets+=(dist/libhull_platform-*.a)
          # Composable feature archives (libhull_feature-<name>-<arch>.a), so
          # `hull feature install <name>` can fetch them. Also covered by
          # hull.sha256, so they inherit the release signature.
          assets+=(dist/libhull_feature-*.a)
          # libhull no-runtime embedding archives (native per-arch + dual-arch
          # cosmo) and the libhull-scoped SBOMs. Also covered by hull.sha256.
          assets+=(
            dist/libhull-linux-x86_64.a
            dist/libhull-linux-aarch64.a
            dist/libhull-darwin-arm64.a
            dist/libhull.x86_64-cosmo.a
            dist/libhull.aarch64-cosmo.a
            dist/libhull.sbom.json
            dist/libhull.sbom.cdx.json
            dist/libhull.sbom.spdx.json
          )
          # Per-flavor platform-lib SBOMs (hull sbom --flavor).
          assets+=(dist/libhull_platform-*.sbom.*)
          if [ -f dist/hull.sha256.sig ]; then
            assets+=(dist/hull.sha256.sig)
          fi
          # Idempotent: if the release already exists (e.g. created manually
          # alongside the tag push), upload assets onto it instead of failing.
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists — uploading assets with --clobber"
            gh release upload "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --clobber \
              "${assets[@]}"
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "Hull ${{ github.ref_name }}" \
              --generate-notes \
              ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
              "${assets[@]}"
          fi
