name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Stage 1: build the platform libraries (libhull_platform.a per arch).
  # These artifacts feed into both sign-platform-manifest (which hashes
  # them) and the hull-binary build jobs (which embed them). Splitting
  # platform-build out of hull-build avoids the platform .a being
  # rebuilt twice with potentially-different timestamps on different
  # machines — sign-platform-manifest's manifest hash MUST match the .a
  # bytes that build-native/build-cosmo embed, so the only way to
  # guarantee bit-equality is to build the .a once and reuse it via
  # GitHub Actions artifacts.
  # ────────────────────────────────────────────────────────────────────

  build-platform-native:
    name: Build platform (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      # Linux builds in the snapshot-pinned reproducible container (roadmap
      # 0.3.1) so the shipped platform .a is byte-reproducible across time.
      # macOS builds bare: no container touches the macos-15 Xcode runner.
      - name: Build platform library (Linux, reproducible container)
        if: runner.os == 'Linux'
        uses: ./.github/actions/hull-build-container
        with:
          run: make platform
      - name: Build platform library (macOS)
        if: runner.os == 'macOS'
        run: make platform

      - name: Upload libhull_platform.a
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: platform-${{ matrix.name }}
          path: build/libhull_platform.a

      # Embedded runtime / HTTP-core / web-bindings / tui-bridge feature archives
      # (issue #114). These ship INSIDE hull and are composed into apps at
      # `hull build`; the runtime composed-feature check (signature.c §5c) attests
      # each recorded hash against the signed platform manifest. So the EXACT bytes
      # must be signed by sign-platform-manifest and embedded as-is in stage 3
      # (TRUST_FEATURE_LIBS=1) — same download+trust discipline as libhull_platform.a
      # (macOS isn't byte-reproducible across runners). Cosmo has no embedded
      # feature archives (fat APE), so this is native-only.
      - name: Build embedded feature archives (Linux, reproducible container)
        if: runner.os == 'Linux'
        uses: ./.github/actions/hull-build-container
        with:
          # The embedded-archive set is the FEATURE_EMBEDDED_STEMS registry in
          # mk/feature.mk (Phase 4). feature-embedded builds all of them, so
          # adding an embedded feature is one edit there, not four here.
          run: make feature-embedded
      - name: Build embedded feature archives (macOS)
        if: runner.os == 'macOS'
        run: make feature-embedded
      - name: Stage embedded feature archives (registry-explicit)
        # Copy exactly the FEATURE_EMBEDDED_STEMS archives (via the registry
        # print target) into a clean dir, so the uploaded artifact is precisely
        # those regardless of anything else that may sit in build/.
        run: |
          mkdir -p features-out
          cp $(make -s print-feature-embedded-libs) features-out/
      - name: Upload embedded feature archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: platform-features-${{ matrix.name }}
          path: features-out/libhull_feature-*.a

      # Per-flavor platform libs for `hull build --flavor` + `hull platform
      # install`. Each native platform-<flavor> target builds into its own obj
      # dir (build/flavor-<flavor>/), so the full libhull_platform.a above is
      # untouched. Publish them arch-qualified: libhull_platform-<flavor>-<arch>.a.
      # (Cosmo flavor libs are not published yet; build from source with
      # `make platform-cosmo-<flavor>`. See docs/build_flavors.md §7.)
      - name: Build platform flavors (Linux, reproducible container)
        if: runner.os == 'Linux'
        uses: ./.github/actions/hull-build-container
        with:
          # `slim` is not a --flavor preset: it is the combined app-build base
          # (SQLite-less + TLS-less; docs/sqlite_feature.md + docs/tls_feature.md),
          # built by the `platform-slim` target (HL_SQLITE_FEATURE=1 HL_TLS_FEATURE=1
          # sub-build) and embedded by stage 3 when HL_APP_BASE_SQLITELESS=1 AND
          # HL_APP_BASE_TLSLESS=1. It shares this step's obj-dir isolation +
          # arch-qualified naming.
          run: |
            for f in slim; do
              make "platform-$f"
              mv "build/libhull_platform-$f.a" \
                 "build/libhull_platform-$f-${{ matrix.name }}.a"
            done
      - name: Build platform flavors (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in slim; do
            make "platform-$f"
            mv "build/libhull_platform-$f.a" \
               "build/libhull_platform-$f-${{ matrix.name }}.a"
          done

      - name: Upload platform flavors
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: platform-flavors-${{ matrix.name }}
          path: build/libhull_platform-*-${{ matrix.name }}.a

  build-platform-cosmo:
    name: Build platform (cosmo, multi-arch)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      # cosmocc is baked into the reproducible container (roadmap 0.3.1), so
      # there is no fetch step; the dual-arch platform .a's are frozen with it.
      - name: Build platform (multi-arch, reproducible container)
        uses: ./.github/actions/hull-build-container
        with:
          run: make platform-cosmo

      - name: Upload cosmo platform archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: platform-cosmo
          path: |
            build/libhull_platform.x86_64-cosmo.a
            build/libhull_platform.aarch64-cosmo.a


  # ────────────────────────────────────────────────────────────────────
  # Stage 2: build + sign the platform manifest. Generates the
  # `embedded_platform_sig.h` header that gets baked into every hull
  # binary in stage 3. Uses the previous stable hull (v0.1.2) to
  # invoke `hull sign-release` for the Ed25519 signing — v0.1.2 hull
  # is the most recent release; its sign-release subcommand is
  # key-agnostic, so it signs whatever bytes we point it at with
  # whichever secret we supply.
  #
  # Bootstrap check: hard-fail if HULL_PLATFORM_KEY is empty. This
  # secret has been in the GH secrets since v0.1.0 (set when
  # sign-platform was first wired); v0.1.3 is the first release that
  # actually requires it at the workflow level.
  # ────────────────────────────────────────────────────────────────────

  sign-platform-manifest:
    name: Sign platform manifest
    runs-on: ubuntu-24.04
    needs: [build-platform-native, build-platform-cosmo]
    env:
      HULL_PLATFORM_KEY: ${{ secrets.HULL_PLATFORM_KEY }}
      # Hull version used to invoke `hull sign-release`. Pinned to a
      # known-good prior release so the bootstrap is deterministic.
      # Update only when v0.1.2 stops being a usable signer.
      HULL_BOOTSTRAP_VERSION: v0.1.2

    steps:
      - name: Bootstrap check
        run: |
          if [ -z "$HULL_PLATFORM_KEY" ]; then
            echo "::error::HULL_PLATFORM_KEY is empty. v0.1.3+ requires"
            echo "::error::it for the signed platform manifest. The secret"
            echo "::error::has been provisioned since v0.1.0 — check the"
            echo "::error::repo secrets configuration."
            exit 1
          fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: platform-*
          path: platforms/

      - name: Install hull ${{ env.HULL_BOOTSTRAP_VERSION }} (signer)
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/artalis-io/hull/releases/download/${HULL_BOOTSTRAP_VERSION}/hull-linux-x86_64" \
            -o /tmp/hull-signer
          chmod +x /tmp/hull-signer
          /tmp/hull-signer version

      - name: Build canonical platform manifest
        # One line per arch: "<64-hex-sha256>  <arch>\n".
        # Sort key: arch name (LC_ALL=C, second field). MUST match the
        # arch_entry_cmp order in src/hull/platform_sig.c so the C
        # builder and CI produce byte-identical manifests for the same
        # input set — otherwise round-tripping through
        # hl_platform_sig_build_manifest would yield a different SHA
        # than the embedded blob.
        # Same format as hull.sha256; matches what
        # hl_release_io_find_checksum parses at runtime.
        run: |
          set -eu
          {
            # The native arch entry hashes the EMBEDDED app-build base. Stage 3
            # embeds the SLIM base (SQLite-less + TLS-less; docs/sqlite_feature.md
            # + docs/tls_feature.md, via HL_APP_BASE_SQLITELESS=1 HL_APP_BASE_TLSLESS=1),
            # so verify_platform checks it against THIS hash -- hash the slim base,
            # not the full one. Cosmo keeps both in-base (no drop), so its entries
            # are the full cosmo archives.
            sha256sum \
              platforms/platform-flavors-linux-x86_64/libhull_platform-slim-linux-x86_64.a \
              | awk '{print $1"  linux-x86_64"}'
            sha256sum \
              platforms/platform-flavors-linux-aarch64/libhull_platform-slim-linux-aarch64.a \
              | awk '{print $1"  linux-aarch64"}'
            sha256sum \
              platforms/platform-flavors-darwin-arm64/libhull_platform-slim-darwin-arm64.a \
              | awk '{print $1"  darwin-arm64"}'
            sha256sum \
              platforms/platform-cosmo/libhull_platform.x86_64-cosmo.a \
              | awk '{print $1"  cosmo-x86_64"}'
            sha256sum \
              platforms/platform-cosmo/libhull_platform.aarch64-cosmo.a \
              | awk '{print $1"  cosmo-aarch64"}'
            # Embedded feature archives (issue #114 + SQLite Phase C.2b/D), native
            # arches only (cosmo composes nothing). Name column is the COMPOSED
            # asset name that build.lua records in package.sig.gethull.composed
            # and that the runtime §5c looks up: "libhull_feature-<stem>.<arch>.a".
            # `sqlite` = the engine (Phase D), `sqlite-lua`/`sqlite-js` = the udf
            # bridges (Phase C.2b). `tls` = the mbedTLS + crypto/transport backends
            # (docs/tls_feature.md, a2; one archive, no per-runtime bridge).
            # Glob the downloaded embedded archives (the FEATURE_EMBEDDED_STEMS
            # set that feature-embedded produced + uploaded) rather than a
            # hardcoded stem list; the stem is recovered from each filename.
            for arch in linux-x86_64 linux-aarch64 darwin-arm64; do
              for f in platforms/platform-features-$arch/libhull_feature-*.a; do
                stem=$(basename "$f" .a); stem=${stem#libhull_feature-}
                sha256sum "$f" \
                  | awk -v n="libhull_feature-$stem.$arch.a" '{print $1"  "n}'
              done
            done
          } | LC_ALL=C sort -k2,2 > platform-manifest.txt
          echo "--- platform-manifest.txt ($(wc -l < platform-manifest.txt) entries):"
          cat platform-manifest.txt

      - name: Sign platform manifest (Ed25519)
        run: |
          set -eu
          umask 077
          printf '%s\n' "$HULL_PLATFORM_KEY" > /tmp/platform.key
          # hull sign-release writes <input>.sig — works for any text
          # manifest, not just hull.sha256. Same signing primitive.
          /tmp/hull-signer sign-release platform-manifest.txt --key /tmp/platform.key
          rm -f /tmp/platform.key
          test -s platform-manifest.txt.sig
          echo "--- platform-manifest.txt.sig:"
          cat platform-manifest.txt.sig

      - name: Generate embedded_platform_sig.h
        # xxd emits "unsigned char <name>[] = { ... };" and
        # "unsigned int <name>_len = ...;". The -n flag sets <name>;
        # we use the exact symbol names the source expects (see
        # src/hull/embedded_platform_sig.c).
        run: |
          set -eu
          mkdir -p build
          {
            echo '/* Auto-generated by .github/workflows/release.yml */'
            echo '/* sign-platform-manifest step. Do not edit. */'
            xxd -i -n hl_embedded_platform_sig_manifest \
                platform-manifest.txt
            xxd -i -n hl_embedded_platform_sig_signature \
                platform-manifest.txt.sig
          } > build/embedded_platform_sig.h
          echo "--- embedded_platform_sig.h ($(wc -c < build/embedded_platform_sig.h) bytes):"
          head -20 build/embedded_platform_sig.h
          echo "..."

      - name: Stage signed manifest for upload
        # Co-locate manifest text + .sig + .h so downstream jobs get a
        # single directory with everything they need:
        #   embedded_platform_sig.h — the C symbol embedded in hull
        #   platform-manifest.txt   — raw text (one line per arch),
        #                              used by build-* to sha256-verify
        #                              the .a they're about to embed
        #   platform-manifest.txt.sig — signature for offline audit
        run: |
          set -eu
          cp platform-manifest.txt platform-manifest.txt.sig build/

      - name: Upload signed manifest + header
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: embedded-platform-sig
          path: |
            build/embedded_platform_sig.h
            build/platform-manifest.txt
            build/platform-manifest.txt.sig

  # ────────────────────────────────────────────────────────────────────
  # Stage 3: build hull binaries with the signed manifest embedded.
  # These jobs DOWNLOAD their respective libhull_platform.a from stage
  # 1's artifacts (rather than rebuilding) — guarantees the embedded .a
  # bytes match what sign-platform-manifest hashed. They also download
  # the signed manifest header so HL_EMBED_PLATFORM_SIG gets defined
  # and embedded_platform_sig.c links the real signed blob.
  # ────────────────────────────────────────────────────────────────────

  build-cosmo:
    name: Build (Cosmopolitan APE)
    runs-on: ubuntu-24.04
    needs: [build-platform-cosmo, sign-platform-manifest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      # cosmocc is baked into the reproducible container (roadmap 0.3.1); the
      # build steps below run inside it, so there is no host fetch.
      - name: Download cosmo platform archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: platform-cosmo
          path: build/

      - name: Download signed manifest header
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: embedded-platform-sig
          path: build/

      - name: Verify downloaded .a files match signed manifest
        # Catch any drift between sign-platform-manifest's input and
        # what we're about to embed BEFORE wasting compute on the build.
        # Without this guard, a .a mismatch would silently ship a hull
        # binary that can't pass its own platform-sig cross-check at
        # `hull build --sign` time (exactly the v0.1.3-rc bug).
        run: |
          set -eu
          fail=0
          for entry in "cosmo-x86_64:build/libhull_platform.x86_64-cosmo.a" \
                       "cosmo-aarch64:build/libhull_platform.aarch64-cosmo.a"; do
            arch="${entry%%:*}"
            file="${entry##*:}"
            actual=$(sha256sum "$file" | awk '{print $1}')
            expected=$(awk -v a="$arch" '$2==a {print $1}' build/platform-manifest.txt)
            if [ -z "$expected" ]; then
              echo "::error::arch '$arch' not in signed manifest"
              fail=1
            elif [ "$actual" != "$expected" ]; then
              echo "::error::$file SHA mismatch: expected=$expected actual=$actual"
              fail=1
            else
              echo "✓ $arch .a SHA matches signed manifest: $actual"
            fi
          done
          [ "$fail" = 0 ] || exit 1

      # Build inside the snapshot-pinned reproducible container (roadmap 0.3.1).
      # cosmocc is baked in. Hardening summary runs in the same container step so
      # no host make touches the tree after the build. Default root (not
      # user: host): the host-side smoke test only executes build/hull, which is
      # world-executable, and no host step writes into build/ here (the cosmo
      # Platform-sig E2E is skipped). This matches the proven reproducibility-cosmo
      # CI job. No TRUST_PLATFORM_LIB needed for cosmo: the .a's at
      # build/libhull_platform.{x86_64,aarch64}-cosmo.a have no build rule in the
      # Makefile (produced by the .PHONY platform-cosmo target during native
      # development), so make treats them as leaf inputs and will not rebuild.
      - name: Build hull (cosmo APE, reproducible container)
        uses: ./.github/actions/hull-build-container
        with:
          run: |
            make CC=cosmocc hardening
            make CC=cosmocc EMBED_PLATFORM=cosmo

      - name: Smoke-test version
        run: ./build/hull version

      - name: Platform-sig E2E smoke test (SKIPPED for cosmo)
        # v0.1.4 attempted to re-enable this (with widened unveils +
        # cosmocc auto-detect from §3.1). It still fails — but for a
        # deeper reason than f3311cd's original diagnosis. The unveils
        # ARE now correct (the sandbox log shows "16 unveiled paths"
        # including /opt where cosmocc lives), but spawning any child
        # process from a cosmo APE running under the jart pledge
        # polyfill on Linux still hits:
        #
        #   /bin/sh: error while loading shared libraries: libc.so.6:
        #            failed to map segment from shared object
        #   /usr/bin/cc: ... libc.so.6: failed to map segment ...
        #
        # That's mmap(PROT_EXEC) from the child's dynamic linker being
        # rejected by the parent's seccomp-bpf filter — an mmap-policy
        # restriction in the polyfill itself, NOT an unveil/path issue.
        # Widening the unveil set can't fix it.
        #
        # The native build jobs (darwin-arm64, linux-x86_64,
        # linux-aarch64) DO run the full platform-sig E2E end-to-end
        # under BOTH --no-sandbox and the real sandbox. Same canonical-
        # JSON reconstruction, same hl_platform_sig_verify, same
        # hl_sig_verify code. Three independent arch coverages are
        # sufficient gating for the gethull signature chain.
        #
        # Cosmo-specific gating would need either (a) a different
        # pledge polyfill that allows child-process PROT_EXEC mmap, or
        # (b) running the cosmo APE without --no-sandbox on a host that
        # ignores cosmo's polyfill (e.g. macOS), or (c) the embedded
        # TCC path on cosmo (currently unsupported — cosmo .a archives
        # need cosmocc to link). All non-trivial; tracked separately.
        run: |
          echo "Platform-sig E2E smoke test: SKIPPED for cosmo build."
          echo "See comment above. Native jobs gate the signature chain."

      - name: Rename artifact
        run: cp build/hull hull-cosmo

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hull-cosmo
          path: hull-cosmo

      # ── libhull: dual-arch cosmo embedding archive ──
      # Under the fat cosmocc driver, `make libhull` emits build/libhull.a
      # (x86_64) plus its build/.aarch64/libhull.a sibling. Publish them
      # arch-qualified, mirroring libhull_platform.{x86_64,aarch64}-cosmo.a.
      - name: Build + rename cosmo libhull.a (dual-arch, reproducible container)
        uses: ./.github/actions/hull-build-container
        with:
          run: |
            make libhull CC=cosmocc
            cp build/libhull.a          libhull.x86_64-cosmo.a
            cp build/.aarch64/libhull.a libhull.aarch64-cosmo.a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: libhull-cosmo
          path: |
            libhull.x86_64-cosmo.a
            libhull.aarch64-cosmo.a

  build-native:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [build-platform-native, sign-platform-manifest]

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            artifact: hull-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            artifact: hull-linux-aarch64
          - name: darwin-arm64
            os: macos-15
            artifact: hull-darwin-arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Download libhull_platform.a (this arch)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: platform-${{ matrix.name }}
          path: build/

      # Embedded feature archives (issue #114). Land them in build/ under their
      # plain names so `make ... TRUST_FEATURE_LIBS=1` embeds these exact (signed)
      # bytes rather than re-archiving from source.
      - name: Download embedded feature archives (this arch)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: platform-features-${{ matrix.name }}
          path: build/

      # The SLIM app-build base (SQLite-less + TLS-less; docs/sqlite_feature.md +
      # docs/tls_feature.md). Land it at build/libhull_platform-slim.a (the name
      # the Makefile's SLIM_PLATFORM_LIB + TRUST_PLATFORM_LIB expect) so
      # HL_APP_BASE_SQLITELESS=1 HL_APP_BASE_TLSLESS=1 embeds these exact signed bytes.
      - name: Download SLIM app-build base (this arch)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: platform-flavors-${{ matrix.name }}
          path: build/flavors/
      - name: Stage SLIM base
        run: cp build/flavors/libhull_platform-slim-${{ matrix.name }}.a build/libhull_platform-slim.a

      - name: Download signed manifest header
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: embedded-platform-sig
          path: build/

      - name: Verify downloaded .a matches signed manifest
        # Catch any drift between sign-platform-manifest's input and
        # what we're about to embed BEFORE wasting compute on the build.
        # See same step in build-cosmo for rationale.
        run: |
          set -eu
          # The native arch entry hashes the SLIM base (what stage 3 embeds via
          # HL_APP_BASE_SQLITELESS=1 HL_APP_BASE_TLSLESS=1), so verify THAT against it.
          actual=$(sha256sum build/libhull_platform-slim.a | awk '{print $1}')
          expected=$(awk -v a="${{ matrix.name }}" '$2==a {print $1}' build/platform-manifest.txt)
          if [ -z "$expected" ]; then
            echo "::error::arch '${{ matrix.name }}' not in signed manifest"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::SLIM base SHA mismatch"
            echo "  expected (signed manifest): $expected"
            echo "  actual   (downloaded .a):   $actual"
            exit 1
          fi
          echo "✓ ${{ matrix.name }} SLIM base SHA matches signed manifest: $actual"
          # Same cross-check for each embedded feature archive: its downloaded
          # bytes MUST match the signed-manifest entry keyed by the composed asset
          # name (libhull_feature-<stem>.<arch>.a), or the runtime §5c check on
          # every app this hull builds would fail. Includes the SQLite engine
          # (sqlite) + udf bridges (sqlite-lua/sqlite-js) + the TLS backends (tls).
          for stem in $(make -s print-feature-embedded-stems); do
            fa="build/libhull_feature-$stem.a"
            name="libhull_feature-$stem.${{ matrix.name }}.a"
            fact=$(sha256sum "$fa" | awk '{print $1}')
            exp=$(awk -v n="$name" '$2==n {print $1}' build/platform-manifest.txt)
            if [ -z "$exp" ]; then
              echo "::error::$name not in signed manifest"; exit 1
            fi
            if [ "$fact" != "$exp" ]; then
              echo "::error::$name SHA mismatch (expected $exp, got $fact)"; exit 1
            fi
            echo "✓ $name SHA matches signed manifest: $fact"
          done

      # Linux builds in the snapshot-pinned reproducible container (roadmap
      # 0.3.1) so the shipped hull is byte-reproducible across time; user: host
      # makes build/ host-owned for the Platform-sig E2E below (which does
      # keygen/sign into build/ and runs the freshly built binary). Hardening
      # summary + verification run in the same container step so no host make
      # touches the tree after the reproducible build. macOS builds bare: no
      # container touches the macos-15 Xcode runner.
      #
      # TRUST_PLATFORM_LIB=1 short-circuits $(PLATFORM_LIB)'s rebuild rule in the
      # Makefile; make treats the downloaded .a as a pristine leaf input and
      # never re-archives it from source. The downloaded .a's bytes are the ones
      # sign-platform-manifest hashed, and they get embedded as-is. Without this,
      # make sees PLATFORM_OBJS / CANARY_OBJ as newer than the .a and rebuilds it
      # from scratch; the rebuilt bytes differ from the signed manifest entry on
      # a different runner, breaking the gethull cross-check.
      # TRUST_FEATURE_LIBS=1 does the same for the embedded runtime/HTTP/tui-bridge
      # feature archives (issue #114 §5c): the downloaded, signed bytes are embedded
      # as-is so the runtime composed-feature check matches the signed manifest.
      - name: Build hull + verify hardening (Linux, reproducible container)
        if: runner.os == 'Linux'
        uses: ./.github/actions/hull-build-container
        with:
          user: host
          run: |
            make EMBED_PLATFORM=1 HL_APP_BASE_SQLITELESS=1 HL_APP_BASE_TLSLESS=1 TRUST_PLATFORM_LIB=1 TRUST_FEATURE_LIBS=1
            # hardening/check-hardening MUST carry the same EMBED flags. check-hardening
            # depends on $(BUILDDIR)/hull; run plain, it rebuilds the shared build_assets.o
            # in the non-EMBED (stub) config and relinks hull WITHOUT the embedded platform
            # (EMBED_PLATFORM isn't in the config-sentinel fingerprint), which then breaks
            # the Platform-sig E2E + the released binary. Same flags = no non-EMBED rebuild.
            make hardening EMBED_PLATFORM=1 HL_APP_BASE_SQLITELESS=1 HL_APP_BASE_TLSLESS=1 TRUST_PLATFORM_LIB=1 TRUST_FEATURE_LIBS=1
            make check-hardening EMBED_PLATFORM=1 HL_APP_BASE_SQLITELESS=1 HL_APP_BASE_TLSLESS=1 TRUST_PLATFORM_LIB=1 TRUST_FEATURE_LIBS=1
      - name: Build hull with embedded platform (macOS)
        if: runner.os == 'macOS'
        run: make EMBED_PLATFORM=1 HL_APP_BASE_SQLITELESS=1 HL_APP_BASE_TLSLESS=1 TRUST_PLATFORM_LIB=1 TRUST_FEATURE_LIBS=1
      - name: Hardening summary (macOS)
        if: runner.os == 'macOS'
        # Same EMBED flags as the build (see the Linux step) so this does not
        # rebuild build_assets.o / hull in the non-EMBED config.
        run: make hardening EMBED_PLATFORM=1 HL_APP_BASE_SQLITELESS=1 HL_APP_BASE_TLSLESS=1 TRUST_PLATFORM_LIB=1 TRUST_FEATURE_LIBS=1
      - name: Hardening verification (macOS)
        # Verifies the just-built binary carries the expected compiler/linker
        # hardening properties (PIE, RELRO+BIND_NOW, NX, canaries, CET/BTI).
        # Required protections missing for this platform cause a non-zero exit
        # and the release fails.
        if: runner.os == 'macOS'
        # Same EMBED flags (see the Linux step): plain check-hardening rebuilds
        # build_assets.o + relinks hull WITHOUT the embedded platform.
        run: make check-hardening EMBED_PLATFORM=1 HL_APP_BASE_SQLITELESS=1 HL_APP_BASE_TLSLESS=1 TRUST_PLATFORM_LIB=1 TRUST_FEATURE_LIBS=1

      - name: Smoke-test version + platform
        run: |
          ./build/hull version
          ./build/hull doctor | grep -E "embedded\s+yes|hull build" || (echo "::error::Platform library not embedded"; exit 1)

      - name: Platform-sig E2E smoke test
        # Build a signed app with the freshly-baked hull binary, exercising
        # the full chain: hull build cross-checks the .a's SHA against the
        # gethull manifest IT embeds, then the output binary runs under
        # --verify-sig and re-verifies the gethull layer at startup. This
        # is the test that would have caught the v0.1.3-rc bug; release
        # cannot proceed past this point if either layer is broken.
        run: |
          set -eu
          "${GITHUB_WORKSPACE}/build/hull" keygen "${GITHUB_WORKSPACE}/build/plat"
          "${GITHUB_WORKSPACE}/build/hull" sign-platform \
              --dir "${GITHUB_WORKSPACE}/build/" \
              "${GITHUB_WORKSPACE}/build/plat"
          TMP=$(mktemp -d)
          cd "$TMP"
          cat > app.lua <<'LUA'
          app.manifest({modules = {"hull/http-server@1"}})
          app.get("/", function(req, res) res:json({ok=true}) end)
          LUA
          "${GITHUB_WORKSPACE}/build/hull" keygen dev
          "${GITHUB_WORKSPACE}/build/hull" build --sign dev.key -o myapp .
          test -x myapp
          # Variant A: --no-sandbox. Primary gate; confirms the
          # signature chain works end-to-end without fighting the
          # runtime sandbox during CI (which has its own polyfill
          # quirks per platform).
          ./myapp --verify-sig dev.pub --no-sandbox -p 19888 ./app.lua &
          SVR=$!
          sleep 3
          if ! kill -0 "$SVR" 2>/dev/null; then
            echo "::error::myapp failed to start under --verify-sig --no-sandbox (platform-sig check broken)"
            exit 1
          fi
          RESP=$(curl -fsS http://127.0.0.1:19888/ || echo FAIL)
          kill "$SVR" 2>/dev/null || true
          wait "$SVR" 2>/dev/null || true
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::wrong response: $RESP"; exit 1; }
          echo "✓ platform-sig E2E variant A (build --sign + --verify-sig --no-sandbox) passes"

          # Variant B: full sandbox. Catches any signature-chain code
          # that accidentally needs paths/syscalls the sandbox blocks.
          # Same myapp binary, same keys — only the sandbox is
          # different.
          ./myapp --verify-sig dev.pub -p 19889 ./app.lua &
          SVR=$!
          sleep 3
          if ! kill -0 "$SVR" 2>/dev/null; then
            echo "::error::myapp failed to start under --verify-sig + sandbox"
            echo "::error::the sig chain works without sandbox but breaks under it"
            exit 1
          fi
          RESP=$(curl -fsS http://127.0.0.1:19889/ || echo FAIL)
          kill "$SVR" 2>/dev/null || true
          wait "$SVR" 2>/dev/null || true
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::wrong response under sandbox: $RESP"; exit 1; }
          echo "✓ platform-sig E2E variant B (build --sign + --verify-sig WITH sandbox) passes"

      - name: Rename artifact
        run: cp build/hull ${{ matrix.artifact }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      # ── libhull: the no-runtime embedding archive for this arch ──
      # Built from the same objects as the hull binary above; published so
      # hl_embed_* native hosts can fetch + verify a known-good archive.
      # Its SHA-256 goes into the release-signed hull.sha256 manifest.
      - name: Build + rename libhull.a (Linux, reproducible container)
        if: runner.os == 'Linux'
        uses: ./.github/actions/hull-build-container
        with:
          user: host
          run: |
            make libhull
            cp build/libhull.a libhull-${{ matrix.name }}.a
      - name: Build + rename libhull.a (macOS)
        if: runner.os == 'macOS'
        run: |
          make libhull
          cp build/libhull.a libhull-${{ matrix.name }}.a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: libhull-${{ matrix.name }}
          path: libhull-${{ matrix.name }}.a

  build-wamrc:
    # Side-loaded `wamrc` (WAMR AOT compiler) shipped as a separate
    # release asset and pulled by `hull tools install wamrc`. See
    # docs/tools_install.md. The trust chain reuses the same
    # Ed25519-signed hull.sha256 manifest — each wamrc artifact is
    # listed in the manifest below.
    #
    # No cosmo wamrc: LLVM doesn't fit cleanly into a cosmocc fat APE
    # binary. Cosmo users build from source with `make wamrc`.
    name: Build wamrc (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            artifact: hull-wamrc-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            artifact: hull-wamrc-linux-aarch64
          - name: darwin-arm64
            os: macos-15
            artifact: hull-wamrc-darwin-arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install LLVM + cmake (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev cmake

      - name: Install LLVM + cmake (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@18 cmake

      - name: Build wamrc
        run: |
          # Declare separately so shellcheck SC2155 doesn't flag the
          # masked return value from $(llvm-config-18 ...).
          if command -v llvm-config-18 >/dev/null 2>&1; then
            llvm_cmakedir=$(llvm-config-18 --cmakedir)
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=${llvm_cmakedir}"
          elif [ -d /opt/homebrew/opt/llvm@18 ]; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=/opt/homebrew/opt/llvm@18/lib/cmake/llvm"
          elif [ -d /usr/local/opt/llvm@18 ]; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=/usr/local/opt/llvm@18/lib/cmake/llvm"
          fi
          make wamrc
          strip build/wamrc 2>/dev/null || true

      - name: Smoke-test wamrc
        run: ./build/wamrc --help | head -5

      - name: Rename artifact
        run: cp build/wamrc ${{ matrix.artifact }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-floor-musl:
    # The libc-musl-<arch> static-link floor bundles pulled by
    # `hull tools install libc-musl-<arch>` for `hull build --linker=lld-static`
    # (Tier B). Assembled INSIDE Alpine (musl) - crt*.o + libc.a + stub
    # libm/libpthread + libgcc.a packed as a flat ustar - so a box with only
    # hull + ld.lld links a fully static musl binary. Each tar's SHA-256 lands in
    # the signed hull.sha256 below (same trust chain as wamrc). Native-only (musl
    # is Linux); the name bakes in the arch, one artifact per arch. Uses the same
    # scripts/build_musl_floor.sh the tests do. See docs/musl_build.md.
    name: Build libc-musl floor (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-24.04
          - name: aarch64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Assemble + pack the floor in Alpine (musl)
        run: |
          docker run --rm -v "$PWD":/work alpine:3.20 sh -c '
            set -eu
            apk add --no-cache build-base >/dev/null 2>&1
            sh /work/scripts/build_musl_floor.sh /tmp/floor \
               /work/hull-libc-musl-${{ matrix.name }}.tar
          '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hull-libc-musl-${{ matrix.name }}.tar
          path: hull-libc-musl-${{ matrix.name }}.tar

  build-platform-musl:
    # The musl-built Hull archive SET (libhull_platform.a + libhull_platform-slim.a
    # + every libhull_feature-*.a), the counterpart of build-floor-musl above: the
    # floor is the musl libc; THIS is Hull's own archives, musl-built. Needed so
    # `hull build --linker=lld-static` (Tier B) or `--linker=zig --target=<arch>-
    # linux-musl` (cross) can link against a musl base - a glibc-built .a can't
    # (audit item #4, docs/build_arc_audit.md). Assembled INSIDE Alpine (musl) via
    # scripts/build_musl_platform.sh, packed as a flat ustar. Its SHA-256 lands in
    # the signed hull.sha256 below (release-key trust chain, same as the floor /
    # wamrc / zig tars), so `hull ... install` (the #4c fetch) can verify it.
    # Native-only (musl is Linux); one artifact per arch.
    #
    # NOTE (#4b scope): this publishes the FETCHABLE tar into hull.sha256. Wiring
    # the runtime §5c composed-archive attestation (platform-manifest.txt / the
    # embedded platform-sig) for a musl cross-built app is #4c, where the composer
    # that records the musl-tagged archive names is built + tested alongside it.
    name: Build platform (musl, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-24.04
          - name: aarch64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true          # keel + wamr are needed to build the platform

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build the musl platform archive set in Alpine (musl)
        # RW mount is fine on the ephemeral runner; the producer builds in a
        # container-internal copy regardless, so nothing writes into the checkout
        # except the output tar. Same toolchain set tests/e2e_musl.sh installs.
        run: |
          docker run --rm -v "$PWD":/work alpine:3.20 sh -c '
            set -eu
            apk add --no-cache build-base clang lld make xxd bash git perl linux-headers >/dev/null 2>&1
            sh /work/scripts/build_musl_platform.sh /work \
               /work/hull-platform-musl-${{ matrix.name }}.tar
          '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hull-platform-musl-${{ matrix.name }}.tar
          path: hull-platform-musl-${{ matrix.name }}.tar

  build-zig:
    # The turnkey cross-linker bundle pulled by `hull tools install zig` ->
    # `hull build --linker=zig --target=<triple>`. Zig's official release is a
    # self-contained, symlink-free tree (the `zig` driver + its `lib/`), so we
    # just re-tar its root as a per-platform flat ustar. Each tar's SHA-256 lands
    # in the signed hull.sha256 below (same trust chain as wamrc). Native-only:
    # cosmo can't drive a native zig tree. Keep the version in lockstep with the
    # `embed-zig` CI job. See docs/toolchain_free_build.md.
    name: Build zig bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            zigtriple: linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            zigtriple: linux-aarch64
          - name: darwin-arm64
            os: macos-15
            zigtriple: macos-aarch64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Build zig bundle
        run: |
          sh scripts/build_zig_bundle.sh ${{ matrix.zigtriple }} 0.13.0 \
             hull-zig-${{ matrix.name }}.tar

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hull-zig-${{ matrix.name }}.tar
          path: hull-zig-${{ matrix.name }}.tar

  build-cosmocc-bundle:
    # The trimmed Cosmopolitan cosmocc toolchain + a busybox-w64 ride-along,
    # pulled by `hull tools install cosmocc` -> `hull build` of a cosmo-APE app on
    # any host (incl. Windows, where the cosmo hull drives cosmocc's #!/bin/sh
    # driver through the bundled busybox - see docs/cosmocc_install.md). ONE
    # arch-free asset: cosmocc binaries are themselves APEs, so one bundle serves
    # every host. The producer SHA-pins both cosmocc and busybox and trims the
    # ~1.37 GB tree under the 512 MB download cap (a hard size gate fails the
    # build otherwise). Its SHA-256 lands in the signed hull.sha256 below (same
    # release-key trust chain as wamrc/zig). cosmocc version + digest kept in
    # lockstep with mk/fetch.mk; the busybox digest is the pinned frippery.org
    # busybox64u.exe (fail-closed if upstream rolls the "latest" file).
    name: Build cosmocc bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install strace (the producer traces a build to trim the tree)
        run: sudo apt-get update -qq && sudo apt-get install -y strace
      - name: Build cosmocc bundle
        run: |
          sh scripts/build_cosmocc_bundle.sh \
             4.0.2 85b8c37a406d862e656ad4ec14be9f6ce474c1b436b9615e91a55208aced3f44 \
             https://frippery.org/files/busybox/busybox64u.exe \
             6e263d154d8548d1eb936f65d1d8312c80df31c45974e48d6335e4dcc0f4f34c \
             hull-cosmocc.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hull-cosmocc.tar
          path: hull-cosmocc.tar

  build-feature-native:
    # Composable DuckDB feature archive (libhull_feature-duckdb-<arch>.a),
    # shipped as a release asset and pulled by `hull feature install duckdb`
    # -> `hull build --with=duckdb`. See docs/features_and_flavors.md.
    #
    # Built bare (not in the reproducible container): `make fetch-duckdb` needs
    # network, and the archive is covered by the release signature only -- it is
    # NOT part of the platform-sig cross-check -- so it need not be byte-
    # reproducible across rebuilds. Its SHA-256 lands in the signed hull.sha256
    # and `hull feature install` re-verifies the download against that.
    #
    # No cosmo feature: DuckDB is native-only (docs/features_and_flavors.md).
    name: Build feature duckdb (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      # fetch-duckdb isolates DuckDB's bundled mbedTLS/psa symbols via
      # objcopy --redefine-syms. macOS runners ship no objcopy, and GNU gobjcopy
      # handles Mach-O poorly, so install Homebrew LLVM: fetch-duckdb's Makefile
      # rule finds /opt/homebrew/opt/llvm/bin/llvm-objcopy automatically. Linux
      # runners already have objcopy. (Caught by the release dry-run.)
      - name: Install llvm-objcopy (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Fetch DuckDB static libs (with mbedTLS symbol isolation)
        run: make fetch-duckdb

      - name: Build DuckDB feature archive
        run: make feature-duckdb

      - name: Rename artifact (arch-qualified)
        run: mv build/libhull_feature-duckdb.a libhull_feature-duckdb-${{ matrix.name }}.a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: feature-duckdb-${{ matrix.name }}
          path: libhull_feature-duckdb-${{ matrix.name }}.a

  build-feature-gpu:
    # Composable GPU feature archive (libhull_feature-gpu-<arch>.a), shipped as a
    # release asset and pulled by `hull feature install gpu` -> `hull build
    # --with=gpu`. See docs/features_and_flavors.md.
    #
    # Built bare (not in the reproducible container): `make fetch-wgpu` needs
    # network, and the archive is covered by the release signature only (not the
    # platform-sig cross-check), so it need not be byte-reproducible. Its SHA-256
    # lands in the signed hull.sha256 and `hull feature install` re-verifies.
    #
    # Unlike duckdb, wgpu needs NO symbol isolation (no objcopy / LLVM): it shares
    # no symbols with Hull. The macOS frameworks (Metal/QuartzCore/CoreGraphics/
    # Foundation) and Linux -lvulkan are link-time deps that build.lua emits at
    # app-compose time; the feature archive only `ar`s cap_gpu_wgpu.o +
    # libwgpu_native.a members (no linking), so no framework / vulkan-dev install
    # is needed here.
    #
    # No cosmo feature: GPU is native-only.
    name: Build feature gpu (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Fetch wgpu-native static lib
        run: make fetch-wgpu

      - name: Build GPU feature archive
        run: make feature-gpu

      - name: Rename artifact (arch-qualified)
        run: mv build/libhull_feature-gpu.a libhull_feature-gpu-${{ matrix.name }}.a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: feature-gpu-${{ matrix.name }}
          path: libhull_feature-gpu-${{ matrix.name }}.a

  build-feature-tui:
    # Composable TUI feature archive (libhull_feature-tui-<arch>.a), pulled by
    # `hull feature install tui` -> `hull build --with=tui`. TUI is a
    # whole_archive feature (the compose force-loads it); pure C, no vendored lib
    # and no extra link libs (POSIX termios), so this is the simplest feature
    # job: no fetch, no toolchain install, no symbol isolation. `make
    # feature-tui` re-invokes make with HL_ENABLE_TUI=1. Native-only; covered by
    # the release signature only. See docs/features_and_flavors.md.
    name: Build feature tui (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build TUI feature archive
        run: make feature-tui

      - name: Rename artifact (arch-qualified)
        run: mv build/libhull_feature-tui.a libhull_feature-tui-${{ matrix.name }}.a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: feature-tui-${{ matrix.name }}
          path: libhull_feature-tui-${{ matrix.name }}.a

  build-feature-lua:
    # Lua 5.4 runtime as a composable feature archive (libhull_feature-lua-<arch>.a).
    # Unlike the installable features, runtimes are mandatory-exactly-one, so both
    # runtime archives are ALSO embedded in the distributed hull and auto-composed
    # from the entry extension (a fresh `hull build app.lua` needs no install).
    # This job publishes the signed archive for provenance + source builds of a
    # runtime-less hull. Native-only. See docs/runtime_feature_publishing.md.
    name: Build feature lua (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - name: Build Lua runtime feature archive
        run: make feature-lua
      - name: Rename artifact (arch-qualified)
        run: mv build/libhull_feature-lua.a libhull_feature-lua-${{ matrix.name }}.a
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: feature-lua-${{ matrix.name }}
          path: libhull_feature-lua-${{ matrix.name }}.a

  build-feature-js:
    # QuickJS runtime as a composable feature archive (libhull_feature-js-<arch>.a).
    # Same embedded + auto-composed model as build-feature-lua; published for
    # provenance + source builds. Native-only. See docs/runtime_feature_publishing.md.
    name: Build feature js (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - name: Build JS runtime feature archive
        run: make feature-js
      - name: Rename artifact (arch-qualified)
        run: mv build/libhull_feature-js.a libhull_feature-js-${{ matrix.name }}.a
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: feature-js-${{ matrix.name }}
          path: libhull_feature-js-${{ matrix.name }}.a

  build-feature-postgres:
    # Composable PostgreSQL feature archive (libhull_feature-postgres-<arch>.a),
    # pulled by `hull feature install postgres` -> `hull build --with=postgres`.
    # A backend feature (fills hl_db_feature_backends, like DuckDB) but pure C —
    # the ~4 KB wire client, no vendored engine, no extra link libs. `make
    # feature-postgres` re-invokes make with HL_ENABLE_POSTGRES=1. Native-only.
    name: Build feature postgres (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build Postgres feature archive
        run: make feature-postgres

      - name: Rename artifact (arch-qualified)
        run: mv build/libhull_feature-postgres.a libhull_feature-postgres-${{ matrix.name }}.a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: feature-postgres-${{ matrix.name }}
          path: libhull_feature-postgres-${{ matrix.name }}.a

  build-feature-mysql:
    # Composable MySQL/MariaDB feature archive (libhull_feature-mysql-<arch>.a),
    # pulled by `hull feature install mysql` -> `hull build --with=mysql`. One
    # backend for mysql:// + mariadb://. Pure C (~4 KB wire client, no vendored
    # engine), like postgres. `make feature-mysql` re-invokes make with
    # HL_ENABLE_MYSQL=1. Native-only.
    name: Build feature mysql (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build MySQL feature archive
        run: make feature-mysql

      - name: Rename artifact (arch-qualified)
        run: mv build/libhull_feature-mysql.a libhull_feature-mysql-${{ matrix.name }}.a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: feature-mysql-${{ matrix.name }}
          path: libhull_feature-mysql-${{ matrix.name }}.a

  build-feature-valkey:
    # Composable Valkey/Redis KV feature archive (libhull_feature-valkey-<arch>.a),
    # pulled by `hull feature install valkey` -> `hull build --with=valkey`. The
    # FIRST non-SQL connection feature: fills its OWN hook hl_kv_feature_backends
    # (not hl_db_feature_backends). Pure C (RESP codec + wire client, no vendored
    # engine), like postgres/mysql. `make feature-valkey` re-invokes make with
    # HL_ENABLE_VALKEY=1. Native-only.
    name: Build feature valkey (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build Valkey feature archive
        run: make feature-valkey

      - name: Rename artifact (arch-qualified)
        run: mv build/libhull_feature-valkey.a libhull_feature-valkey-${{ matrix.name }}.a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: feature-valkey-${{ matrix.name }}
          path: libhull_feature-valkey-${{ matrix.name }}.a

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [build-cosmo, build-native, build-wamrc, build-floor-musl, build-platform-musl, build-zig, build-cosmocc-bundle, build-feature-native, build-feature-gpu, build-feature-tui, build-feature-postgres, build-feature-mysql, build-feature-valkey, build-feature-lua, build-feature-js]
    permissions:
      contents: write       # publish GitHub release + assets
      id-token: write       # SLSA: OIDC for Sigstore signing
      attestations: write   # SLSA: write build-provenance attestation

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          mv artifacts/hull-cosmo/hull-cosmo                              dist/hull-cosmo
          mv artifacts/hull-linux-x86_64/hull-linux-x86_64                dist/hull-linux-x86_64
          mv artifacts/hull-linux-aarch64/hull-linux-aarch64              dist/hull-linux-aarch64
          mv artifacts/hull-darwin-arm64/hull-darwin-arm64                dist/hull-darwin-arm64
          mv artifacts/hull-wamrc-linux-x86_64/hull-wamrc-linux-x86_64    dist/hull-wamrc-linux-x86_64
          mv artifacts/hull-wamrc-linux-aarch64/hull-wamrc-linux-aarch64  dist/hull-wamrc-linux-aarch64
          mv artifacts/hull-wamrc-darwin-arm64/hull-wamrc-darwin-arm64    dist/hull-wamrc-darwin-arm64
          # libc-musl-<arch> static-link floor bundles (`hull tools install
          # libc-musl-<arch>`); hashed into hull.sha256 below.
          mv artifacts/hull-libc-musl-x86_64.tar/hull-libc-musl-x86_64.tar   dist/hull-libc-musl-x86_64.tar
          mv artifacts/hull-libc-musl-aarch64.tar/hull-libc-musl-aarch64.tar dist/hull-libc-musl-aarch64.tar
          # musl-built Hull platform archive set (base + slim + feature archives),
          # the #4c fetch target for a musl cross/static build; hashed into
          # hull.sha256 below (release-key trust chain).
          mv artifacts/hull-platform-musl-x86_64.tar/hull-platform-musl-x86_64.tar   dist/hull-platform-musl-x86_64.tar
          mv artifacts/hull-platform-musl-aarch64.tar/hull-platform-musl-aarch64.tar dist/hull-platform-musl-aarch64.tar
          # Toolchain-free linker bundles (`hull tools install zig` / `install
          # lld`); per-platform flat ustar, hashed into hull.sha256 below.
          mv artifacts/hull-zig-linux-x86_64.tar/hull-zig-linux-x86_64.tar   dist/hull-zig-linux-x86_64.tar
          mv artifacts/hull-zig-linux-aarch64.tar/hull-zig-linux-aarch64.tar dist/hull-zig-linux-aarch64.tar
          mv artifacts/hull-zig-darwin-arm64.tar/hull-zig-darwin-arm64.tar   dist/hull-zig-darwin-arm64.tar
          # Trimmed cosmocc toolchain + busybox bundle (`hull tools install
          # cosmocc`); ONE arch-free asset, hashed into hull.sha256 below.
          mv artifacts/hull-cosmocc.tar/hull-cosmocc.tar dist/hull-cosmocc.tar
          # Per-flavor platform libs. Consumed by `hull platform install
          # <flavor>` -> `hull build --flavor`. Native files:
          # libhull_platform-<flavor>-<arch>.a; cosmo files (dual-arch):
          # libhull_platform-<flavor>.{x86_64,aarch64}-cosmo.a. All match the
          # `libhull_platform-*.a` glob in the SHA-256 + publish steps below,
          # so they inherit the release signature automatically.
          mv artifacts/platform-flavors-linux-x86_64/*.a  dist/
          mv artifacts/platform-flavors-linux-aarch64/*.a dist/
          mv artifacts/platform-flavors-darwin-arm64/*.a  dist/
          # libhull: the no-runtime embedding archive (libhull L-4). Native
          # per-arch (libhull-<arch>.a) + dual-arch cosmo
          # (libhull.{x86_64,aarch64}-cosmo.a). Added explicitly to the
          # SHA-256 + publish steps below so they inherit the release signature.
          mv artifacts/libhull-linux-x86_64/libhull-linux-x86_64.a    dist/
          mv artifacts/libhull-linux-aarch64/libhull-linux-aarch64.a  dist/
          mv artifacts/libhull-darwin-arm64/libhull-darwin-arm64.a    dist/
          mv artifacts/libhull-cosmo/*.a                              dist/
          # Composable DuckDB feature archives (libhull_feature-duckdb-<arch>.a),
          # native-only. Pulled by `hull feature install duckdb`. Added to the
          # SHA-256 + publish steps below so they inherit the release signature.
          mv artifacts/feature-duckdb-linux-x86_64/*.a   dist/
          mv artifacts/feature-duckdb-linux-aarch64/*.a  dist/
          mv artifacts/feature-duckdb-darwin-arm64/*.a   dist/
          # Composable GPU feature archives (libhull_feature-gpu-<arch>.a),
          # native-only. Pulled by `hull feature install gpu`. Covered by the
          # libhull_feature-*.a glob in the SHA-256 + publish steps below.
          mv artifacts/feature-gpu-linux-x86_64/*.a   dist/
          mv artifacts/feature-gpu-linux-aarch64/*.a  dist/
          mv artifacts/feature-gpu-darwin-arm64/*.a   dist/
          # Composable TUI feature archives (libhull_feature-tui-<arch>.a),
          # native-only. Pulled by `hull feature install tui`. Covered by the
          # libhull_feature-*.a glob in the SHA-256 + publish steps below.
          mv artifacts/feature-tui-linux-x86_64/*.a   dist/
          mv artifacts/feature-tui-linux-aarch64/*.a  dist/
          mv artifacts/feature-tui-darwin-arm64/*.a   dist/
          # Composable runtime feature archives (libhull_feature-{lua,js}-<arch>.a),
          # native-only. Embedded in hull + auto-composed; published for provenance
          # + source builds. Covered by the libhull_feature-*.a glob below.
          mv artifacts/feature-lua-linux-x86_64/*.a   dist/
          mv artifacts/feature-lua-linux-aarch64/*.a  dist/
          mv artifacts/feature-lua-darwin-arm64/*.a   dist/
          mv artifacts/feature-js-linux-x86_64/*.a    dist/
          mv artifacts/feature-js-linux-aarch64/*.a   dist/
          mv artifacts/feature-js-darwin-arm64/*.a    dist/
          # Composable PostgreSQL feature archives (libhull_feature-postgres-<arch>.a),
          # native-only. Pulled by `hull feature install postgres`. Covered by the
          # libhull_feature-*.a glob in the SHA-256 + publish steps below.
          mv artifacts/feature-postgres-linux-x86_64/*.a   dist/
          mv artifacts/feature-postgres-linux-aarch64/*.a  dist/
          mv artifacts/feature-postgres-darwin-arm64/*.a   dist/
          # Composable MySQL/MariaDB feature archives (libhull_feature-mysql-<arch>.a),
          # native-only. Pulled by `hull feature install mysql`. Covered by the
          # libhull_feature-*.a glob in the SHA-256 + publish steps below.
          mv artifacts/feature-mysql-linux-x86_64/*.a   dist/
          mv artifacts/feature-mysql-linux-aarch64/*.a  dist/
          mv artifacts/feature-mysql-darwin-arm64/*.a   dist/
          # Composable Valkey/Redis KV feature archives (libhull_feature-valkey-<arch>.a),
          # native-only. Pulled by `hull feature install valkey`. Covered by the
          # libhull_feature-*.a glob in the SHA-256 + publish steps below.
          mv artifacts/feature-valkey-linux-x86_64/*.a   dist/
          mv artifacts/feature-valkey-linux-aarch64/*.a  dist/
          mv artifacts/feature-valkey-darwin-arm64/*.a   dist/

      - name: Make binaries executable
        run: chmod +x dist/*

      - name: Generate SBOM (single canonical, from linux-x86_64 binary)
        # §0.3.9. Generate the SBOM AS a release artifact, then include
        # it in hull.sha256 so it inherits the release signature. The
        # linux-x86_64 binary is used to generate; the resulting JSON
        # describes the vendored components shared across all platforms
        # (binary_sha256 inside reflects the linux-x86_64 hash; consumers
        # verifying other platforms use hull verify-self for that).
        working-directory: dist
        run: |
          chmod +x ./hull-linux-x86_64
          ./hull-linux-x86_64 sbom --format=json      > hull.sbom.json
          ./hull-linux-x86_64 sbom --format=cyclonedx > hull.sbom.cdx.json
          ./hull-linux-x86_64 sbom --format=spdx      > hull.sbom.spdx.json
          # libhull-scoped SBOM: describes the no-runtime embedding archive
          # (drops the Lua/QuickJS runtimes). Same signature inheritance.
          ./hull-linux-x86_64 sbom --subject=libhull --format=json      > libhull.sbom.json
          ./hull-linux-x86_64 sbom --subject=libhull --format=cyclonedx > libhull.sbom.cdx.json
          ./hull-linux-x86_64 sbom --subject=libhull --format=spdx      > libhull.sbom.spdx.json
          # (Phase 4.3: pure-compute became a build.lua preset on the default
          # composable base, so there are no per-flavor platform libs to SBOM.)
          ls -la hull.sbom.* libhull.sbom.*

      - name: Generate build-environment manifest
        # §0.3.14. Capture the release-workflow runner identity, commit,
        # and workflow-run URL into hull.build-env.json. Goes into
        # hull.sha256 below so it inherits all three signature layers
        # (Ed25519 + Sigstore + SLSA). Per-platform compile environment
        # (cc version, runner image per matrix arch, build flags) is
        # captured separately by the SLSA build-provenance attestation
        # for each binary; query via:
        #   gh attestation list --repo artalis-io/hull
        # The note inside the JSON points consumers there. Full per-arch
        # env capture in this file is §0.3.14b (deferred; needs each
        # build-native matrix job to upload its own env artifact).
        working-directory: dist
        run: |
          cat > hull.build-env.json <<EOF
          {
            "release_tag": "${GITHUB_REF_NAME}",
            "commit_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "repository": "${GITHUB_REPOSITORY}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "release_runner": {
              "os": "${ImageOS:-unknown}",
              "image_version": "${ImageVersion:-unknown}",
              "runner_arch": "${RUNNER_ARCH:-unknown}",
              "uname": "$(uname -srm)"
            },
            "per_binary_provenance_hint": "Per-platform build-runner details are recorded in the SLSA build-provenance attestation for each binary; query via 'gh attestation list --repo ${GITHUB_REPOSITORY}'."
          }
          EOF
          cat hull.build-env.json

      - name: Compute SHA-256 checksums
        # `hull tools install <name>` looks up entries by exact asset
        # name in this manifest — keep the file list in sync with the
        # tool registry in src/hull/tools_install.c.
        # SBOM + build-env files included here so they inherit the
        # release signature (Ed25519 + Sigstore + SLSA).
        working-directory: dist
        run: |
          sha256sum hull-cosmo hull-linux-x86_64 hull-linux-aarch64 hull-darwin-arm64 \
                    hull-wamrc-linux-x86_64 hull-wamrc-linux-aarch64 hull-wamrc-darwin-arm64 \
                    hull-libc-musl-x86_64.tar hull-libc-musl-aarch64.tar \
                    hull-platform-musl-x86_64.tar hull-platform-musl-aarch64.tar \
                    hull-zig-linux-x86_64.tar hull-zig-linux-aarch64.tar hull-zig-darwin-arm64.tar \
                    hull-cosmocc.tar \
                    hull.sbom.json hull.sbom.cdx.json hull.sbom.spdx.json \
                    libhull.sbom.json libhull.sbom.cdx.json libhull.sbom.spdx.json \
                    hull.build-env.json \
                    libhull_platform-*.a \
                    libhull-linux-x86_64.a libhull-linux-aarch64.a libhull-darwin-arm64.a \
                    libhull.x86_64-cosmo.a libhull.aarch64-cosmo.a \
                    libhull_feature-*.a \
                    > hull.sha256
          cat hull.sha256

      - name: Sign release manifest (Ed25519)
        env:
          HULL_RELEASE_KEY: ${{ secrets.HULL_RELEASE_KEY }}
        working-directory: dist
        run: |
          # The native-linux artifact embeds the 'hull sign-release'
          # subcommand. We use it to sign the SHA-256 manifest with the
          # Ed25519 secret key from the repo secret HULL_RELEASE_KEY
          # (128 hex chars, generated offline with 'hull keygen release').
          # If the secret is unset, the release ships without .sig and
          # 'hull update' falls back to SHA-256 only.
          if [ -z "$HULL_RELEASE_KEY" ]; then
            echo "::warning::HULL_RELEASE_KEY is not set; release will ship without hull.sha256.sig"
            exit 0
          fi
          umask 077
          printf '%s\n' "$HULL_RELEASE_KEY" > /tmp/release.key
          chmod +x ./hull-linux-x86_64
          ./hull-linux-x86_64 sign-release hull.sha256 --key /tmp/release.key
          rm -f /tmp/release.key
          test -s hull.sha256.sig
          echo "--- hull.sha256.sig:"
          cat hull.sha256.sig

      - name: Install cosign
        # §0.3.4 prerequisite. Installs the Sigstore cosign binary so we
        # can publish the release manifest to the Rekor transparency log.
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Publish manifest to Rekor transparency log
        # §0.3.4. Sign hull.sha256 via Sigstore (OIDC -> Fulcio short-lived
        # cert) and submit the signature + cert + manifest digest to
        # https://rekor.sigstore.dev. The Rekor log entry is append-only
        # and externally auditable; anyone can prove a release wasn't
        # backdated. Independent of HULL_RELEASE_KEY (separate trust
        # root); HULL_RELEASE_KEY signing remains the primary path for
        # `hull update` clients with no Sigstore dependency.
        working-directory: dist
        run: |
          cosign sign-blob hull.sha256 \
            --rekor-url=https://rekor.sigstore.dev \
            --yes \
            --output-signature=hull.sha256.cosign.sig \
            --output-certificate=hull.sha256.cosign.pem
          echo "--- hull.sha256.cosign.sig (Sigstore):"
          cat hull.sha256.cosign.sig
          echo "--- hull.sha256.cosign.pem (first 3 lines):"
          head -3 hull.sha256.cosign.pem

      - name: Attest build provenance (SLSA)
        # §0.3.5. Sigstore-signed attestation linking each binary to this
        # commit + workflow run + runner image. Verifiable with
        # `gh attestation verify <binary> --repo artalis-io/hull`.
        # Independent of HULL_RELEASE_KEY: provenance is signed via
        # GitHub OIDC + Fulcio short-lived cert, not the gethull key.
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v2
        with:
          subject-path: |
            dist/hull-cosmo
            dist/hull-linux-x86_64
            dist/hull-linux-aarch64
            dist/hull-darwin-arm64
            dist/hull-wamrc-linux-x86_64
            dist/hull-wamrc-linux-aarch64
            dist/hull-wamrc-darwin-arm64
            dist/hull-libc-musl-x86_64.tar
            dist/hull-libc-musl-aarch64.tar
            dist/hull-platform-musl-x86_64.tar
            dist/hull-platform-musl-aarch64.tar
            dist/hull-zig-linux-x86_64.tar
            dist/hull-zig-linux-aarch64.tar
            dist/hull-zig-darwin-arm64.tar
            dist/hull-cosmocc.tar
            dist/hull.sha256
            dist/hull.sbom.json
            dist/hull.sbom.cdx.json
            dist/hull.sbom.spdx.json
            dist/hull.build-env.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build asset list — include hull.sha256.sig only if it was produced.
          assets=(
            dist/hull-cosmo
            dist/hull-linux-x86_64
            dist/hull-linux-aarch64
            dist/hull-darwin-arm64
            dist/hull-wamrc-linux-x86_64
            dist/hull-wamrc-linux-aarch64
            dist/hull-wamrc-darwin-arm64
            dist/hull-libc-musl-x86_64.tar
            dist/hull-libc-musl-aarch64.tar
            dist/hull-platform-musl-x86_64.tar
            dist/hull-platform-musl-aarch64.tar
            dist/hull-zig-linux-x86_64.tar
            dist/hull-zig-linux-aarch64.tar
            dist/hull-zig-darwin-arm64.tar
            dist/hull-cosmocc.tar
            dist/hull.sha256
            dist/hull.sbom.json
            dist/hull.sbom.cdx.json
            dist/hull.sbom.spdx.json
            dist/hull.build-env.json
            dist/hull.sha256.cosign.sig
            dist/hull.sha256.cosign.pem
          )
          # Per-flavor platform libs (libhull_platform-<flavor>-<arch>.a), so
          # `hull platform install <flavor>` can fetch them. Covered by
          # hull.sha256 above, so they inherit the release signature.
          assets+=(dist/libhull_platform-*.a)
          # Composable feature archives (libhull_feature-<name>-<arch>.a), so
          # `hull feature install <name>` can fetch them. Also covered by
          # hull.sha256, so they inherit the release signature.
          assets+=(dist/libhull_feature-*.a)
          # libhull no-runtime embedding archives (native per-arch + dual-arch
          # cosmo) and the libhull-scoped SBOMs. Also covered by hull.sha256.
          assets+=(
            dist/libhull-linux-x86_64.a
            dist/libhull-linux-aarch64.a
            dist/libhull-darwin-arm64.a
            dist/libhull.x86_64-cosmo.a
            dist/libhull.aarch64-cosmo.a
            dist/libhull.sbom.json
            dist/libhull.sbom.cdx.json
            dist/libhull.sbom.spdx.json
          )
          # (Phase 4.3: no per-flavor platform-lib SBOMs -- pure-compute is a
          # build.lua preset, not a pre-built lib.)
          if [ -f dist/hull.sha256.sig ]; then
            assets+=(dist/hull.sha256.sig)
          fi
          # Idempotent: if the release already exists (e.g. created manually
          # alongside the tag push), upload assets onto it instead of failing.
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists — uploading assets with --clobber"
            gh release upload "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --clobber \
              "${assets[@]}"
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "Hull ${{ github.ref_name }}" \
              --generate-notes \
              ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
              "${assets[@]}"
          fi
