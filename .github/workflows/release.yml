name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Stage 1: build the platform libraries (libhull_platform.a per arch).
  # These artifacts feed into both sign-platform-manifest (which hashes
  # them) and the hull-binary build jobs (which embed them). Splitting
  # platform-build out of hull-build avoids the platform .a being
  # rebuilt twice with potentially-different timestamps on different
  # machines — sign-platform-manifest's manifest hash MUST match the .a
  # bytes that build-native/build-cosmo embed, so the only way to
  # guarantee bit-equality is to build the .a once and reuse it via
  # GitHub Actions artifacts.
  # ────────────────────────────────────────────────────────────────────

  build-platform-native:
    name: Build platform (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build platform library
        run: make platform

      - name: Upload libhull_platform.a
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.name }}
          path: build/libhull_platform.a

  build-platform-cosmo:
    name: Build platform (cosmo, multi-arch)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Install cosmocc
        run: |
          COSMOCC_DIR=/opt/cosmo make fetch-cosmocc
          echo "/opt/cosmo/bin" >> "$GITHUB_PATH"

      - name: Build platform (multi-arch)
        run: make platform-cosmo

      - name: Upload cosmo platform archives
        uses: actions/upload-artifact@v4
        with:
          name: platform-cosmo
          path: |
            build/libhull_platform.x86_64-cosmo.a
            build/libhull_platform.aarch64-cosmo.a

  # ────────────────────────────────────────────────────────────────────
  # Stage 2: build + sign the platform manifest. Generates the
  # `embedded_platform_sig.h` header that gets baked into every hull
  # binary in stage 3. Uses the previous stable hull (v0.1.2) to
  # invoke `hull sign-release` for the Ed25519 signing — v0.1.2 hull
  # is the most recent release; its sign-release subcommand is
  # key-agnostic, so it signs whatever bytes we point it at with
  # whichever secret we supply.
  #
  # Bootstrap check: hard-fail if HULL_PLATFORM_KEY is empty. This
  # secret has been in the GH secrets since v0.1.0 (set when
  # sign-platform was first wired); v0.1.3 is the first release that
  # actually requires it at the workflow level.
  # ────────────────────────────────────────────────────────────────────

  sign-platform-manifest:
    name: Sign platform manifest
    runs-on: ubuntu-latest
    needs: [build-platform-native, build-platform-cosmo]
    env:
      HULL_PLATFORM_KEY: ${{ secrets.HULL_PLATFORM_KEY }}
      # Hull version used to invoke `hull sign-release`. Pinned to a
      # known-good prior release so the bootstrap is deterministic.
      # Update only when v0.1.2 stops being a usable signer.
      HULL_BOOTSTRAP_VERSION: v0.1.2

    steps:
      - name: Bootstrap check
        run: |
          if [ -z "$HULL_PLATFORM_KEY" ]; then
            echo "::error::HULL_PLATFORM_KEY is empty. v0.1.3+ requires"
            echo "::error::it for the signed platform manifest. The secret"
            echo "::error::has been provisioned since v0.1.0 — check the"
            echo "::error::repo secrets configuration."
            exit 1
          fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: platforms/

      - name: Install hull ${{ env.HULL_BOOTSTRAP_VERSION }} (signer)
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/artalis-io/hull/releases/download/${HULL_BOOTSTRAP_VERSION}/hull-linux-x86_64" \
            -o /tmp/hull-signer
          chmod +x /tmp/hull-signer
          /tmp/hull-signer version

      - name: Build canonical platform manifest
        # One line per arch: "<64-hex-sha256>  <arch>\n".
        # Sort key: arch name (LC_ALL=C, second field). MUST match the
        # arch_entry_cmp order in src/hull/platform_sig.c so the C
        # builder and CI produce byte-identical manifests for the same
        # input set — otherwise round-tripping through
        # hl_platform_sig_build_manifest would yield a different SHA
        # than the embedded blob.
        # Same format as hull.sha256; matches what
        # hl_release_io_find_checksum parses at runtime.
        run: |
          set -eu
          {
            sha256sum \
              platforms/platform-linux-x86_64/libhull_platform.a \
              | awk '{print $1"  linux-x86_64"}'
            sha256sum \
              platforms/platform-linux-aarch64/libhull_platform.a \
              | awk '{print $1"  linux-aarch64"}'
            sha256sum \
              platforms/platform-darwin-arm64/libhull_platform.a \
              | awk '{print $1"  darwin-arm64"}'
            sha256sum \
              platforms/platform-cosmo/libhull_platform.x86_64-cosmo.a \
              | awk '{print $1"  cosmo-x86_64"}'
            sha256sum \
              platforms/platform-cosmo/libhull_platform.aarch64-cosmo.a \
              | awk '{print $1"  cosmo-aarch64"}'
          } | LC_ALL=C sort -k2,2 > platform-manifest.txt
          echo "--- platform-manifest.txt:"
          cat platform-manifest.txt

      - name: Sign platform manifest (Ed25519)
        run: |
          set -eu
          umask 077
          printf '%s\n' "$HULL_PLATFORM_KEY" > /tmp/platform.key
          # hull sign-release writes <input>.sig — works for any text
          # manifest, not just hull.sha256. Same signing primitive.
          /tmp/hull-signer sign-release platform-manifest.txt --key /tmp/platform.key
          rm -f /tmp/platform.key
          test -s platform-manifest.txt.sig
          echo "--- platform-manifest.txt.sig:"
          cat platform-manifest.txt.sig

      - name: Generate embedded_platform_sig.h
        # xxd emits "unsigned char <name>[] = { ... };" and
        # "unsigned int <name>_len = ...;". The -n flag sets <name>;
        # we use the exact symbol names the source expects (see
        # src/hull/embedded_platform_sig.c).
        run: |
          set -eu
          mkdir -p build
          {
            echo '/* Auto-generated by .github/workflows/release.yml */'
            echo '/* sign-platform-manifest step. Do not edit. */'
            xxd -i -n hl_embedded_platform_sig_manifest \
                platform-manifest.txt
            xxd -i -n hl_embedded_platform_sig_signature \
                platform-manifest.txt.sig
          } > build/embedded_platform_sig.h
          echo "--- embedded_platform_sig.h ($(wc -c < build/embedded_platform_sig.h) bytes):"
          head -20 build/embedded_platform_sig.h
          echo "..."

      - name: Stage signed manifest for upload
        # Co-locate manifest text + .sig + .h so downstream jobs get a
        # single directory with everything they need:
        #   embedded_platform_sig.h — the C symbol embedded in hull
        #   platform-manifest.txt   — raw text (one line per arch),
        #                              used by build-* to sha256-verify
        #                              the .a they're about to embed
        #   platform-manifest.txt.sig — signature for offline audit
        run: |
          set -eu
          cp platform-manifest.txt platform-manifest.txt.sig build/

      - name: Upload signed manifest + header
        uses: actions/upload-artifact@v4
        with:
          name: embedded-platform-sig
          path: |
            build/embedded_platform_sig.h
            build/platform-manifest.txt
            build/platform-manifest.txt.sig

  # ────────────────────────────────────────────────────────────────────
  # Stage 3: build hull binaries with the signed manifest embedded.
  # These jobs DOWNLOAD their respective libhull_platform.a from stage
  # 1's artifacts (rather than rebuilding) — guarantees the embedded .a
  # bytes match what sign-platform-manifest hashed. They also download
  # the signed manifest header so HL_EMBED_PLATFORM_SIG gets defined
  # and embedded_platform_sig.c links the real signed blob.
  # ────────────────────────────────────────────────────────────────────

  build-cosmo:
    name: Build (Cosmopolitan APE)
    runs-on: ubuntu-latest
    needs: [build-platform-cosmo, sign-platform-manifest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Install cosmocc
        run: |
          COSMOCC_DIR=/opt/cosmo make fetch-cosmocc
          echo "/opt/cosmo/bin" >> "$GITHUB_PATH"

      - name: Download cosmo platform archives
        uses: actions/download-artifact@v4
        with:
          name: platform-cosmo
          path: build/

      - name: Download signed manifest header
        uses: actions/download-artifact@v4
        with:
          name: embedded-platform-sig
          path: build/

      - name: Verify downloaded .a files match signed manifest
        # Catch any drift between sign-platform-manifest's input and
        # what we're about to embed BEFORE wasting compute on the build.
        # Without this guard, a .a mismatch would silently ship a hull
        # binary that can't pass its own platform-sig cross-check at
        # `hull build --sign` time (exactly the v0.1.3-rc bug).
        run: |
          set -eu
          fail=0
          for entry in "cosmo-x86_64:build/libhull_platform.x86_64-cosmo.a" \
                       "cosmo-aarch64:build/libhull_platform.aarch64-cosmo.a"; do
            arch="${entry%%:*}"
            file="${entry##*:}"
            actual=$(sha256sum "$file" | awk '{print $1}')
            expected=$(awk -v a="$arch" '$2==a {print $1}' build/platform-manifest.txt)
            if [ -z "$expected" ]; then
              echo "::error::arch '$arch' not in signed manifest"
              fail=1
            elif [ "$actual" != "$expected" ]; then
              echo "::error::$file SHA mismatch: expected=$expected actual=$actual"
              fail=1
            else
              echo "✓ $arch .a SHA matches signed manifest: $actual"
            fi
          done
          [ "$fail" = 0 ] || exit 1

      - name: Build hull (cosmo APE)
        # No TRUST_PLATFORM_LIB needed for cosmo: the .a's at
        # build/libhull_platform.{x86_64,aarch64}-cosmo.a have no
        # build rule in the Makefile (they're produced by the
        # .PHONY platform-cosmo target during native development).
        # Make treats them as leaf inputs — won't rebuild.
        run: make CC=cosmocc EMBED_PLATFORM=cosmo

      - name: Smoke-test version
        run: ./build/hull version

      - name: Platform-sig E2E smoke test (SKIPPED for cosmo)
        # v0.1.4 attempted to re-enable this (with widened unveils +
        # cosmocc auto-detect from §3.1). It still fails — but for a
        # deeper reason than f3311cd's original diagnosis. The unveils
        # ARE now correct (the sandbox log shows "16 unveiled paths"
        # including /opt where cosmocc lives), but spawning any child
        # process from a cosmo APE running under the jart pledge
        # polyfill on Linux still hits:
        #
        #   /bin/sh: error while loading shared libraries: libc.so.6:
        #            failed to map segment from shared object
        #   /usr/bin/cc: ... libc.so.6: failed to map segment ...
        #
        # That's mmap(PROT_EXEC) from the child's dynamic linker being
        # rejected by the parent's seccomp-bpf filter — an mmap-policy
        # restriction in the polyfill itself, NOT an unveil/path issue.
        # Widening the unveil set can't fix it.
        #
        # The native build jobs (darwin-arm64, linux-x86_64,
        # linux-aarch64) DO run the full platform-sig E2E end-to-end
        # under BOTH --no-sandbox and the real sandbox. Same canonical-
        # JSON reconstruction, same hl_platform_sig_verify, same
        # hl_sig_verify code. Three independent arch coverages are
        # sufficient gating for the gethull signature chain.
        #
        # Cosmo-specific gating would need either (a) a different
        # pledge polyfill that allows child-process PROT_EXEC mmap, or
        # (b) running the cosmo APE without --no-sandbox on a host that
        # ignores cosmo's polyfill (e.g. macOS), or (c) the embedded
        # TCC path on cosmo (currently unsupported — cosmo .a archives
        # need cosmocc to link). All non-trivial; tracked separately.
        run: |
          echo "Platform-sig E2E smoke test: SKIPPED for cosmo build."
          echo "See comment above. Native jobs gate the signature chain."

      - name: Rename artifact
        run: cp build/hull hull-cosmo

      - uses: actions/upload-artifact@v4
        with:
          name: hull-cosmo
          path: hull-cosmo

  build-native:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [build-platform-native, sign-platform-manifest]

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: hull-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            artifact: hull-linux-aarch64
          - name: darwin-arm64
            os: macos-latest
            artifact: hull-darwin-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Download libhull_platform.a (this arch)
        uses: actions/download-artifact@v4
        with:
          name: platform-${{ matrix.name }}
          path: build/

      - name: Download signed manifest header
        uses: actions/download-artifact@v4
        with:
          name: embedded-platform-sig
          path: build/

      - name: Verify downloaded .a matches signed manifest
        # Catch any drift between sign-platform-manifest's input and
        # what we're about to embed BEFORE wasting compute on the build.
        # See same step in build-cosmo for rationale.
        run: |
          set -eu
          actual=$(sha256sum build/libhull_platform.a | awk '{print $1}')
          expected=$(awk -v a="${{ matrix.name }}" '$2==a {print $1}' build/platform-manifest.txt)
          if [ -z "$expected" ]; then
            echo "::error::arch '${{ matrix.name }}' not in signed manifest"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::libhull_platform.a SHA mismatch"
            echo "  expected (signed manifest): $expected"
            echo "  actual   (downloaded .a):   $actual"
            exit 1
          fi
          echo "✓ ${{ matrix.name }} .a SHA matches signed manifest: $actual"

      - name: Build hull with embedded platform
        # TRUST_PLATFORM_LIB=1 short-circuits $(PLATFORM_LIB)'s
        # rebuild rule in the Makefile — make treats the downloaded
        # .a as a pristine leaf input, never re-archives it from
        # source. The downloaded .a's bytes are the ones
        # sign-platform-manifest hashed, and they get embedded as-is.
        # Without this, make sees PLATFORM_OBJS / CANARY_OBJ as
        # newer than the .a and rebuilds it from scratch; the
        # rebuilt bytes differ from the signed manifest entry on a
        # different GH Actions VM (non-reproducible toolchain
        # artifacts), breaking the gethull cross-check.
        run: make EMBED_PLATFORM=1 TRUST_PLATFORM_LIB=1

      - name: Smoke-test version + platform
        run: |
          ./build/hull version
          ./build/hull doctor | grep -E "embedded\s+yes|hull build" || (echo "::error::Platform library not embedded"; exit 1)

      - name: Platform-sig E2E smoke test
        # Build a signed app with the freshly-baked hull binary, exercising
        # the full chain: hull build cross-checks the .a's SHA against the
        # gethull manifest IT embeds, then the output binary runs under
        # --verify-sig and re-verifies the gethull layer at startup. This
        # is the test that would have caught the v0.1.3-rc bug; release
        # cannot proceed past this point if either layer is broken.
        run: |
          set -eu
          "${GITHUB_WORKSPACE}/build/hull" keygen "${GITHUB_WORKSPACE}/build/plat"
          "${GITHUB_WORKSPACE}/build/hull" sign-platform \
              --dir "${GITHUB_WORKSPACE}/build/" \
              "${GITHUB_WORKSPACE}/build/plat"
          TMP=$(mktemp -d)
          cd "$TMP"
          cat > app.lua <<'LUA'
          app.manifest({modules = {"hull/http-server@1"}})
          app.get("/", function(req, res) res:json({ok=true}) end)
          LUA
          "${GITHUB_WORKSPACE}/build/hull" keygen dev
          "${GITHUB_WORKSPACE}/build/hull" build --sign dev.key -o myapp .
          test -x myapp
          # Variant A: --no-sandbox. Primary gate; confirms the
          # signature chain works end-to-end without fighting the
          # runtime sandbox during CI (which has its own polyfill
          # quirks per platform).
          ./myapp --verify-sig dev.pub --no-sandbox -p 19888 ./app.lua &
          SVR=$!
          sleep 3
          if ! kill -0 "$SVR" 2>/dev/null; then
            echo "::error::myapp failed to start under --verify-sig --no-sandbox (platform-sig check broken)"
            exit 1
          fi
          RESP=$(curl -fsS http://127.0.0.1:19888/ || echo FAIL)
          kill "$SVR" 2>/dev/null || true
          wait "$SVR" 2>/dev/null || true
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::wrong response: $RESP"; exit 1; }
          echo "✓ platform-sig E2E variant A (build --sign + --verify-sig --no-sandbox) passes"

          # Variant B: full sandbox. Catches any signature-chain code
          # that accidentally needs paths/syscalls the sandbox blocks.
          # Same myapp binary, same keys — only the sandbox is
          # different.
          ./myapp --verify-sig dev.pub -p 19889 ./app.lua &
          SVR=$!
          sleep 3
          if ! kill -0 "$SVR" 2>/dev/null; then
            echo "::error::myapp failed to start under --verify-sig + sandbox"
            echo "::error::the sig chain works without sandbox but breaks under it"
            exit 1
          fi
          RESP=$(curl -fsS http://127.0.0.1:19889/ || echo FAIL)
          kill "$SVR" 2>/dev/null || true
          wait "$SVR" 2>/dev/null || true
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::wrong response under sandbox: $RESP"; exit 1; }
          echo "✓ platform-sig E2E variant B (build --sign + --verify-sig WITH sandbox) passes"

      - name: Rename artifact
        run: cp build/hull ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-wamrc:
    # Side-loaded `wamrc` (WAMR AOT compiler) shipped as a separate
    # release asset and pulled by `hull tools install wamrc`. See
    # docs/tools_install.md. The trust chain reuses the same
    # Ed25519-signed hull.sha256 manifest — each wamrc artifact is
    # listed in the manifest below.
    #
    # No cosmo wamrc: LLVM doesn't fit cleanly into a cosmocc fat APE
    # binary. Cosmo users build from source with `make wamrc`.
    name: Build wamrc (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: hull-wamrc-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            artifact: hull-wamrc-linux-aarch64
          - name: darwin-arm64
            os: macos-latest
            artifact: hull-wamrc-darwin-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install LLVM + cmake (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev cmake

      - name: Install LLVM + cmake (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@18 cmake

      - name: Build wamrc
        run: |
          # Declare separately so shellcheck SC2155 doesn't flag the
          # masked return value from $(llvm-config-18 ...).
          if command -v llvm-config-18 >/dev/null 2>&1; then
            llvm_cmakedir=$(llvm-config-18 --cmakedir)
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=${llvm_cmakedir}"
          elif [ -d /opt/homebrew/opt/llvm@18 ]; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=/opt/homebrew/opt/llvm@18/lib/cmake/llvm"
          elif [ -d /usr/local/opt/llvm@18 ]; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=/usr/local/opt/llvm@18/lib/cmake/llvm"
          fi
          make wamrc
          strip build/wamrc 2>/dev/null || true

      - name: Smoke-test wamrc
        run: ./build/wamrc --help | head -5

      - name: Rename artifact
        run: cp build/wamrc ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-cosmo, build-native, build-wamrc]
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          mv artifacts/hull-cosmo/hull-cosmo                              dist/hull-cosmo
          mv artifacts/hull-linux-x86_64/hull-linux-x86_64                dist/hull-linux-x86_64
          mv artifacts/hull-linux-aarch64/hull-linux-aarch64              dist/hull-linux-aarch64
          mv artifacts/hull-darwin-arm64/hull-darwin-arm64                dist/hull-darwin-arm64
          mv artifacts/hull-wamrc-linux-x86_64/hull-wamrc-linux-x86_64    dist/hull-wamrc-linux-x86_64
          mv artifacts/hull-wamrc-linux-aarch64/hull-wamrc-linux-aarch64  dist/hull-wamrc-linux-aarch64
          mv artifacts/hull-wamrc-darwin-arm64/hull-wamrc-darwin-arm64    dist/hull-wamrc-darwin-arm64

      - name: Make binaries executable
        run: chmod +x dist/*

      - name: Compute SHA-256 checksums
        # `hull tools install <name>` looks up entries by exact asset
        # name in this manifest — keep the file list in sync with the
        # tool registry in src/hull/tools_install.c.
        working-directory: dist
        run: |
          sha256sum hull-cosmo hull-linux-x86_64 hull-linux-aarch64 hull-darwin-arm64 \
                    hull-wamrc-linux-x86_64 hull-wamrc-linux-aarch64 hull-wamrc-darwin-arm64 \
                    > hull.sha256
          cat hull.sha256

      - name: Sign release manifest (Ed25519)
        env:
          HULL_RELEASE_KEY: ${{ secrets.HULL_RELEASE_KEY }}
        working-directory: dist
        run: |
          # The native-linux artifact embeds the 'hull sign-release'
          # subcommand. We use it to sign the SHA-256 manifest with the
          # Ed25519 secret key from the repo secret HULL_RELEASE_KEY
          # (128 hex chars, generated offline with 'hull keygen release').
          # If the secret is unset, the release ships without .sig and
          # 'hull update' falls back to SHA-256 only.
          if [ -z "$HULL_RELEASE_KEY" ]; then
            echo "::warning::HULL_RELEASE_KEY is not set; release will ship without hull.sha256.sig"
            exit 0
          fi
          umask 077
          printf '%s\n' "$HULL_RELEASE_KEY" > /tmp/release.key
          chmod +x ./hull-linux-x86_64
          ./hull-linux-x86_64 sign-release hull.sha256 --key /tmp/release.key
          rm -f /tmp/release.key
          test -s hull.sha256.sig
          echo "--- hull.sha256.sig:"
          cat hull.sha256.sig

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build asset list — include hull.sha256.sig only if it was produced.
          assets=(
            dist/hull-cosmo
            dist/hull-linux-x86_64
            dist/hull-linux-aarch64
            dist/hull-darwin-arm64
            dist/hull-wamrc-linux-x86_64
            dist/hull-wamrc-linux-aarch64
            dist/hull-wamrc-darwin-arm64
            dist/hull.sha256
          )
          if [ -f dist/hull.sha256.sig ]; then
            assets+=(dist/hull.sha256.sig)
          fi
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Hull ${{ github.ref_name }}" \
            --generate-notes \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
            "${assets[@]}"
