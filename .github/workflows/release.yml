name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Stage 1: build the platform libraries (libhull_platform.a per arch).
  # These artifacts feed into both sign-platform-manifest (which hashes
  # them) and the hull-binary build jobs (which embed them). Splitting
  # platform-build out of hull-build avoids the platform .a being
  # rebuilt twice with potentially-different timestamps on different
  # machines — sign-platform-manifest's manifest hash MUST match the .a
  # bytes that build-native/build-cosmo embed, so the only way to
  # guarantee bit-equality is to build the .a once and reuse it via
  # GitHub Actions artifacts.
  # ────────────────────────────────────────────────────────────────────

  build-platform-native:
    name: Build platform (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      # Linux builds in the snapshot-pinned reproducible container (roadmap
      # 0.3.1) so the shipped platform .a is byte-reproducible across time.
      # macOS builds bare: no container touches the macos-15 Xcode runner.
      - name: Build platform library (Linux, reproducible container)
        if: runner.os == 'Linux'
        uses: ./.github/actions/hull-build-container
        with:
          run: make platform
      - name: Build platform library (macOS)
        if: runner.os == 'macOS'
        run: make platform

      - name: Upload libhull_platform.a
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: platform-${{ matrix.name }}
          path: build/libhull_platform.a

      # Embedded runtime / HTTP-core / web-bindings / tui-bridge feature archives
      # (issue #114). These ship INSIDE hull and are composed into apps at
      # `hull build`; the runtime composed-feature check (signature.c §5c) attests
      # each recorded hash against the signed platform manifest. So the EXACT bytes
      # must be signed by sign-platform-manifest and embedded as-is in stage 3
      # (TRUST_FEATURE_LIBS=1) — same download+trust discipline as libhull_platform.a
      # (macOS isn't byte-reproducible across runners). Cosmo has no embedded
      # feature archives (fat APE), so this is native-only.
      - name: Build embedded feature archives (Linux, reproducible container)
        if: runner.os == 'Linux'
        uses: ./.github/actions/hull-build-container
        with:
          run: >
            make feature-lua feature-js feature-http feature-http-lua
            feature-http-js feature-tui-lua feature-tui-js
            feature-wasm feature-wasm-lua feature-wasm-js
            feature-sqlite feature-sqlite-lua feature-sqlite-js
            feature-image feature-image-lua feature-image-js
      - name: Build embedded feature archives (macOS)
        if: runner.os == 'macOS'
        run: >
          make feature-lua feature-js feature-http feature-http-lua
          feature-http-js feature-tui-lua feature-tui-js
          feature-wasm feature-wasm-lua feature-wasm-js
          feature-sqlite feature-sqlite-lua feature-sqlite-js
          feature-image feature-image-lua feature-image-js
      - name: Upload embedded feature archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: platform-features-${{ matrix.name }}
          path: |
            build/libhull_feature-lua.a
            build/libhull_feature-js.a
            build/libhull_feature-http.a
            build/libhull_feature-http-lua.a
            build/libhull_feature-http-js.a
            build/libhull_feature-tui-lua.a
            build/libhull_feature-tui-js.a
            build/libhull_feature-wasm.a
            build/libhull_feature-wasm-lua.a
            build/libhull_feature-wasm-js.a
            build/libhull_feature-sqlite.a
            build/libhull_feature-sqlite-lua.a
            build/libhull_feature-sqlite-js.a
            build/libhull_feature-image.a
            build/libhull_feature-image-lua.a
            build/libhull_feature-image-js.a

      # Per-flavor platform libs for `hull build --flavor` + `hull platform
      # install`. Each native platform-<flavor> target builds into its own obj
      # dir (build/flavor-<flavor>/), so the full libhull_platform.a above is
      # untouched. Publish them arch-qualified: libhull_platform-<flavor>-<arch>.a.
      # (Cosmo flavor libs are not published yet; build from source with
      # `make platform-cosmo-<flavor>`. See docs/build_flavors.md §7.)
      - name: Build platform flavors (Linux, reproducible container)
        if: runner.os == 'Linux'
        uses: ./.github/actions/hull-build-container
        with:
          # `sqliteless` is not a --flavor preset: it is the Phase D app-build
          # base (docs/sqlite_feature.md), built by the `platform-sqliteless`
          # target (HL_SQLITE_FEATURE=1 sub-build) and embedded by stage 3 when
          # HL_APP_BASE_SQLITELESS=1. It shares this step's obj-dir isolation +
          # arch-qualified naming.
          run: |
            for f in pure-compute sqliteless; do
              make "platform-$f"
              mv "build/libhull_platform-$f.a" \
                 "build/libhull_platform-$f-${{ matrix.name }}.a"
            done
      - name: Build platform flavors (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in pure-compute sqliteless; do
            make "platform-$f"
            mv "build/libhull_platform-$f.a" \
               "build/libhull_platform-$f-${{ matrix.name }}.a"
          done

      - name: Upload platform flavors
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: platform-flavors-${{ matrix.name }}
          path: build/libhull_platform-*-${{ matrix.name }}.a

  build-platform-cosmo:
    name: Build platform (cosmo, multi-arch)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      # cosmocc is baked into the reproducible container (roadmap 0.3.1), so
      # there is no fetch step; the dual-arch platform .a's are frozen with it.
      - name: Build platform (multi-arch, reproducible container)
        uses: ./.github/actions/hull-build-container
        with:
          run: make platform-cosmo

      - name: Upload cosmo platform archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: platform-cosmo
          path: |
            build/libhull_platform.x86_64-cosmo.a
            build/libhull_platform.aarch64-cosmo.a

  # Per-flavor cosmo platform libs (dual-arch), for `hull platform install
  # <flavor>` -> `hull build --flavor` on a cosmo hull. One flavor per fresh
  # runner (matrix): each does exactly ONE `make platform-cosmo-<flavor>` and
  # uploads its dual-arch pair. This isolation is REQUIRED -- a second cosmo
  # platform build in the same job corrupts the dynamic loader (system
  # cc/sh/gcc/clang can no longer mmap libc.so.6, while static cosmo APEs are
  # fine; disk + RAM are abundant, so it is not a resource limit). The lib
  # build itself always succeeds; we just never shell out to a compiler after
  # it (SHA-256 + sign + publish happen later on clean runners). Mirrors the
  # build-platform-cosmo job above, which proves one cosmo build + upload works.
  build-platform-cosmo-flavors:
    name: Build platform (cosmo, ${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor: [pure-compute]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      # cosmocc is baked into the reproducible container (roadmap 0.3.1), so
      # there is no fetch step.
      - name: Build cosmo flavor platform lib (dual-arch, reproducible container)
        uses: ./.github/actions/hull-build-container
        with:
          run: make platform-cosmo-${{ matrix.flavor }}

      - name: Upload cosmo flavor archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: platform-cosmo-flavor-${{ matrix.flavor }}
          path: |
            build/libhull_platform-${{ matrix.flavor }}.x86_64-cosmo.a
            build/libhull_platform-${{ matrix.flavor }}.aarch64-cosmo.a
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────
  # Stage 2: build + sign the platform manifest. Generates the
  # `embedded_platform_sig.h` header that gets baked into every hull
  # binary in stage 3. Uses the previous stable hull (v0.1.2) to
  # invoke `hull sign-release` for the Ed25519 signing — v0.1.2 hull
  # is the most recent release; its sign-release subcommand is
  # key-agnostic, so it signs whatever bytes we point it at with
  # whichever secret we supply.
  #
  # Bootstrap check: hard-fail if HULL_PLATFORM_KEY is empty. This
  # secret has been in the GH secrets since v0.1.0 (set when
  # sign-platform was first wired); v0.1.3 is the first release that
  # actually requires it at the workflow level.
  # ────────────────────────────────────────────────────────────────────

  sign-platform-manifest:
    name: Sign platform manifest
    runs-on: ubuntu-24.04
    needs: [build-platform-native, build-platform-cosmo]
    env:
      HULL_PLATFORM_KEY: ${{ secrets.HULL_PLATFORM_KEY }}
      # Hull version used to invoke `hull sign-release`. Pinned to a
      # known-good prior release so the bootstrap is deterministic.
      # Update only when v0.1.2 stops being a usable signer.
      HULL_BOOTSTRAP_VERSION: v0.1.2

    steps:
      - name: Bootstrap check
        run: |
          if [ -z "$HULL_PLATFORM_KEY" ]; then
            echo "::error::HULL_PLATFORM_KEY is empty. v0.1.3+ requires"
            echo "::error::it for the signed platform manifest. The secret"
            echo "::error::has been provisioned since v0.1.0 — check the"
            echo "::error::repo secrets configuration."
            exit 1
          fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: platform-*
          path: platforms/

      - name: Install hull ${{ env.HULL_BOOTSTRAP_VERSION }} (signer)
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/artalis-io/hull/releases/download/${HULL_BOOTSTRAP_VERSION}/hull-linux-x86_64" \
            -o /tmp/hull-signer
          chmod +x /tmp/hull-signer
          /tmp/hull-signer version

      - name: Build canonical platform manifest
        # One line per arch: "<64-hex-sha256>  <arch>\n".
        # Sort key: arch name (LC_ALL=C, second field). MUST match the
        # arch_entry_cmp order in src/hull/platform_sig.c so the C
        # builder and CI produce byte-identical manifests for the same
        # input set — otherwise round-tripping through
        # hl_platform_sig_build_manifest would yield a different SHA
        # than the embedded blob.
        # Same format as hull.sha256; matches what
        # hl_release_io_find_checksum parses at runtime.
        run: |
          set -eu
          {
            # The native arch entry hashes the EMBEDDED app-build base. Phase D
            # (docs/sqlite_feature.md): stage 3 embeds the SQLite-LESS base
            # (HL_APP_BASE_SQLITELESS=1), so verify_platform checks it against
            # THIS hash -- hash the sqlite-less base, not the sqlite-full one.
            # Cosmo keeps SQLite in-base (no Phase D), so its entries are the
            # sqlite-full cosmo archives.
            sha256sum \
              platforms/platform-flavors-linux-x86_64/libhull_platform-sqliteless-linux-x86_64.a \
              | awk '{print $1"  linux-x86_64"}'
            sha256sum \
              platforms/platform-flavors-linux-aarch64/libhull_platform-sqliteless-linux-aarch64.a \
              | awk '{print $1"  linux-aarch64"}'
            sha256sum \
              platforms/platform-flavors-darwin-arm64/libhull_platform-sqliteless-darwin-arm64.a \
              | awk '{print $1"  darwin-arm64"}'
            sha256sum \
              platforms/platform-cosmo/libhull_platform.x86_64-cosmo.a \
              | awk '{print $1"  cosmo-x86_64"}'
            sha256sum \
              platforms/platform-cosmo/libhull_platform.aarch64-cosmo.a \
              | awk '{print $1"  cosmo-aarch64"}'
            # Embedded feature archives (issue #114 + SQLite Phase C.2b/D), native
            # arches only (cosmo composes nothing). Name column is the COMPOSED
            # asset name that build.lua records in package.sig.gethull.composed
            # and that the runtime §5c looks up: "libhull_feature-<stem>.<arch>.a".
            # `sqlite` = the engine (Phase D), `sqlite-lua`/`sqlite-js` = the udf
            # bridges (Phase C.2b).
            for arch in linux-x86_64 linux-aarch64 darwin-arm64; do
              for stem in lua js http http-lua http-js tui-lua tui-js wasm wasm-lua wasm-js sqlite sqlite-lua sqlite-js image image-lua image-js; do
                f="platforms/platform-features-$arch/libhull_feature-$stem.a"
                sha256sum "$f" \
                  | awk -v n="libhull_feature-$stem.$arch.a" '{print $1"  "n}'
              done
            done
          } | LC_ALL=C sort -k2,2 > platform-manifest.txt
          echo "--- platform-manifest.txt ($(wc -l < platform-manifest.txt) entries):"
          cat platform-manifest.txt

      - name: Sign platform manifest (Ed25519)
        run: |
          set -eu
          umask 077
          printf '%s\n' "$HULL_PLATFORM_KEY" > /tmp/platform.key
          # hull sign-release writes <input>.sig — works for any text
          # manifest, not just hull.sha256. Same signing primitive.
          /tmp/hull-signer sign-release platform-manifest.txt --key /tmp/platform.key
          rm -f /tmp/platform.key
          test -s platform-manifest.txt.sig
          echo "--- platform-manifest.txt.sig:"
          cat platform-manifest.txt.sig

      - name: Generate embedded_platform_sig.h
        # xxd emits "unsigned char <name>[] = { ... };" and
        # "unsigned int <name>_len = ...;". The -n flag sets <name>;
        # we use the exact symbol names the source expects (see
        # src/hull/embedded_platform_sig.c).
        run: |
          set -eu
          mkdir -p build
          {
            echo '/* Auto-generated by .github/workflows/release.yml */'
            echo '/* sign-platform-manifest step. Do not edit. */'
            xxd -i -n hl_embedded_platform_sig_manifest \
                platform-manifest.txt
            xxd -i -n hl_embedded_platform_sig_signature \
                platform-manifest.txt.sig
          } > build/embedded_platform_sig.h
          echo "--- embedded_platform_sig.h ($(wc -c < build/embedded_platform_sig.h) bytes):"
          head -20 build/embedded_platform_sig.h
          echo "..."

      - name: Stage signed manifest for upload
        # Co-locate manifest text + .sig + .h so downstream jobs get a
        # single directory with everything they need:
        #   embedded_platform_sig.h — the C symbol embedded in hull
        #   platform-manifest.txt   — raw text (one line per arch),
        #                              used by build-* to sha256-verify
        #                              the .a they're about to embed
        #   platform-manifest.txt.sig — signature for offline audit
        run: |
          set -eu
          cp platform-manifest.txt platform-manifest.txt.sig build/

      - name: Upload signed manifest + header
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: embedded-platform-sig
          path: |
            build/embedded_platform_sig.h
            build/platform-manifest.txt
            build/platform-manifest.txt.sig

  # ────────────────────────────────────────────────────────────────────
  # Stage 3: build hull binaries with the signed manifest embedded.
  # These jobs DOWNLOAD their respective libhull_platform.a from stage
  # 1's artifacts (rather than rebuilding) — guarantees the embedded .a
  # bytes match what sign-platform-manifest hashed. They also download
  # the signed manifest header so HL_EMBED_PLATFORM_SIG gets defined
  # and embedded_platform_sig.c links the real signed blob.
  # ────────────────────────────────────────────────────────────────────

  build-cosmo:
    name: Build (Cosmopolitan APE)
    runs-on: ubuntu-24.04
    needs: [build-platform-cosmo, sign-platform-manifest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      # cosmocc is baked into the reproducible container (roadmap 0.3.1); the
      # build steps below run inside it, so there is no host fetch.
      - name: Download cosmo platform archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: platform-cosmo
          path: build/

      - name: Download signed manifest header
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: embedded-platform-sig
          path: build/

      - name: Verify downloaded .a files match signed manifest
        # Catch any drift between sign-platform-manifest's input and
        # what we're about to embed BEFORE wasting compute on the build.
        # Without this guard, a .a mismatch would silently ship a hull
        # binary that can't pass its own platform-sig cross-check at
        # `hull build --sign` time (exactly the v0.1.3-rc bug).
        run: |
          set -eu
          fail=0
          for entry in "cosmo-x86_64:build/libhull_platform.x86_64-cosmo.a" \
                       "cosmo-aarch64:build/libhull_platform.aarch64-cosmo.a"; do
            arch="${entry%%:*}"
            file="${entry##*:}"
            actual=$(sha256sum "$file" | awk '{print $1}')
            expected=$(awk -v a="$arch" '$2==a {print $1}' build/platform-manifest.txt)
            if [ -z "$expected" ]; then
              echo "::error::arch '$arch' not in signed manifest"
              fail=1
            elif [ "$actual" != "$expected" ]; then
              echo "::error::$file SHA mismatch: expected=$expected actual=$actual"
              fail=1
            else
              echo "✓ $arch .a SHA matches signed manifest: $actual"
            fi
          done
          [ "$fail" = 0 ] || exit 1

      # Build inside the snapshot-pinned reproducible container (roadmap 0.3.1).
      # cosmocc is baked in. Hardening summary runs in the same container step so
      # no host make touches the tree after the build. Default root (not
      # user: host): the host-side smoke test only executes build/hull, which is
      # world-executable, and no host step writes into build/ here (the cosmo
      # Platform-sig E2E is skipped). This matches the proven reproducibility-cosmo
      # CI job. No TRUST_PLATFORM_LIB needed for cosmo: the .a's at
      # build/libhull_platform.{x86_64,aarch64}-cosmo.a have no build rule in the
      # Makefile (produced by the .PHONY platform-cosmo target during native
      # development), so make treats them as leaf inputs and will not rebuild.
      - name: Build hull (cosmo APE, reproducible container)
        uses: ./.github/actions/hull-build-container
        with:
          run: |
            make CC=cosmocc hardening
            make CC=cosmocc EMBED_PLATFORM=cosmo

      - name: Smoke-test version
        run: ./build/hull version

      - name: Platform-sig E2E smoke test (SKIPPED for cosmo)
        # v0.1.4 attempted to re-enable this (with widened unveils +
        # cosmocc auto-detect from §3.1). It still fails — but for a
        # deeper reason than f3311cd's original diagnosis. The unveils
        # ARE now correct (the sandbox log shows "16 unveiled paths"
        # including /opt where cosmocc lives), but spawning any child
        # process from a cosmo APE running under the jart pledge
        # polyfill on Linux still hits:
        #
        #   /bin/sh: error while loading shared libraries: libc.so.6:
        #            failed to map segment from shared object
        #   /usr/bin/cc: ... libc.so.6: failed to map segment ...
        #
        # That's mmap(PROT_EXEC) from the child's dynamic linker being
        # rejected by the parent's seccomp-bpf filter — an mmap-policy
        # restriction in the polyfill itself, NOT an unveil/path issue.
        # Widening the unveil set can't fix it.
        #
        # The native build jobs (darwin-arm64, linux-x86_64,
        # linux-aarch64) DO run the full platform-sig E2E end-to-end
        # under BOTH --no-sandbox and the real sandbox. Same canonical-
        # JSON reconstruction, same hl_platform_sig_verify, same
        # hl_sig_verify code. Three independent arch coverages are
        # sufficient gating for the gethull signature chain.
        #
        # Cosmo-specific gating would need either (a) a different
        # pledge polyfill that allows child-process PROT_EXEC mmap, or
        # (b) running the cosmo APE without --no-sandbox on a host that
        # ignores cosmo's polyfill (e.g. macOS), or (c) the embedded
        # TCC path on cosmo (currently unsupported — cosmo .a archives
        # need cosmocc to link). All non-trivial; tracked separately.
        run: |
          echo "Platform-sig E2E smoke test: SKIPPED for cosmo build."
          echo "See comment above. Native jobs gate the signature chain."

      - name: Rename artifact
        run: cp build/hull hull-cosmo

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hull-cosmo
          path: hull-cosmo

      # ── libhull: dual-arch cosmo embedding archive ──
      # Under the fat cosmocc driver, `make libhull` emits build/libhull.a
      # (x86_64) plus its build/.aarch64/libhull.a sibling. Publish them
      # arch-qualified, mirroring libhull_platform.{x86_64,aarch64}-cosmo.a.
      - name: Build + rename cosmo libhull.a (dual-arch, reproducible container)
        uses: ./.github/actions/hull-build-container
        with:
          run: |
            make libhull CC=cosmocc
            cp build/libhull.a          libhull.x86_64-cosmo.a
            cp build/.aarch64/libhull.a libhull.aarch64-cosmo.a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: libhull-cosmo
          path: |
            libhull.x86_64-cosmo.a
            libhull.aarch64-cosmo.a

  build-native:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [build-platform-native, sign-platform-manifest]

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            artifact: hull-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            artifact: hull-linux-aarch64
          - name: darwin-arm64
            os: macos-15
            artifact: hull-darwin-arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Download libhull_platform.a (this arch)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: platform-${{ matrix.name }}
          path: build/

      # Embedded feature archives (issue #114). Land them in build/ under their
      # plain names so `make ... TRUST_FEATURE_LIBS=1` embeds these exact (signed)
      # bytes rather than re-archiving from source.
      - name: Download embedded feature archives (this arch)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: platform-features-${{ matrix.name }}
          path: build/

      # Phase D (docs/sqlite_feature.md): the SQLite-LESS app-build base. Land it
      # at build/libhull_platform-sqliteless.a (the name the Makefile's
      # SQLITELESS_PLATFORM_LIB + TRUST_PLATFORM_LIB expect) so HL_APP_BASE_SQLITELESS=1
      # embeds these exact signed bytes.
      - name: Download SQLite-less app-build base (this arch)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: platform-flavors-${{ matrix.name }}
          path: build/flavors/
      - name: Stage SQLite-less base
        run: cp build/flavors/libhull_platform-sqliteless-${{ matrix.name }}.a build/libhull_platform-sqliteless.a

      - name: Download signed manifest header
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: embedded-platform-sig
          path: build/

      - name: Verify downloaded .a matches signed manifest
        # Catch any drift between sign-platform-manifest's input and
        # what we're about to embed BEFORE wasting compute on the build.
        # See same step in build-cosmo for rationale.
        run: |
          set -eu
          # Phase D: the native arch entry hashes the SQLite-LESS base (what stage
          # 3 embeds via HL_APP_BASE_SQLITELESS=1), so verify THAT against it.
          actual=$(sha256sum build/libhull_platform-sqliteless.a | awk '{print $1}')
          expected=$(awk -v a="${{ matrix.name }}" '$2==a {print $1}' build/platform-manifest.txt)
          if [ -z "$expected" ]; then
            echo "::error::arch '${{ matrix.name }}' not in signed manifest"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::SQLite-less base SHA mismatch"
            echo "  expected (signed manifest): $expected"
            echo "  actual   (downloaded .a):   $actual"
            exit 1
          fi
          echo "✓ ${{ matrix.name }} SQLite-less base SHA matches signed manifest: $actual"
          # Same cross-check for each embedded feature archive: its downloaded
          # bytes MUST match the signed-manifest entry keyed by the composed asset
          # name (libhull_feature-<stem>.<arch>.a), or the runtime §5c check on
          # every app this hull builds would fail. Includes the SQLite engine
          # (sqlite) + udf bridges (sqlite-lua/sqlite-js).
          for stem in lua js http http-lua http-js tui-lua tui-js wasm wasm-lua wasm-js sqlite sqlite-lua sqlite-js image image-lua image-js; do
            fa="build/libhull_feature-$stem.a"
            name="libhull_feature-$stem.${{ matrix.name }}.a"
            fact=$(sha256sum "$fa" | awk '{print $1}')
            exp=$(awk -v n="$name" '$2==n {print $1}' build/platform-manifest.txt)
            if [ -z "$exp" ]; then
              echo "::error::$name not in signed manifest"; exit 1
            fi
            if [ "$fact" != "$exp" ]; then
              echo "::error::$name SHA mismatch (expected $exp, got $fact)"; exit 1
            fi
            echo "✓ $name SHA matches signed manifest: $fact"
          done

      # Linux builds in the snapshot-pinned reproducible container (roadmap
      # 0.3.1) so the shipped hull is byte-reproducible across time; user: host
      # makes build/ host-owned for the Platform-sig E2E below (which does
      # keygen/sign into build/ and runs the freshly built binary). Hardening
      # summary + verification run in the same container step so no host make
      # touches the tree after the reproducible build. macOS builds bare: no
      # container touches the macos-15 Xcode runner.
      #
      # TRUST_PLATFORM_LIB=1 short-circuits $(PLATFORM_LIB)'s rebuild rule in the
      # Makefile; make treats the downloaded .a as a pristine leaf input and
      # never re-archives it from source. The downloaded .a's bytes are the ones
      # sign-platform-manifest hashed, and they get embedded as-is. Without this,
      # make sees PLATFORM_OBJS / CANARY_OBJ as newer than the .a and rebuilds it
      # from scratch; the rebuilt bytes differ from the signed manifest entry on
      # a different runner, breaking the gethull cross-check.
      # TRUST_FEATURE_LIBS=1 does the same for the embedded runtime/HTTP/tui-bridge
      # feature archives (issue #114 §5c): the downloaded, signed bytes are embedded
      # as-is so the runtime composed-feature check matches the signed manifest.
      - name: Build hull + verify hardening (Linux, reproducible container)
        if: runner.os == 'Linux'
        uses: ./.github/actions/hull-build-container
        with:
          user: host
          run: |
            make EMBED_PLATFORM=1 HL_APP_BASE_SQLITELESS=1 TRUST_PLATFORM_LIB=1 TRUST_FEATURE_LIBS=1
            make hardening
            make check-hardening
      - name: Build hull with embedded platform (macOS)
        if: runner.os == 'macOS'
        run: make EMBED_PLATFORM=1 HL_APP_BASE_SQLITELESS=1 TRUST_PLATFORM_LIB=1 TRUST_FEATURE_LIBS=1
      - name: Hardening summary (macOS)
        if: runner.os == 'macOS'
        run: make hardening
      - name: Hardening verification (macOS)
        # Verifies the just-built binary carries the expected compiler/linker
        # hardening properties (PIE, RELRO+BIND_NOW, NX, canaries, CET/BTI).
        # Required protections missing for this platform cause a non-zero exit
        # and the release fails.
        if: runner.os == 'macOS'
        run: make check-hardening

      - name: Smoke-test version + platform
        run: |
          ./build/hull version
          ./build/hull doctor | grep -E "embedded\s+yes|hull build" || (echo "::error::Platform library not embedded"; exit 1)

      - name: Platform-sig E2E smoke test
        # Build a signed app with the freshly-baked hull binary, exercising
        # the full chain: hull build cross-checks the .a's SHA against the
        # gethull manifest IT embeds, then the output binary runs under
        # --verify-sig and re-verifies the gethull layer at startup. This
        # is the test that would have caught the v0.1.3-rc bug; release
        # cannot proceed past this point if either layer is broken.
        run: |
          set -eu
          "${GITHUB_WORKSPACE}/build/hull" keygen "${GITHUB_WORKSPACE}/build/plat"
          "${GITHUB_WORKSPACE}/build/hull" sign-platform \
              --dir "${GITHUB_WORKSPACE}/build/" \
              "${GITHUB_WORKSPACE}/build/plat"
          TMP=$(mktemp -d)
          cd "$TMP"
          cat > app.lua <<'LUA'
          app.manifest({modules = {"hull/http-server@1"}})
          app.get("/", function(req, res) res:json({ok=true}) end)
          LUA
          "${GITHUB_WORKSPACE}/build/hull" keygen dev
          "${GITHUB_WORKSPACE}/build/hull" build --sign dev.key -o myapp .
          test -x myapp
          # Variant A: --no-sandbox. Primary gate; confirms the
          # signature chain works end-to-end without fighting the
          # runtime sandbox during CI (which has its own polyfill
          # quirks per platform).
          ./myapp --verify-sig dev.pub --no-sandbox -p 19888 ./app.lua &
          SVR=$!
          sleep 3
          if ! kill -0 "$SVR" 2>/dev/null; then
            echo "::error::myapp failed to start under --verify-sig --no-sandbox (platform-sig check broken)"
            exit 1
          fi
          RESP=$(curl -fsS http://127.0.0.1:19888/ || echo FAIL)
          kill "$SVR" 2>/dev/null || true
          wait "$SVR" 2>/dev/null || true
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::wrong response: $RESP"; exit 1; }
          echo "✓ platform-sig E2E variant A (build --sign + --verify-sig --no-sandbox) passes"

          # Variant B: full sandbox. Catches any signature-chain code
          # that accidentally needs paths/syscalls the sandbox blocks.
          # Same myapp binary, same keys — only the sandbox is
          # different.
          ./myapp --verify-sig dev.pub -p 19889 ./app.lua &
          SVR=$!
          sleep 3
          if ! kill -0 "$SVR" 2>/dev/null; then
            echo "::error::myapp failed to start under --verify-sig + sandbox"
            echo "::error::the sig chain works without sandbox but breaks under it"
            exit 1
          fi
          RESP=$(curl -fsS http://127.0.0.1:19889/ || echo FAIL)
          kill "$SVR" 2>/dev/null || true
          wait "$SVR" 2>/dev/null || true
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::wrong response under sandbox: $RESP"; exit 1; }
          echo "✓ platform-sig E2E variant B (build --sign + --verify-sig WITH sandbox) passes"

      - name: Rename artifact
        run: cp build/hull ${{ matrix.artifact }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      # ── libhull: the no-runtime embedding archive for this arch ──
      # Built from the same objects as the hull binary above; published so
      # hl_embed_* native hosts can fetch + verify a known-good archive.
      # Its SHA-256 goes into the release-signed hull.sha256 manifest.
      - name: Build + rename libhull.a (Linux, reproducible container)
        if: runner.os == 'Linux'
        uses: ./.github/actions/hull-build-container
        with:
          user: host
          run: |
            make libhull
            cp build/libhull.a libhull-${{ matrix.name }}.a
      - name: Build + rename libhull.a (macOS)
        if: runner.os == 'macOS'
        run: |
          make libhull
          cp build/libhull.a libhull-${{ matrix.name }}.a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: libhull-${{ matrix.name }}
          path: libhull-${{ matrix.name }}.a

  build-wamrc:
    # Side-loaded `wamrc` (WAMR AOT compiler) shipped as a separate
    # release asset and pulled by `hull tools install wamrc`. See
    # docs/tools_install.md. The trust chain reuses the same
    # Ed25519-signed hull.sha256 manifest — each wamrc artifact is
    # listed in the manifest below.
    #
    # No cosmo wamrc: LLVM doesn't fit cleanly into a cosmocc fat APE
    # binary. Cosmo users build from source with `make wamrc`.
    name: Build wamrc (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            artifact: hull-wamrc-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            artifact: hull-wamrc-linux-aarch64
          - name: darwin-arm64
            os: macos-15
            artifact: hull-wamrc-darwin-arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install LLVM + cmake (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev cmake

      - name: Install LLVM + cmake (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@18 cmake

      - name: Build wamrc
        run: |
          # Declare separately so shellcheck SC2155 doesn't flag the
          # masked return value from $(llvm-config-18 ...).
          if command -v llvm-config-18 >/dev/null 2>&1; then
            llvm_cmakedir=$(llvm-config-18 --cmakedir)
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=${llvm_cmakedir}"
          elif [ -d /opt/homebrew/opt/llvm@18 ]; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=/opt/homebrew/opt/llvm@18/lib/cmake/llvm"
          elif [ -d /usr/local/opt/llvm@18 ]; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=/usr/local/opt/llvm@18/lib/cmake/llvm"
          fi
          make wamrc
          strip build/wamrc 2>/dev/null || true

      - name: Smoke-test wamrc
        run: ./build/wamrc --help | head -5

      - name: Rename artifact
        run: cp build/wamrc ${{ matrix.artifact }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-tcc:
    # Side-loaded `tcc` (TinyCC) shipped as a separate release asset and pulled
    # by `hull tools install tcc` for `hull build --compiler=tcc`. Formerly
    # embedded in the hull binary; now a tool (same trust chain as wamrc — each
    # artifact is listed in the Ed25519-signed hull.sha256 manifest below).
    #
    # Linux only: tcc emits ELF, unusable on macOS (Mach-O) or cosmo (APE
    # archives), which use the system compiler.
    name: Build tcc (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            artifact: hull-tcc-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            artifact: hull-tcc-linux-aarch64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build tcc
        run: |
          make tcc
          strip build/tcc 2>/dev/null || true

      - name: Smoke-test tcc
        run: ./build/tcc -v

      - name: Rename artifact
        run: cp build/tcc ${{ matrix.artifact }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-feature-native:
    # Composable DuckDB feature archive (libhull_feature-duckdb-<arch>.a),
    # shipped as a release asset and pulled by `hull feature install duckdb`
    # -> `hull build --with=duckdb`. See docs/features_and_flavors.md.
    #
    # Built bare (not in the reproducible container): `make fetch-duckdb` needs
    # network, and the archive is covered by the release signature only -- it is
    # NOT part of the platform-sig cross-check -- so it need not be byte-
    # reproducible across rebuilds. Its SHA-256 lands in the signed hull.sha256
    # and `hull feature install` re-verifies the download against that.
    #
    # No cosmo feature: DuckDB is native-only (docs/features_and_flavors.md).
    name: Build feature duckdb (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      # fetch-duckdb isolates DuckDB's bundled mbedTLS/psa symbols via
      # objcopy --redefine-syms. macOS runners ship no objcopy, and GNU gobjcopy
      # handles Mach-O poorly, so install Homebrew LLVM: fetch-duckdb's Makefile
      # rule finds /opt/homebrew/opt/llvm/bin/llvm-objcopy automatically. Linux
      # runners already have objcopy. (Caught by the release dry-run.)
      - name: Install llvm-objcopy (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Fetch DuckDB static libs (with mbedTLS symbol isolation)
        run: make fetch-duckdb

      - name: Build DuckDB feature archive
        run: make feature-duckdb

      - name: Rename artifact (arch-qualified)
        run: mv build/libhull_feature-duckdb.a libhull_feature-duckdb-${{ matrix.name }}.a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: feature-duckdb-${{ matrix.name }}
          path: libhull_feature-duckdb-${{ matrix.name }}.a

  build-feature-gpu:
    # Composable GPU feature archive (libhull_feature-gpu-<arch>.a), shipped as a
    # release asset and pulled by `hull feature install gpu` -> `hull build
    # --with=gpu`. See docs/features_and_flavors.md.
    #
    # Built bare (not in the reproducible container): `make fetch-wgpu` needs
    # network, and the archive is covered by the release signature only (not the
    # platform-sig cross-check), so it need not be byte-reproducible. Its SHA-256
    # lands in the signed hull.sha256 and `hull feature install` re-verifies.
    #
    # Unlike duckdb, wgpu needs NO symbol isolation (no objcopy / LLVM): it shares
    # no symbols with Hull. The macOS frameworks (Metal/QuartzCore/CoreGraphics/
    # Foundation) and Linux -lvulkan are link-time deps that build.lua emits at
    # app-compose time; the feature archive only `ar`s cap_gpu_wgpu.o +
    # libwgpu_native.a members (no linking), so no framework / vulkan-dev install
    # is needed here.
    #
    # No cosmo feature: GPU is native-only.
    name: Build feature gpu (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
