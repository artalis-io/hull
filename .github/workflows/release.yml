name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-cosmo:
    name: Build (Cosmopolitan APE)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Install cosmocc
        run: |
          COSMOCC_DIR=/opt/cosmo make fetch-cosmocc
          echo "/opt/cosmo/bin" >> $GITHUB_PATH

      - name: Build platform (multi-arch)
        run: make platform-cosmo

      - name: Build hull (cosmo APE)
        run: make CC=cosmocc EMBED_PLATFORM=cosmo

      - name: Smoke-test version
        run: ./build/hull version

      - name: Rename artifact
        run: cp build/hull hull-cosmo

      - uses: actions/upload-artifact@v4
        with:
          name: hull-cosmo
          path: hull-cosmo

  build-native:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: hull-linux-x86_64
          - name: darwin-arm64
            os: macos-latest
            artifact: hull-darwin-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build
        run: make

      - name: Smoke-test version
        run: ./build/hull version

      - name: Rename artifact
        run: cp build/hull ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-cosmo, build-native]
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          mv artifacts/hull-cosmo/hull-cosmo               dist/hull-cosmo
          mv artifacts/hull-linux-x86_64/hull-linux-x86_64 dist/hull-linux-x86_64
          mv artifacts/hull-darwin-arm64/hull-darwin-arm64  dist/hull-darwin-arm64

      - name: Make binaries executable
        run: chmod +x dist/*

      - name: Compute SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum hull-cosmo hull-linux-x86_64 hull-darwin-arm64 > hull.sha256
          cat hull.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Hull ${{ github.ref_name }}" \
            --generate-notes \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
            dist/hull-cosmo \
            dist/hull-linux-x86_64 \
            dist/hull-darwin-arm64 \
            dist/hull.sha256
