name: Windows cosmocc (investigation)

# Characterizes whether a `hull-cosmo` APE can `hull build` an app ON Windows by
# spawning cosmocc. VERDICT (this workflow proves it): NO, not with cosmocc alone.
# hull-cosmo itself RUNS on Windows (it is a real fat APE), but cosmocc's DRIVER
# is a `#!/bin/sh` POSIX shell script (only its leaf tools are `.ape` APEs; the
# arch compilers are symlinks -> cosmocc). So `hull build` spawning `cosmocc` via
# execvp fails on Windows ("no C compiler available") - there is no /bin/sh, and a
# naive extraction breaks the symlinks. Enabling it would need hull to drive
# cosmocc THROUGH cosmo's bundled shell (cocmd/bash) + symlink-aware extraction -
# a design change, not a `hull tools install`. See docs/cosmocc_install.md.
#
# Informational + non-required: it asserts the CURRENT reality and passes, so if
# Cosmopolitan ever makes cosmocc directly drivable on Windows the assertions flip
# and flag it. Standalone workflow, run on demand / when the cosmocc files change.
#
# SPDX-License-Identifier: AGPL-3.0-or-later

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-cosmocc.yml'
      - 'scripts/build_cosmocc_bundle.sh'

permissions:
  contents: read

env:
  HULL_VERSION: v0.9.0
  COSMOCC_VERSION: 4.0.2
  COSMOCC_SHA256: 85b8c37a406d862e656ad4ec14be9f6ce474c1b436b9615e91a55208aced3f44

jobs:
  characterize:
    name: cosmocc on Windows — characterize
    runs-on: windows-latest
    steps:
      - name: hull-cosmo (a fat APE) runs on Windows
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:HULL_VERSION/hull-cosmo"
          curl.exe -fsSL --retry 3 -o hull-cosmo.exe $url
          $out = .\hull-cosmo.exe version 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "EXPECTED PASS FLIPPED: hull-cosmo no longer runs on Windows" }
          Write-Host "PASS: hull-cosmo runs on Windows."

      - name: cosmocc driver is a POSIX shell script (not an APE)
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 -o cosmocc.zip "https://cosmo.zip/pub/cosmocc/cosmocc-$env:COSMOCC_VERSION.zip"
          $actual = (Get-FileHash cosmocc.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:COSMOCC_SHA256) { throw "cosmocc sha mismatch: $actual" }
          $dest = "$env:USERPROFILE\.cosmocc"
          Expand-Archive cosmocc.zip -DestinationPath $dest -Force
          $bytes = [System.IO.File]::ReadAllBytes("$dest\bin\cosmocc")[0..15]
          $head = -join ($bytes | ForEach-Object { if ($_ -ge 32 -and $_ -lt 127) { [char]$_ } else { '.' } })
          Write-Host "cosmocc head : $head"
          Write-Host "cosmocc size : $((Get-Item "$dest\bin\cosmocc").Length) bytes"
          $archcc = "$dest\bin\x86_64-unknown-cosmo-cc"
          Write-Host "arch cc size : $((Get-Item $archcc).Length) bytes (symlink stub)"
          if ($head -notlike '#!/bin/sh*') { throw "FINDING FLIPPED: cosmocc is no longer a #!/bin/sh script - re-evaluate the Windows story" }
          Write-Host "PASS (finding): cosmocc is a #!/bin/sh driver; arch cc's are symlinks -> a POSIX shell + symlink-aware extraction are required."

      - name: hull build cannot spawn cosmocc on Windows (the consequence)
        shell: pwsh
        run: |
          $env:HOME = $env:USERPROFILE
          $env:PATH = "$env:USERPROFILE\.cosmocc\bin;$env:PATH"
          New-Item -ItemType Directory -Force -Path app | Out-Null
          "app.manifest({ modules = {} })`napp.main(function() return 0 end)" | Set-Content -NoNewline app\app.lua -Encoding ascii
          $out = .\hull-cosmo.exe build app -o app-out.exe --no-verify-platform 2>&1 | Out-String
          $buildExit = $LASTEXITCODE
          Write-Host $out
          Write-Host "--- hull build exit: $buildExit ---"
          # hull build is EXPECTED to fail here (cosmocc = shell script). Its
          # non-zero exit must not fail this characterization step, so decide the
          # step result explicitly: PASS on the expected failure, FLAG (exit 1)
          # only if it UNEXPECTEDLY produced a binary (i.e. Windows now works).
          if (Test-Path app-out.exe) {
            Write-Host "UNEXPECTED: hull build produced a binary on Windows - the cosmocc-on-Windows story may now work; re-evaluate the finding."
            exit 1
          }
          Write-Host "PASS (finding): hull build fails on Windows (cosmocc is a #!/bin/sh driver hull cannot execvp)."
          exit 0

      - name: Conclusion
        shell: pwsh
        run: |
          Write-Host "=================================================================="
          Write-Host "hull-cosmo runs on Windows: YES."
          Write-Host "hull build via cosmocc on Windows: NO (cosmocc = #!/bin/sh driver"
          Write-Host "+ symlink toolchain). `hull tools install cosmocc` alone does not"
          Write-Host "solve it; hull would need to drive cosmocc through cosmo's bundled"
          Write-Host "shell (cocmd) with symlink-aware extraction - a design change."
          Write-Host "=================================================================="

  section0b-ape-shell-self-contained:
    # §0.5 SELF-CONTAINMENT (the crux for "install one thing + it works"): Git
    # Bash is not on a stock Windows box, so requiring a host POSIX sh defeats the
    # goal. Cosmopolitan ships bash/dash as APEs (cosmo.zip/pub/cosmos/bin) - which
    # run on Windows natively, like hull-cosmo. Does an APE bash (NOT Git Bash)
    # drive cosmocc on Windows? If YES, the toolchain is fully self-contained
    # (bundle cosmocc + an APE bash); if NO, you still need Git Bash / WSL.
    name: "§0.5 — does an APE bash drive cosmocc (self-contained)?"
    runs-on: windows-latest
    steps:
      - name: Extract cosmocc (bsdtar, symlink-preserving) + fetch the APE bash
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 -o cosmocc.zip "https://cosmo.zip/pub/cosmocc/cosmocc-$env:COSMOCC_VERSION.zip"
          if ((Get-FileHash cosmocc.zip -Algorithm SHA256).Hash.ToLower() -ne $env:COSMOCC_SHA256) { throw "sha mismatch" }
          New-Item -ItemType Directory -Force -Path cosmo | Out-Null
          tar.exe -xpf cosmocc.zip -C cosmo 2>&1 | Write-Host
          # The cosmos APE bash - runs on Windows natively (no Git Bash / WSL).
          curl.exe -fsSL --retry 3 -o cosmo\bin\bash.exe "https://cosmo.zip/pub/cosmos/bin/bash"
          Write-Host "bash.exe size: $((Get-Item cosmo\bin\bash.exe).Length)"

      - name: APE bash runs on Windows
        id: ape_bash_runs
        continue-on-error: true
        shell: pwsh
        run: |
          & .\cosmo\bin\bash.exe -c "echo ape-bash-ok; uname -a 2>/dev/null || true"
          if ($LASTEXITCODE -ne 0) { throw "APE bash did not run (exit $LASTEXITCODE)" }

      - name: Write hello.c
        shell: pwsh
        run: '"int main(void){return 42;}" | Set-Content -NoNewline hello.c -Encoding ascii'

      - name: APE bash drives cosmocc
        id: ape_drives
        continue-on-error: true
        shell: pwsh
        run: |
          # bash inherits pwsh's cwd (the workspace), so relative paths resolve.
          # Diagnose the /bin/sh dependency (cosmocc is #!/bin/sh) and try driving
          # it (a) by name (triggers shebang exec) and (b) via the interpreter
          # explicitly (bypasses the driver's shebang), and (c) after planting the
          # APE bash at /bin/sh to satisfy the shebang + the symlinked sub-tools.
          & .\cosmo\bin\bash.exe -c 'echo "--- /bin ---"; ls -la /bin/sh 2>&1 || echo "no /bin/sh"; echo "sh: $(command -v sh || echo none)"' 2>&1 | Out-String | Write-Host
          Write-Host "=== (a) by name ==="
          & .\cosmo\bin\bash.exe -c 'export PATH="./cosmo/bin:$PATH"; cosmocc -o hello_a.com hello.c; echo "exit=$?"' 2>&1 | Out-String | Write-Host
          Write-Host "=== (b) via interpreter (bash <script>) ==="
          & .\cosmo\bin\bash.exe -c 'export PATH="./cosmo/bin:$PATH"; bash ./cosmo/bin/cosmocc -o hello_b.com hello.c; echo "exit=$?"' 2>&1 | Out-String | Write-Host
          Write-Host "=== (c) plant /bin/sh = the APE dash, then by name ==="
          & .\cosmo\bin\bash.exe -c 'mkdir -p /bin 2>/dev/null; cp ./cosmo/bin/bash.exe /bin/sh 2>&1 || echo "cannot write /bin/sh"; export PATH="./cosmo/bin:$PATH"; cosmocc -o hello_c.com hello.c; echo "exit=$?"' 2>&1 | Out-String | Write-Host
          if (Test-Path hello_a.com) { Copy-Item hello_a.com hello_ape.com -Force }
          elseif (Test-Path hello_b.com) { Copy-Item hello_b.com hello_ape.com -Force }
          elseif (Test-Path hello_c.com) { Copy-Item hello_c.com hello_ape.com -Force }
          Write-Host "any variant built: $(Test-Path hello_ape.com)"

      - name: Verdict — self-contained APE toolchain on Windows?
        shell: pwsh
        run: |
          $built = Test-Path hello_ape.com
          Write-Host "APE bash built hello_ape.com : $built"
          $ran = $false
          if ($built) {
            Copy-Item hello_ape.com hello_ape.exe -Force
            & .\hello_ape.exe; $rc = $LASTEXITCODE; $global:LASTEXITCODE = 0
            $lo = $rc -band 0xFF; $hi = ($rc -shr 8) -band 0xFF
            Write-Host "hello_ape ran, exit=$rc (lo=$lo hi=$hi; expected 42)"
            if ($lo -eq 42 -or $hi -eq 42) { $ran = $true }
          }
          Write-Host "=================================================================="
          if ($built -and $ran) {
            Write-Host "UNEXPECTED SELF-CONTAINED GO: an APE bash now drives cosmocc on"
            Write-Host "Windows - the story IMPROVED; update docs/cosmocc_install.md."
            exit 0
          }
          Write-Host "FINDING (expected): a bare APE bash does NOT drive cosmocc on"
          Write-Host "Windows. The APE bash RUNS, but cosmocc's #!/bin/sh + symlinked"
          Write-Host "sub-tool pipeline needs a real /bin/sh MOUNT: there is no /bin/sh"
          Write-Host "(exit 127 by name AND via `bash <script>`, since the sub-tools"
          Write-Host "re-exec via shebang), and /bin is not writable to plant one."
          Write-Host "MSYS/Git-Bash/WSL provide that mount; a bundled APE shell cannot."
          Write-Host "=> Self-contained cosmocc on Windows is NOT achievable; the path"
          Write-Host "   needs MSYS/Git-Bash/WSL (external), or build on a POSIX host."
          exit 0

  section0c-busybox-w64-self-contained:
    # §0.6 SELF-CONTAINMENT via busybox-w64 (the lighter-than-MSYS candidate).
    # §0.5 failed because an APE bash provides an interpreter but (a) no /bin/sh
    # MOUNT and (b) no coreutils - and cosmocc's #!/bin/sh driver shells out to
    # dirname/readlink/uname/sed/... busybox-w64 is a SINGLE native Windows PE (no
    # Cygwin/MSYS DLL) that provides BOTH the sh (ash) AND every coreutil as
    # applets, and it has built-in shebang handling that can route #!/bin/sh to its
    # own sh. If busybox drives cosmocc, a stock Windows box is self-sufficient with
    # a ~1 MB extra binary (vs a ~40 MB GPLv3 MSYS runtime). If not, the diagnostics
    # say why (/bin/sh routing, applet resolution, or APE-child path translation).
    name: "§0.6 — does busybox-w64 sh drive cosmocc (self-contained)?"
    runs-on: windows-latest
    steps:
      - name: Extract cosmocc (bsdtar, symlink-preserving) + fetch busybox-w64
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 -o cosmocc.zip "https://cosmo.zip/pub/cosmocc/cosmocc-$env:COSMOCC_VERSION.zip"
          if ((Get-FileHash cosmocc.zip -Algorithm SHA256).Hash.ToLower() -ne $env:COSMOCC_SHA256) { throw "sha mismatch" }
          New-Item -ItemType Directory -Force -Path cosmo | Out-Null
          tar.exe -xpf cosmocc.zip -C cosmo 2>&1 | Write-Host
          New-Item -ItemType Directory -Force -Path bb | Out-Null
          # busybox-w64 (Ron Yorston). Single native PE, no Cygwin/MSYS runtime.
          curl.exe -fsSL --retry 3 -L -o bb\busybox.exe "https://frippery.org/files/busybox/busybox64u.exe"
          Write-Host "busybox.exe size: $((Get-Item bb\busybox.exe).Length)"

      - name: busybox-w64 runs on Windows (sh + coreutils applets)
        id: bb_runs
        continue-on-error: true
        shell: pwsh
        run: |
          & .\bb\busybox.exe echo busybox-ok
          if ($LASTEXITCODE -ne 0) { throw "busybox did not run (exit $LASTEXITCODE)" }
          & .\bb\busybox.exe sh -c 'echo "sh-ok: $(dirname /a/b) $(uname -s 2>/dev/null || echo nouname)"'
          if ($LASTEXITCODE -ne 0) { throw "busybox sh -c failed (exit $LASTEXITCODE)" }

      - name: Write hello.c
        shell: pwsh
        run: '"int main(void){return 42;}" | Set-Content -NoNewline hello.c -Encoding ascii'

      - name: busybox sh drives cosmocc
        id: bb_drives
        continue-on-error: true
        shell: pwsh
        run: |
          # Diagnose how busybox resolves /bin/sh (the cosmocc shebang target) and
          # whether it routes bare applet names (dirname/uname) the driver calls.
          & .\bb\busybox.exe sh -c 'echo "sh: $(command -v sh || echo none)"; echo "--- /bin/sh ---"; ls -la /bin/sh 2>&1 || echo "no /bin/sh"; echo "dirname applet: $(command -v dirname || echo none)"' 2>&1 | Out-String | Write-Host
          # Plant C:\bin\sh.exe (the #!/bin/sh target; busybox appends .exe) so the
          # driver AND its symlinked sub-tools resolve their shebang to busybox sh.
          New-Item -ItemType Directory -Force -Path C:\bin | Out-Null
          Copy-Item bb\busybox.exe C:\bin\sh.exe -Force
          Write-Host "=== (a) by name (busybox shebang routing) ==="
          & .\bb\busybox.exe sh -c 'export PATH="./cosmo/bin:$PATH"; cosmocc -o hello_a.com hello.c; echo "exit=$?" > exit_a.txt' 2>&1 | Out-String | Write-Host
          Write-Host "=== (b) via interpreter (busybox sh <driver>) ==="
          & .\bb\busybox.exe sh -c 'export PATH="./cosmo/bin:$PATH"; busybox sh ./cosmo/bin/cosmocc -o hello_b.com hello.c; echo "exit=$?" > exit_b.txt' 2>&1 | Out-String | Write-Host
          # (a)/(b) build a correct APE but the driver's final `mv /tmp/....com.dbg`
          # fails: busybox /tmp and the native APE sub-tools' /tmp resolve to
          # DIFFERENT real dirs, so the debug sidecar isn't where the driver looks.
          # (c) aligns them: one real C:\tmp, exported as TMPDIR/TMP/TEMP, which both
          # busybox AND the cosmo APEs honor for ${TMPDIR:-/tmp} - aiming for exit 0.
          Write-Host "=== (c) shared TMPDIR (C:\tmp) so the .dbg rename resolves ==="
          New-Item -ItemType Directory -Force -Path C:\tmp | Out-Null
          & .\bb\busybox.exe sh -c 'export PATH="./cosmo/bin:$PATH"; export TMPDIR=C:/tmp TMP=C:/tmp TEMP=C:/tmp; cosmocc -o hello_c.com hello.c; echo "exit=$?" > exit_c.txt' 2>&1 | Out-String | Write-Host
          foreach ($f in @("hello_c.com","hello_a.com","hello_b.com")) {
            if (Test-Path $f) { Copy-Item $f hello_bb.com -Force; break }
          }
          Write-Host "any variant built: $(Test-Path hello_bb.com)"
          foreach ($v in @("a","b","c")) { if (Test-Path "exit_$v.txt") { Write-Host "variant $v $((Get-Content "exit_$v.txt").Trim())" } }

      - name: Verdict — self-contained busybox-w64 toolchain on Windows?
        shell: pwsh
        run: |
          $built = Test-Path hello_bb.com
          Write-Host "busybox built hello_bb.com : $built"
          $ran = $false
          if ($built) {
            Copy-Item hello_bb.com hello_bb.exe -Force
            & .\hello_bb.exe; $rc = $LASTEXITCODE; $global:LASTEXITCODE = 0
            $lo = $rc -band 0xFF; $hi = ($rc -shr 8) -band 0xFF
            Write-Host "hello_bb ran, exit=$rc (lo=$lo hi=$hi; expected 42)"
            if ($lo -eq 42 -or $hi -eq 42) { $ran = $true }
          }
          # A CLEAN go needs a variant where cosmocc itself exited 0 (a real hull
          # build checks the exit code). Track whether any variant returned exit=0.
          $clean = $false
          foreach ($v in @("a","b","c")) {
            if (Test-Path "exit_$v.txt") {
              $e = (Get-Content "exit_$v.txt").Trim()
              if ($e -eq "exit=0") { $clean = $true }
            }
          }
          Write-Host "some variant exited cleanly (exit=0): $clean"
          Write-Host "=================================================================="
          if ($built -and $ran -and $clean) {
            Write-Host "CLEAN GO (self-contained): busybox-w64 sh drives cosmocc on"
            Write-Host "Windows, cosmocc exits 0, and the APE runs (42). A single ~1 MB"
            Write-Host "native PE supplies /bin/sh + every coreutil the driver needs,"
            Write-Host "with NO Cygwin/MSYS runtime and NO Git Bash. The self-sufficient"
            Write-Host "Windows story IS achievable: bundle cosmocc + busybox, plant"
            Write-Host "/bin/sh, share TMPDIR, drive cosmocc via busybox sh."
            exit 0
          }
          if ($built -and $ran) {
            Write-Host "QUALIFIED GO (self-contained): busybox-w64 sh COMPILED + LINKED"
            Write-Host "a correct cosmocc APE on Windows (it runs, returns 42) with NO"
            Write-Host "MSYS/Git Bash - the hard parts (POSIX sh + coreutils applets +"
            Write-Host "#!/bin/sh routing + APE-child argv path translation) all work."
            Write-Host "The driver still exits non-zero on its final debug-sidecar"
            Write-Host "rename (mv /tmp/....com.dbg): busybox /tmp vs the APE /tmp. The"
            Write-Host "remaining work is aligning /tmp (or --nodbg). Self-contained"
            Write-Host "cosmocc on Windows via busybox is the viable path; finish the"
            Write-Host "/tmp alignment for a clean exit 0."
            exit 0
          }
          Write-Host "FINDING: busybox-w64 sh did NOT build a runnable cosmocc APE on"
          Write-Host "Windows (see the (a)/(b)/(c) exit codes + stderr for the failing"
          Write-Host "stage: /bin/sh routing, applet resolution, or APE-child argv path"
          Write-Host "translation). MSYS/Git-Bash/WSL (external) or build-on-a-POSIX-host"
          Write-Host "remains the Windows story."
          exit 0

  section0-shell-drives-cosmocc:
    # §0 GO/NO-GO (no Hull change): given a SHELL + preserved symlinks, does
    # cosmocc's #!/bin/sh pipeline actually compile on Windows at all? If NO, the
    # A-E Hull epic is not worth starting. Extract with bsdtar (tar.exe -
    # symlink-preserving, unlike Expand-Archive), reconstruct any symlinks Windows
    # dropped, then drive cosmocc via Git Bash AND cosmo's own cocmd.
    name: "§0 — can a shell drive cosmocc on Windows?"
    runs-on: windows-latest
    steps:
      - name: Download + symlink-preserving extract (bsdtar)
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 -o cosmocc.zip "https://cosmo.zip/pub/cosmocc/cosmocc-$env:COSMOCC_VERSION.zip"
          $actual = (Get-FileHash cosmocc.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:COSMOCC_SHA256) { throw "cosmocc sha mismatch: $actual" }
          New-Item -ItemType Directory -Force -Path cosmo | Out-Null
          # bsdtar (Windows-bundled tar.exe) extracts zip AND creates symlinks
          # where it can. Emit its stderr so any "can't create symlink" shows.
          tar.exe -xpf cosmocc.zip -C cosmo 2>&1 | Write-Host
          $cc = Get-Item cosmo\bin\x86_64-unknown-cosmo-cc
          Write-Host "arch-cc: size=$($cc.Length) LinkType=$($cc.LinkType) Target=$($cc.Target)"

      # (bsdtar preserved real symlinks on the runner - LinkType=SymbolicLink - so
      # no reconstruction is needed; hull's symlink-aware extraction would do the
      # same. Straight to the probes.)
      - name: Write hello.c
        shell: pwsh
        run: '"int main(void){return 42;}" | Set-Content -NoNewline hello.c -Encoding ascii'

      - name: "Probe A — Git Bash (POSIX /bin/sh) drives cosmocc"
        id: probe_bash
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$(pwd)/cosmo/bin:$PATH"
          echo "which cosmocc: $(command -v cosmocc || echo none)"
          cosmocc -o hello_bash.com hello.c
          echo "cosmocc exit: $?"
          ls -la hello_bash.com

      - name: "Probe B — cosmo cocmd drives cosmocc"
        id: probe_cocmd
        continue-on-error: true
        shell: pwsh
        run: |
          Copy-Item cosmo\bin\cocmd cosmo\bin\cocmd.exe -Force
          $env:PATH = "$PWD\cosmo\bin;$env:PATH"
          & cosmo\bin\cocmd.exe -c "cosmocc -o hello_cocmd.com hello.c" 2>&1 | Out-String | Write-Host
          Write-Host "--- cocmd cosmocc exit: $LASTEXITCODE ---"
          if (-not (Test-Path hello_cocmd.com)) { throw "cocmd did not build" }

      - name: Verdict — did a shell build (and run) the APE?
        shell: pwsh
        run: |
          $bashOK = (Test-Path hello_bash.com)
          $cocmdOK = (Test-Path hello_cocmd.com)
          Write-Host "Git Bash built hello.com : $bashOK"
          Write-Host "cocmd built hello.com    : $cocmdOK"
          $ran = $false
          foreach ($f in @("hello_bash.com","hello_cocmd.com")) {
            if (Test-Path $f) {
              Copy-Item $f "$f.exe" -Force
              & ".\$f.exe"; $rc = $LASTEXITCODE
              # The APE returns 42; on Windows the exit may arrive wait-status-
              # encoded (42 << 8 = 10752), so accept either byte.
              $lo = $rc -band 0xFF; $hi = ($rc -shr 8) -band 0xFF
              Write-Host "$f ran, exit=$rc (lo=$lo hi=$hi; expected 42)"
              if ($lo -eq 42 -or $hi -eq 42) { $ran = $true }
            }
          }
          $global:LASTEXITCODE = 0
          Write-Host "=================================================================="
          if (($bashOK -or $cocmdOK) -and $ran) {
            Write-Host "GO: a POSIX shell CAN drive cosmocc's full pipeline on Windows"
            Write-Host "(APE built + ran). Git Bash (/bin/sh) works; cosmo's cocmd does"
            Write-Host "NOT (it is a cmd-like shell, not a POSIX sh for the #!/bin/sh"
            Write-Host "driver). So the A-E Hull epic is VIABLE, but the 'shell' is a"
            Write-Host "POSIX sh (bash/MSYS), not cocmd - hull must provide/require one."
            exit 0
          } elseif ($bashOK -or $cocmdOK) {
            Write-Host "PARTIAL: cosmocc built an APE but it did not run as expected."
            exit 1
          } else {
            Write-Host "NO-GO: no shell could drive cosmocc's pipeline on Windows."
            Write-Host "The A-E Hull epic would not pay off; WSL2 stays the path."
            exit 1
          }
