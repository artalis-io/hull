name: Deploy Hull Site

on:
  push:
    branches: [ "main" ]
    paths:
      # Site changes themselves.
      - 'site/**'
      # The canonical install.sh that site/install.sh symlinks to.
      # Changing it should redeploy so `curl gethull.dev/install.sh`
      # picks up new platform support, knobs, etc.
      - 'install.sh'
      - '.github/workflows/deploy-site.yml'

jobs:
  deploy:
    runs-on: ubuntu-24.04

    # Promote the CF distribution ID to job-level env so step-level `if:`
    # conditions can read it. (`secrets` context is not allowed in `if:`;
    # `env` is — but only env set at workflow/job scope, not at the same
    # step's env: block since step env is applied AFTER if: evaluates.)
    env:
      CF_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Build site
        run: |
          cd site && make build
          echo "Build contents:"
          find build -type f

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          # --delete prunes objects on the bucket that are no longer in
          # the build dir, so removing a file in the repo actually
          # removes it from www.gethull.dev.
          aws s3 sync site/build/ s3://${{ secrets.S3_BUCKET }} \
            --delete

      # Optional: only runs if the CLOUDFRONT_DISTRIBUTION_ID secret is
      # configured (promoted to job-level env above). Lets the workflow
      # ship without a CloudFront distribution; add the secret later to
      # enable invalidation.
      - name: Invalidate CloudFront cache
        if: ${{ env.CF_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths "/*"
