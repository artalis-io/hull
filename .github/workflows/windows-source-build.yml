name: Windows source build + unit tests + app build (cosmocc, -O0)

# Proves Hull can be BUILT FROM SOURCE on Windows with the SHA-pinned cosmocc
# toolchain, under MSYS2 - no WSL and no Visual Studio.
#
# WHAT NEEDS MSYS2, AND WHAT DOES NOT. This job builds HULL ITSELF from source,
# and that is the ONLY thing here that needs MSYS2. Unchanged, and still true:
#
#   * INSTALLING Hull on Windows needs nothing but install.ps1 - see
#     docs/windows_install.md. No MSYS2, no compiler, no toolchain.
#   * BUILDING AN APP with the released `hull.com` needs nothing either:
#     `hull build` is compiler-free by default, and the cosmo path it does use
#     is `hull tools install cosmocc`. No MSYS2.
#
# WHY MSYS2 IS REQUIRED FOR A SOURCE BUILD. Hull's Makefile passes six version
# macros as escaped-quote defines (-DHL_VERSION=\"...\", plus
# HULL_VENDOR_KEEL_COMMIT / _WAMR_COMMIT / _KEEL_VERSION / _WAMR_VERSION and
# HL_QJS_VERSION). A NATIVE Win32 make cannot deliver those to a POSIX shell:
# it does not exec sh with an argv, it builds a WINDOWS COMMAND LINE, and MSYS
# sh then re-parses that with Windows rules - so everything from the first \"
# collapses into one argument. Measured three ways:
#
#   native make, recipe WITH  \"    -> argc=2   (all args become one string)
#   native make, recipe WITHOUT \"  -> argc=7   (fine)
#   the IDENTICAL line via `sh -c`  -> argc=8   (-DHL_VERSION="x" intact)
#
# and confirmed on the runner itself (run 34025202379) for BOTH native makes
# available there - /c/mingw64/bin/make and Chocolatey's - which mangle it
# identically. The recipe and the shell are both fine; the Windows
# command-line hop is what destroys it, so this is a property of the make, not
# something a PATH or shell fix can reach. An MSYS-native make execs sh with a
# real argv and the escaping survives. The probe below tests this directly, so
# if a future runner image regresses it, the job says so in one line instead of
# failing 600 recipes later on a symptom.
#
# (History, so nobody re-litigates it: this job originally used Git Bash plus
# `choco install make`. That fails for the reason above. Two earlier fixes -
# a <drive>\bin junction so a native make could find /bin/sh and the POSIX
# tools, and a wrapper keeping cosmocc's $0 POSIX - were each correct for the
# problem they addressed and are both UNNECESSARY under MSYS2, which provides
# /bin/sh natively and passes a POSIX $0. The probe asserts both properties
# rather than assuming them.)
#
# WHAT THIS FILE COVERS, and what it deliberately does not.
#
#   job windows-source-build
#     1. compiles hull from source with cosmocc under MSYS2
#     2. asserts the produced binary is Windows-AWARE (host_os, exe_suffix,
#        build_compiler_required, a usable HTTPS trust store)
#     3. runs the HOST-SENSITIVE unit suites - see that step for why a subset
#        and not `make test`
#   job windows-app-build
#     4. builds the multi-arch cosmo platform archives, links a hull with them
#        embedded, then `hull new` + `hull build` + checks the produced app.com
#
# Steps 3 and 4 were added after a coverage audit found that NO job in the repo
# ran a single Hull unit test on a Windows runner, and that the only Windows
# `hull build` coverage (cosmocc-windows-e2e.yml) used a hull compiled on
# LINUX. Both gaps are now closed here; see each step for the reasoning.
#
# Still NOT covered here, on purpose: optimized-build correctness (this job is
# -O0, see below), the WASM surface (HL_ENABLE_WASM=0, see below), and the full
# 108-binary unit suite (cost + wedge exposure, see the unit-test step).
#
# WHAT THIS IS NOT: it does not produce a shippable artifact. Every released
# `hull-cosmo` is built on Linux (release.yml `build-cosmo`, runs-on
# ubuntu-24.04), and that stays true. This job exists to catch SOURCE-level
# breakage that only shows up when cosmocc compiles Hull on Windows, which no
# other job covers - `cosmocc-windows-e2e.yml` builds the hull binary on Linux
# and only *consumes* it on Windows.
#
# WHY -O0 (HL_OPT=-O0), and what that costs:
#   cosmocc's GCC HANGS on Windows compiling Hull's largest translation units -
#   measured on vendor/quickjs/quickjs.c and src/hull/serve.c, ~0 CPU
#   indefinitely, not an ICE. At -O0 quickjs.c compiles in ~3s. So -O0 is not a
#   speed compromise here, it is the only level that completes at all.
#   The tradeoff is real and worth stating: this job CANNOT catch bugs that
#   only appear under optimization (strict aliasing, UB that manifests at -O2).
#   It proves "the source compiles and links on Windows", nothing stronger.
#   Optimized-build correctness stays covered by the Linux/macOS jobs in ci.yml.
#
#   HL_OPT REACHES KEEL DIRECTLY (since hull#461 / artalis-io/keel#261).
#   It did not always. mk/vendor/keel.mk used to hand Keel's sub-make CC, AR
#   and the TLS/compress config and nothing else, so Keel compiled at its own
#   hardcoded -O2 while everything else honoured -O0. Run 34035825889 proved
#   the cost: 427 TUs at -O0, 81 at -O2, then 41 minutes of silence with two
#   -O2 miniz TUs in flight until the 45-minute cap. This job worked around it
#   with a cosmocc shim that appended -O0; Keel then gained a KEEL_OPT knob,
#   Hull passes it, and the shim is gone.
#
#   The probe ASSERTS the propagation rather than assuming it, because this is
#   the only job where -O0 is load-bearing: if it ever regresses, the failure
#   should be one line in the probe, not a 45-minute wedge on a -O2 TU.
#
# HL_ENABLE_WASM=0: WAMR under cosmocc-on-Windows is unproven and would make a
# "quick" job slow and flaky. The WASM surface is covered on Linux in ci.yml.
#
# Non-required. If it proves flaky, move it to nightly.yml rather than letting
# it block PRs - a hang-prone job on the PR path is worse than no job. That
# clause has now been exercised: see HANG below.
#
# HANG - OPEN, INTERMITTENT, NOT UNDERSTOOD.
#   MEASURED (#462, probe runs 34112570526 and 34114442514): cosmocc's cc1
#   blocks indefinitely at ~0 CPU on about 12% of compiles of a LARGE
#   translation unit. That is a cosmocc-on-Windows bug, not a Hull one. It
#   needs neither parallelism (-j1 wedges too) nor MSYS2's temp directory
#   (relocating it changed nothing, 4/10 vs 2/10, p=0.63). Established over 250
#   solo compiles of vendor/sqlite/sqlite3.c with nothing else running;
#   vendor/quickjs/quickjs.c wedges identically, and this file's own -O0 note
#   below recorded the same thing about quickjs.c long before it was measured.
#
#   The build step therefore RETRIES a stall (up to 3 attempts), which is a
#   mitigation for someone else's bug rather than cover for one of ours.
#
#   Historical signatures, kept because they show how the picture changed:
#
#     a) miniz at -O2 (run 34035825889) - CAUSED by HL_OPT never reaching the
#        Keel sub-make. Deterministic. Fixed properly in hull#461: Keel now
#        takes KEEL_OPT, so -O0 reaches it by the ordinary route.
#     b) build/stdlib_js_registry.c at -O0 (run 34040823575) - OPEN. Hull's own
#        xxd-generated stdlib array, compiled at -O0, which takes <1s in a
#        healthy run. Nothing to do with Keel or with -O2.
#
#   What the log comparison shows for (b): a successful run emits the last two
#   registry TUs and then the link 0.9s later; the hung run emits the same two
#   and never echoes the link line at all. make echoes a recipe BEFORE running
#   it, so the link never started - one of those two -O0 compiles wedged.
#
#     c) vendor/sqlite/sqlite3.c for AARCH64 at -O0 (run 34045364219) - OPEN,
#        and the first hang the watchdog caught with evidence:
#
#          pid=5648 cc1  cpu=5.09s  dcpu=0s   <- BLOCKED, not spinning
#          cc1 ... vendor/sqlite/sqlite3.c -o <MSYS2 temp>/cchyv2rh.s
#
#   So the compiler accumulates NO CPU while wedged: this is an I/O block (a
#   lock, a pipe, a temp file), not an optimizer blow-up. Three hangs now, three
#   DIFFERENT TUs - miniz, a generated registry array, sqlite3 - all among the
#   largest in the tree, with two large TUs in flight under -j2 each time. It is
#   not a bad TU; it is size- or concurrency-dependent. Strongest lead: cc1 was
#   blocked writing its .s output into MSYS2's temp dir.
#
#   Issue #462 carries the full evidence and the next experiments (relocate
#   TMPDIR, -j1, whether it is always aarch64). Do NOT assume this is (a) - that
#   one was deterministic, -O2-caused, and is fixed; cc1's own arguments in the
#   capture above show -O0 reaching the compiler.
#
# SPDX-License-Identifier: AGPL-3.0-or-later

# TRIGGER: nightly schedule + manual dispatch. NOT pull_request - see below.
#
# This briefly had a path-filtered `pull_request` trigger, once the job had
# passed end to end. That was premature: the very first PR-triggered sequence
# ran it three times and one of the three WEDGED for the full 45-minute cap
# (runs 34040696437 ok 4m02s, 34040725482 ok 3m24s, 34040823575 hung 45m36s).
# See the HANG section in the header for what is known about it.
#
# A job that hangs ~1 run in 4, for 45 minutes, does not belong on the PR path -
# it red-flags a quarter of qualifying PRs for a flake rather than a
# regression, which is exactly the trade this file's own policy warns against.
# So it runs nightly instead.
#
# THE SCHEDULE IS DAMAGE LIMITATION, NOT A FIX. The hang is the actual problem
# and is tracked in issue #462; nightly just stops it costing other people's
# time while it is diagnosed.
# path-filtered pull_request trigger below is the intended end state:
#
#   pull_request:
#     paths:
#       - 'Makefile'
#       - 'mk/**'
#       - 'src/hull/serve.c'
#       - 'src/hull/serve_cli.c'
#       - 'src/hull/wasm_weakstub.c'
#       - 'src/hull/http_weakstub.c'
#       - 'src/hull/image_weakstub.c'
#       - 'src/hull/shared/host.c'
#       - 'src/hull/shared/cli_log.c'
#       - '.github/workflows/windows-source-build.yml'
#
# GitHub runs `schedule:` only on the default branch. 06:20 UTC keeps it clear
# of nightly.yml's 07:00 slot so the two do not contend for Windows runners.
# workflow_dispatch stays - every diagnosis in this file's history was made by
# dispatching against a branch, and that is how the hang will be chased too.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same pin as cosmocc-bbox-probe.yml / cosmocc-windows-e2e.yml. Keep in step.
  COSMOCC_VERSION: 4.0.2
  COSMOCC_SHA256: 85b8c37a406d862e656ad4ec14be9f6ce474c1b436b9615e91a55208aced3f44

jobs:
  windows-source-build:
    name: build hull.com from source on Windows (cosmocc, HL_ENABLE_WASM=0)
    runs-on: windows-latest
    # Backstop only. The build step's watchdog now catches a stall after 5
    # minutes of silence (a healthy build finishes in ~3-4 min and never goes
    # quiet for more than a fraction of a second), so this cap should not be
    # what stops a hang any more - it is here in case the watchdog itself
    # fails. Lowered from 45: two hangs each burned the full 45 and produced
    # no evidence, which is precisely what the watchdog replaces.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: recursive   # vendor/keel is required to link

      # An MSYS-native make - the reason this job uses MSYS2 at all (see the
      # header). The rest close gaps the MSYS base does NOT cover, each one
      # confirmed by the probe's inventory in run 34035653293:
      #   binutils  - ar/nm. Makefile:20's `AR ?= ar` needs a real ar.
      #   vim       - xxd, which the Makefile shells out to ~54 times to embed
      #               the stdlib and the CA bundle.
      #   diffutils - cmp. Only `reproducible-check` uses it (Makefile:3104),
      #               so it is not needed to build, but it is a one-word
      #               install and its absence would confuse a later reader.
      #   git       - the version stamp. Makefile:66-74 falls back VERSION
      #               file -> `git describe` -> the literal "dev", so a
      #               git-less build succeeds but stamps HL_VERSION=dev. A
      #               source-build job should stamp the real revision.
      # coreutils, findutils, grep, sed and gawk are all in the MSYS base.
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2.32.0
        with:
          msystem: MSYS
          update: false
          install: >-
            make
            binutils
            vim
            diffutils
            git

      # cosmocc ships as a zip of APEs; SHA-pinned, same acquisition as the
      # sibling cosmocc workflows.
      - name: Fetch + verify cosmocc
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 -o cosmocc.zip "https://cosmo.zip/pub/cosmocc/cosmocc-$env:COSMOCC_VERSION.zip"
          $h = (Get-FileHash cosmocc.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:COSMOCC_SHA256) { throw "cosmocc sha mismatch: got $h" }
          New-Item -ItemType Directory -Force -Path cosmo | Out-Null
          tar.exe -xpf cosmocc.zip -C cosmo
          Write-Host "cosmocc extracted"

      - name: Toolchain probe (fail early + leave evidence in the log)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # cosmo/bin APPENDED, never prepended: it ships its OWN `make` (an
          # APE) which would shadow MSYS2's. That APE make also loses its exit
          # status under a Windows shell - it printed "Error 127" and still
          # returned 0 in run 34024210147 - so it must not be reachable as
          # `make` here. cosmocc is unique to that directory, so appending
          # costs nothing.
          export PATH="$PATH:$PWD/cosmo/bin"

          echo "make candidates:"; { type -a make 2>/dev/null || echo "(none)"; } | sed 's/^/  /'
          MAKE_BIN=$(command -v make || true)
          [ -n "$MAKE_BIN" ] || { echo "FAIL no make on PATH"; exit 1; }
          case "$MAKE_BIN" in
            */cosmo/bin/*|*cosmocc*)
              echo "FAIL make resolved to cosmocc's bundled APE make ($MAKE_BIN)."
              exit 1 ;;
          esac
          echo "make    : $MAKE_BIN"; "$MAKE_BIN" --version | head -1
          echo "sh      : $(command -v sh || echo MISSING)"
          echo "cosmocc : $(command -v cosmocc || echo MISSING)"; cosmocc --version | head -1
          echo "MAKE_BIN=$MAKE_BIN" >> "$GITHUB_ENV"

          # KEEL GETS THE OPT LEVEL DIRECTLY NOW.
          #
          # This step used to shadow cosmocc with a wrapper that appended -O0,
          # because HL_OPT reached Hull's own TUs but not Keel: mk/vendor/keel.mk
          # handed the sub-make CC, AR and the TLS/compress config and nothing
          # else, so Keel built at its own hardcoded -O2. Run 34035825889 died
          # exactly there, wedging on two -O2 miniz TUs until the 45-minute cap.
          #
          # Keel now exposes KEEL_OPT (artalis-io/keel#261) and Hull passes it
          # (hull#461), so the shim is gone and -O0 reaches Keel by the ordinary
          # route. Assert that rather than assume it: this job is the only place
          # the -O0 requirement is load-bearing, so if propagation ever breaks
          # again it should say so here, in one line, instead of wedging for 45
          # minutes on a -O2 TU.
          echo "--- Keel receives the opt level directly ---"
          keel_opt=$("$MAKE_BIN" -n HL_OPT=-O0 vendor/keel/libkeel.a 2>/dev/null \
                     | grep -- ' -c -o src/' | grep -oE ' -O[0-9]' | sort -u | tr -d ' ' | tr '\n' ' ')
          keel_vendor_opt=$("$MAKE_BIN" -n HL_OPT=-O0 vendor/keel/libkeel.a 2>/dev/null \
                     | grep -- ' -c -o vendor/' | grep -oE ' -O[0-9]' | sort -u | tr -d ' ' | tr '\n' ' ')
          echo "  keel core TUs   : ${keel_opt:-<none>}"
          echo "  keel vendored   : ${keel_vendor_opt:-<none>}"
          if [ "$(echo $keel_opt)" = "-O0" ] && [ "$(echo $keel_vendor_opt)" = "-O0" ]; then
            echo "  ok: HL_OPT=-O0 reaches Keel, no shim needed"
          else
            echo "FAIL HL_OPT=-O0 does not reach Keel (core='$keel_opt' vendored='$keel_vendor_opt')."
            echo "     That is the hull#461 regression; the build would wedge on a -O2 TU."
            exit 1
          fi

          # REGRESSION GUARD for the reason this job uses MSYS2. A native Win32
          # make mangles escaped-quote defines into a single argument (see the
          # header); Hull's Makefile has six of them, so a make that fails this
          # cannot build Hull at all. Assert the property rather than assume the
          # runner image keeps providing an MSYS-native make.
          qdir=$(mktemp -d)
          { echo '#!/bin/sh'
            echo 'echo "argc=$#"'
            echo 'i=0; for a in "$@"; do i=$((i+1)); echo "[$i]$a"; done'
          } > "$qdir/argecho"
          chmod +x "$qdir/argecho"
          { echo 'all:'
            printf '\targecho -std=c11 -DHL_VERSION=\\"abc123\\" -DHL_ENABLE_DB -Iinclude\n'
          } > "$qdir/Makefile"
          qout=$( cd "$qdir" && PATH="$qdir:$PATH" "$MAKE_BIN" 2>&1 || true )
          if printf '%s' "$qout" | grep -qF '[2]-DHL_VERSION="abc123"' \
             && printf '%s' "$qout" | grep -qF '[3]-DHL_ENABLE_DB'; then
            echo "escaped quotes survive make -> argv: OK"
          else
            echo "FAIL this make mangles escaped-quote defines:"
            printf '%s' "$qout" | sed 's/^/  /' | head -6
            echo "     Hull's Makefile needs -DHL_VERSION=<escaped> intact."
            echo "     This is what a NATIVE Win32 make gets wrong; an"
            echo "     MSYS-native make (msys2/setup-msys2) is required."
            exit 1
          fi

          # cosmocc's driver is a #!/bin/sh script - prove it can actually run
          # and produce a working APE before committing to a 600-recipe build.
          printf '#include <stdio.h>\nint main(void){puts("APE-OK");return 0;}\n' > /tmp/h.c
          cosmocc -O0 -o /tmp/h.com /tmp/h.c
          test "$(/tmp/h.com)" = "APE-OK"
          echo "cosmocc produces a runnable APE on this host: OK"

          # Every tool the build system shells out to (Makefile + mk/: sed x74,
          # xxd x54, install x35, ar x22, find, sort, cut, nm, ...). Probing
          # them as a set means ONE dispatch names every gap, instead of the
          # build dying on them one rerun at a time.
          echo "--- tool inventory ---"
          missing=""
          for t in sh uname mkdir find sed xxd install sort cut grep awk tr \
                   basename printf ar; do
            if p=$(command -v "$t" 2>/dev/null); then
              printf '  ok      %-10s %s\n' "$t" "$p"
            else
              printf '  MISSING %-10s\n' "$t"; missing="$missing $t"
            fi
          done
          # cmp is reached only by `reproducible-check` (Makefile:3104), and nm
          # only by targets this job does not build - every nm call site is
          # `nm ... 2>/dev/null` inside a conditional, so an absent nm degrades
          # to a vacuously-passing check. An absent git is graceful too: the
          # version stamp falls back to "dev" (Makefile:66-74). All are
          # installed above; they are listed optional so a future image change
          # reports rather than fails the build over something it never needs.
          for t in cmp sha256sum shasum git nm; do
            if p=$(command -v "$t" 2>/dev/null); then
              printf '  ok      %-10s %s (optional)\n' "$t" "$p"
            else
              printf '  absent  %-10s (optional)\n' "$t"
            fi
          done
          if [ -n "$missing" ]; then
            echo "FAIL required build tools missing:$missing"
            echo "     Add the providing package to setup-msys2's install list."
            exit 1
          fi

          # `ar` comes from the binutils package installed above. The cosmocc
          # cross ars are a fallback if a future image drops it; `cosmoar` stays
          # LAST - CLAUDE.md records it breaking on Keel's recursive .aarch64/
          # lookups.
          ar_name=""
          for cand in ar x86_64-unknown-cosmo-ar aarch64-unknown-cosmo-ar cosmoar; do
            if p=$(command -v "$cand" 2>/dev/null); then
              ar_name=$cand; echo "  ar resolved: $cand -> $p"; break
            fi
          done
          [ -n "$ar_name" ] || { echo "FAIL no ar found"; exit 1; }
          echo "AR=$ar_name" >> "$GITHUB_ENV"

          # The decisive check: drive make over the paths the build depends on -
          # a $(shell) at parse time, a recipe with a shell metacharacter, and a
          # metacharacter-free line invoking cosmocc. That last one is why the
          # Git-Bash attempt needed a wrapper: a native make handed cosmocc a
          # BACKSLASH $0, so its POSIX ${0%/*} looked for
          # ...\cosmo\bin\cosmocc/mktemper (run 34024658252). Under MSYS2 $0
          # should stay POSIX with no wrapper - this asserts that it does.
          probe=$(mktemp -d)
          printf 'PARSE := $(shell uname -s)\n' >  "$probe/Makefile"
          printf 'all:\n'                       >> "$probe/Makefile"
          printf '\t@test -n "$(PARSE)" || { echo "FAIL parse-time uname empty"; exit 1; }\n' >> "$probe/Makefile"
          printf '\t@echo "parse-time uname: $(PARSE)"\n' >> "$probe/Makefile"
          printf '\techo via-shell | sed s/via-shell/shell-path-OK/\n' >> "$probe/Makefile"
          printf '\tmkdir -p sub/dir\n'         >> "$probe/Makefile"
          printf '\tfind sub -type d\n'         >> "$probe/Makefile"
          printf '\tcosmocc -O0 -o probe.com /tmp/h.c\n' >> "$probe/Makefile"
          printf '\t./probe.com\n'              >> "$probe/Makefile"

          # Assert on OUTPUT MARKERS, not just on $?. A make whose exit status
          # is lost (the cosmo APE did exactly that) must not be able to report
          # success, so require positive evidence that both paths actually ran.
          set +e
          out=$( cd "$probe" && "$MAKE_BIN" 2>&1 ); rc=$?
          set -e
          echo "$out"
          fail=0
          [ "$rc" -eq 0 ] || { echo "FAIL make exited $rc"; fail=1; }
          printf '%s' "$out" | grep -q 'shell-path-OK' || { echo "FAIL no shell-path-OK: the /bin/sh route did not run"; fail=1; }
          printf '%s' "$out" | grep -q 'APE-OK'        || { echo "FAIL no APE-OK: make could not drive cosmocc"; fail=1; }
          [ -f "$probe/probe.com" ]                    || { echo "FAIL probe.com was not produced"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "make drives /bin/sh + direct-exec tools + cosmocc, no wrappers: OK"

      - name: Build hull from source
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # cosmo/bin APPENDED so its bundled APE make cannot shadow MSYS2's.
          # No cosmocc shim any more: Keel receives HL_OPT directly now
          # (hull#461 / artalis-io/keel#261), and the probe asserts it.
          # MAKE_BIN and AR both arrive from the probe via $GITHUB_ENV.
          export PATH="$PATH:$PWD/cosmo/bin"
          # HL_OPT is the Makefile knob that routes the optimization level
          # through Hull's OWN TUs *and* every vendored one (quickjs/lua/sqlite
          # hardcoded -O2 before it existed). See the HL_OPT block in Makefile.
          echo "using MAKE_BIN=${MAKE_BIN:-<unset>} AR=${AR:-<unset>}"

          # WATCHDOG + RETRY -> .github/scripts/make-watched.sh
          #
          # The wedge is a TOOLCHAIN bug, not a Hull one, and it is now measured
          # (#462): cosmocc's cc1 blocks indefinitely at ~0 CPU compiling large
          # translation units on Windows, about 12% of the time PER large-TU
          # compile. Established by 250 solo compiles of vendor/sqlite/sqlite3.c
          # with nothing else running - so it needs neither concurrency (-j1
          # still wedges) nor MSYS2's temp directory (relocating it changed
          # nothing). vendor/quickjs/quickjs.c wedges the same way.
          #
          # Retrying is therefore the honest mitigation rather than papering
          # over our own defect: make resumes from the objects already built, so
          # a retry costs a fraction of a build, and at ~30% per build three
          # attempts leave roughly 3% residual failure.
          #
          # "Resumes from the objects already built" is only true because the
          # Makefile now repairs the tree first. Killing a wedged cc1 lands
          # mid-cosmocc, which compiles each TU twice: `foo.o` can exist while
          # `.aarch64/foo.o` does not, and only the first is a make target, so
          # every later make skipped the pair as up to date and the retry died
          # at the fat link naming the archive rather than the cause - stuck
          # until `make clean`. A parse-time repair (scripts/cosmo_fat_repair.sh)
          # now deletes a half-written pair so the ordinary rules rebuild both
          # halves, which is what makes retrying work at all here.
          #
          # A retry is applied ONLY to a stall. A genuine compile error fails
          # immediately - retrying that would just hide it.
          #
          # The logic lives in a script because the unit-test step below is a
          # second caller and the multi-arch platform build in the app-build
          # job is a third. The retry rule is subtle enough that a drifted
          # copy would be worse than no copy.
          bash .github/scripts/make-watched.sh "hull" build-output.log CC=cosmocc AR="$AR" HL_OPT=-O0 HL_ENABLE_WASM=0 -j2

          # Never trust the exit status alone here - assert the artifact.
          test -f build/hull || { echo "FAIL build/hull was not produced"; exit 1; }
          ls -la build/hull

      - name: Upload build output on failure (the stall evidence)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hull-windows-build-log
          path: build-output.log
          if-no-files-found: warn
          retention-days: 14

      # Compiling is necessary but not sufficient - a binary that cannot run is
      # not a successful build. Assert it executes and reports Windows-correct
      # facts (these come from src/hull/shared/host.c).
      - name: Verify the produced binary runs and is Windows-aware
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./build/hull version
          json=$(./build/hull doctor --json || true)
          echo "$json"
          for kv in '"host_os":"windows"' '"exe_suffix":".com"' '"build_compiler_required":"cosmocc"'; do
            case "$json" in
              *"$kv"*) echo "  ok  $kv" ;;
              *)       echo "  FAIL expected $kv"; exit 1 ;;
            esac
          done
          # An absent system CA store must NOT read as broken on Windows: the
          # embedded Mozilla bundle is the designed fallback.
          case "$json" in
            *'"ok":true'*) echo "  ok  HTTPS trust store reported usable" ;;
            *) echo "  FAIL doctor reports no usable HTTPS trust store"; exit 1 ;;
          esac

      # UNIT TESTS ON WINDOWS.
      #
      # Until this step existed, NO job in the repo ran a single Hull unit test
      # on a Windows runner - the suite ran on Linux and macOS only, so every
      # host-specific path was covered by nothing. The three most recent Windows
      # fixes (#471 spawn allowlist, #472 toolchain resolution, and the
      # tool-name basename fix) were all in code this step exercises, and all
      # three were found by hand rather than by CI.
      #
      # WHY A SUBSET AND NOT `make test`. The full suite is 108 binaries, each a
      # fat APE link - far past this job's budget, and it multiplies exposure to
      # the #462 wedge, which fires per large-TU compile. The suites below are
      # the ones whose behaviour is HOST-DEPENDENT plus the cheap
      # always-relevant ones; their portable logic is already covered on Linux
      # and macOS in ci.yml.
      #
      # WHY THE OUTPUT IS PARSED AND NOT JUST THE EXIT CODE.
      #
      # On Windows a cosmocc APE does not report its exit code: it reports the
      # code SHIFTED LEFT BY 8, i.e. a raw wait status. Isolated with a two-line
      # program on 2026-09-09, so this is the toolchain and not anything Hull
      # does:
      #
      #   int main(void){ return 1; }  -> PowerShell 256,  MSYS2 bash 0
      #   int main(void){ return 4; }  -> PowerShell 1024, MSYS2 bash 0
      #
      # PowerShell shows the shifted value; a POSIX shell keeps the low byte,
      # which for any code < 256 is 0. So under the msys2 shell this step runs
      # in, EVERY failing binary looks like a success. Only a signal death
      # surfaces (SIGILL shows as 4).
      #
      # That is not theoretical here: build/test_release prints
      # "[  PASSED  ] 19 tests." then "[  FAILED  ] 1 tests" and still exits 0.
      # An exit-code-only gate would score every failure below as a pass.
      #
      # So gate on utest's printed summary - the same "assert the artifact, not
      # the status" rule the build step above already follows. The exit code is
      # still checked, but only as a secondary signal.
      #
      # TWO TIERS, because Windows is not green yet and pretending otherwise
      # would paint the nightly red forever:
      #
      #   ENFORCED - measured clean on Windows 11 + MSYS2 + cosmocc
      #              (2026-09-09). Any failure fails the job.
      #   KNOWN    - suites with REAL pre-existing Windows failures, recorded
      #              with the count measured that day. They do not fail the job
      #              at baseline, but the count is RATCHETED: more than baseline
      #              fails. Fewer means somebody fixed something - the step says
      #              so and asks for the baseline to be lowered, so this tier
      #              cannot rot into a list nobody reads.
      #
      # Measured with TMP/TEMP set (see the guard below - without them, suites
      # that mkdtemp under /tmp fail in bulk and the picture looks far worse
      # than it is). ENFORCED is clean on BOTH a Windows 11 desktop and the
      # Actions runner, which is what makes it safe to enforce.
      #
      # The KNOWN baselines are the RUNNER's numbers, because this step only
      # ever runs in CI. They are NOT the same as a developer box's, and the
      # difference is instructive rather than noise:
      #
      #                     runner (windows-latest)   dev box (Win 11 + ucrt64)
      #   test_compiler     14 ran, 5 failed          15 ran, 4 failed
      #   test_fs           37 ran, 3 failed          37 ran, 4 failed
      #
      # test_compiler's failures are ENTIRELY system-compiler cases, and the
      # two hosts do not even run the same number of them: the runner has no
      # native cc/gcc/clang at all (doctor reports all three null - only
      # cosmocc is present), while a dev box usually has ucrt64 gcc. So the
      # failing SET differs too, not just the count - only
      # system_is_available_cc is common to both. This is the same environment
      # sensitivity #472 recorded when it saw 10/15. Expect this count to move
      # if the runner image gains a compiler; the ratchet will say so.
      #
      # test_fs is Windows symlink semantics plus the mmap_window_* cases -
      # real platform gaps, not anything this workflow introduced.
      #
      # Same flags as the build above. They must match EXACTLY: the Makefile's
      # config fingerprint purge deletes build/test_* on a flag flip, so a
      # differing HL_ENABLE_WASM here would discard the binaries just built.
      - name: Run the host-sensitive unit suites
        shell: msys2 {0}
        run: |
          set -uo pipefail
          export PATH="$PATH:$PWD/cosmo/bin"

          ENFORCED="test_host test_tool test_vfs test_static test_cacert
                    test_dispatch test_csp test_parse_size test_signature
                    test_release"
          # suite:baseline-failure-count   ("crash" = printed no summary)
          KNOWN="test_compiler:5 test_fs:3"

          targets=""
          for s in $ENFORCED; do targets="$targets build/$s"; done
          for kv in $KNOWN; do targets="$targets build/${kv%%:*}"; done

          bash .github/scripts/make-watched.sh "tests" test-build.log CC=cosmocc AR="$AR" HL_OPT=-O0 HL_ENABLE_WASM=0 -j2 $targets

          # Several suites mkdtemp under /tmp, which for an APE resolves via
          # TMP/TEMP rather than a real /tmp. The msys2 shell action sets both.
          if [ -z "${TMP:-}" ] && [ -z "${TEMP:-}" ]; then
            echo "FAIL neither TMP nor TEMP is set; APE mkdtemp under /tmp will fail"
            exit 1
          fi
          echo "TMP=${TMP:-<unset>} TEMP=${TEMP:-<unset>}"

          fails_of() {
            printf '%s' "$1" | grep -qE '^\[==========\] [0-9]+ test cases ran\.' || { echo crash; return; }
            n=$(printf '%s' "$1" | sed -n 's/^\[  FAILED  \] \([0-9][0-9]*\) tests.*/\1/p' | head -1)
            echo "${n:-0}"
          }

          rc_step=0

          echo "===================== ENFORCED ====================="
          for s in $ENFORCED; do
            test -x "build/$s" || { echo "FAIL $s was not built"; exit 1; }
            out=$(HULL_QUIET_AOT=1 "./build/$s" 2>&1)
            n=$(fails_of "$out")
            if [ "$n" = "0" ]; then
              echo "ok        $s"
            else
              echo "FAIL      $s: $n failure(s) - this suite must be clean"
              echo "$out" | tail -25
              rc_step=1
            fi
          done

          echo "====================== KNOWN ======================="
          for kv in $KNOWN; do
            s=${kv%%:*}; base=${kv##*:}
            test -x "build/$s" || { echo "FAIL $s was not built"; exit 1; }
            out=$(HULL_QUIET_AOT=1 "./build/$s" 2>&1)
            n=$(fails_of "$out")
            if [ "$n" = "$base" ]; then
              echo "known     $s: $n (baseline $base)"
            elif [ "$n" = "crash" ] || [ "$base" = "crash" ]; then
              echo "CHANGED   $s: now '$n', baseline '$base'"
              echo "$out" | tail -20
              rc_step=1
            elif [ "$n" -gt "$base" ]; then
              echo "REGRESSED $s: $n failures, baseline $base"
              echo "$out" | tail -25
              rc_step=1
            else
              echo "IMPROVED  $s: $n failures, baseline $base"
              echo "          -> lower this suite's baseline in KNOWN above."
              rc_step=1
            fi
            # A bare count is not actionable. The first CI run proved it:
            # test_fs reported "3, baseline 4" with no way to see which three.
            if [ "$n" != "$base" ]; then
              echo "          cases failing now:"
              echo "$out" | grep '\[  FAILED  \] [a-z_]*\.' | sed 's/ ([0-9]*ns)//' \
                          | sed 's/^/            /' | sort -u
            fi
          done

          echo ""
          if [ "$rc_step" -ne 0 ]; then
            echo "Windows unit suites: FAILED (see above)."
            echo "If the runner simply differs from the box these baselines came"
            echo "from, update the KNOWN counts in this step and say so."
          else
            echo "Windows unit suites: enforced clean, known failures at baseline."
          fi
          exit "$rc_step"

      - name: Upload the unit-test build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hull-windows-test-build-log
          path: test-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the produced APE (diagnostic only, never released)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: hull-windows-source-build
          path: build/hull
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # APP BUILD: does a hull COMPILED ON WINDOWS actually build and run an app?
  #
  # WHAT THIS ADDS OVER cosmocc-windows-e2e.yml. That workflow already proves
  # `hull build` works on Windows - but with a hull binary compiled on LINUX
  # (its build job is runs-on: ubuntu-24.04, EMBED_PLATFORM=cosmo) and only
  # CONSUMED on the Windows runner. So the two cover different halves:
  #
  #   cosmocc-windows-e2e : Linux-built hull   -> hull build on Windows  (was covered)
  #   this job            : Windows-built hull -> hull build on Windows  (was NOT)
  #
  # The gap matters because the Windows-specific defects Hull has actually hit
  # (#471 spawn allowlist, #472 driver resolution) live in the path a hull takes
  # when it drives a compiler - so a hull produced BY the Windows toolchain
  # driving that same toolchain is its own case, not a corollary of either.
  #
  # WHY A SEPARATE JOB rather than more steps on the build job. This needs
  # `make platform-cosmo` (two full clean builds, one per arch) plus an
  # EMBED_PLATFORM link - three builds where the sibling job does one. At the
  # #462 wedge rate that is roughly triple the exposure, and folding it in
  # would mean a wedge here turns the fast build+test signal red even though
  # both had already passed. Separate job, separate timeout, independent
  # verdict.
  #
  # NOT REQUIRED, same as its sibling: nightly only.
  # ---------------------------------------------------------------------------
  windows-app-build:
    name: hull built on Windows builds + runs an app (cosmocc, HL_ENABLE_WASM=0)
    runs-on: windows-latest
    # Three builds, not one, plus up to 3 stall retries each. The watchdog is
    # what should stop a hang; this is the backstop behind it.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2.32.0
        with:
          msystem: MSYS
          update: false
          install: >-
            make
            binutils
            vim
            diffutils
            git

      - name: Fetch + verify cosmocc
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 -o cosmocc.zip "https://cosmo.zip/pub/cosmocc/cosmocc-$env:COSMOCC_VERSION.zip"
          $h = (Get-FileHash cosmocc.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:COSMOCC_SHA256) { throw "cosmocc sha mismatch: got $h" }
          New-Item -ItemType Directory -Force -Path cosmo | Out-Null
          tar.exe -xpf cosmocc.zip -C cosmo
          Write-Host "cosmocc extracted"

      # The sibling job's full probe explains WHY an MSYS-native make is
      # required and asserts it. That reasoning is not repeated here; this only
      # resolves the two tools and refuses cosmocc's bundled APE make, which is
      # the one substitution that silently produces a broken build.
      - name: Resolve make + ar
        shell: msys2 {0}
        run: |
          set -euo pipefail
          MAKE_BIN=$(command -v make || true)
          [ -n "$MAKE_BIN" ] || { echo "FAIL no make on PATH"; exit 1; }
          case "$MAKE_BIN" in
            */cosmo/bin/*) echo "FAIL make resolved to cosmocc's bundled APE make"; exit 1 ;;
          esac
          ar_name=""
          for cand in ar x86_64-unknown-cosmo-ar aarch64-unknown-cosmo-ar cosmoar; do
            command -v "$cand" >/dev/null 2>&1 && { ar_name=$cand; break; }
          done
          [ -n "$ar_name" ] || { echo "FAIL no ar found"; exit 1; }
          echo "make: $MAKE_BIN ($("$MAKE_BIN" --version | head -1))"
          echo "ar  : $ar_name"
          echo "MAKE_BIN=$MAKE_BIN" >> "$GITHUB_ENV"
          echo "AR=$ar_name" >> "$GITHUB_ENV"

      # `hull build` on cosmo needs BOTH arch archives side by side -
      # libhull_platform.{x86_64,aarch64}-cosmo.a - because cosmocc links a fat
      # APE from an x86_64 image plus its .aarch64/ counterpart. build.lua
      # searches the build dir for exactly that pair, so a single-arch
      # `make platform` would not do: it is deliberately single-arch even under
      # cosmocc. platform-cosmo runs `make clean` between the two arches, which
      # is why the hull link below comes after it and not before.
      - name: Build the multi-arch cosmo platform archives
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="$PATH:$PWD/cosmo/bin"
          bash .github/scripts/make-watched.sh "platform-cosmo" platform-cosmo.log platform-cosmo CC=cosmocc AR="$AR" HL_OPT=-O0 HL_ENABLE_WASM=0 -j2
          ls -la build/libhull_platform.x86_64-cosmo.a build/libhull_platform.aarch64-cosmo.a

      # TRANSIENT GUARD - observed once, NOT reproduced. Do not "simplify" it,
      # and do not upgrade the wording to a known defect without new evidence.
      #
      # Seen once on Windows 11 + MSYS2 + cosmocc 4.0.2 (2026-09-09): the first
      # `EMBED_PLATFORM=cosmo` build after `platform-cosmo` died at the link
      # with
      #
      #   cosmocc: fatal error: build/cap_audit.o: no such file
      #
      # having compiled 425 objects. Re-running the IDENTICAL command
      # succeeded. Captured, so the failure itself is not in doubt.
      #
      # It did NOT reproduce in two controlled attempts:
      #
      #   1. Synthetic precondition - build/ holding only the two arch archives
      #      plus a planted default-fingerprint .build-config, then the same
      #      embed command. The fingerprint purge fired exactly once, every
      #      object built, link succeeded.
      #   2. The full original sequence - `make platform-cosmo` then the same
      #      embed command, nothing else. Both returned 0 and produced hull.
      #
      # Two guesses that looked obvious and are WRONG, recorded so the next
      # person does not re-derive them:
      #
      #   * "platform-cosmo leaves a stale default fingerprint behind." It
      #     leaves NO .build-config at all - its trailing `$(MAKE) clean`
      #     rm -rf's the build dir and only the archives are copied back. The
      #     next build sees an absent file, purges (a no-op on an empty tree)
      #     and writes its own.
      #   * "cap_audit.o / cap_blob.o / cap_body.o are never compiled - the log
      #     starts at cap_crypto.o." Their recipe lines are missing from the
      #     log in SUCCESSFUL runs too, while the objects are present on disk
      #     with .aarch64 counterparts and mtimes one second AHEAD of
      #     cap_crypto.o. That absence is a logging artifact, not a signal.
      #
      # So the cause is unknown and may well be transient (a killed compile
      # from the #462 wedge, or a Windows file-lock) rather than a Makefile
      # defect. The retry below is a SAFETY NET for a nightly job, not a fix:
      # it fires only on this exact signature, so a genuine compile error still
      # fails on the first pass. If it ever fires in CI, the log is the new
      # evidence this needs - capture it rather than just re-running.
      - name: Build hull with the platform embedded
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="$PATH:$PWD/cosmo/bin"

          embed_build() {
            bash .github/scripts/make-watched.sh "$1" hull-embed.log               CC=cosmocc AR="$AR" HL_OPT=-O0 HL_ENABLE_WASM=0 EMBED_PLATFORM=cosmo -j2
          }

          if ! embed_build "hull-embed"; then
            if grep -q "no such file" hull-embed.log; then
              echo ""
              echo "=================================================================="
              echo "TRANSIENT: an object on the link line was missing. Cause is"
              echo "UNKNOWN and did not reproduce in two controlled attempts - see"
              echo "the comment above this step. Re-running once; PLEASE CAPTURE"
              echo "this log, it is the evidence the investigation needs."
              echo "=================================================================="
              grep -n "no such file" hull-embed.log | head -3
              embed_build "hull-embed-2nd-pass"
            else
              echo "FAIL embed build failed for a reason other than the known defect"
              exit 1
            fi
          fi

          test -f build/hull || { echo "FAIL build/hull was not produced"; exit 1; }
          ls -la build/hull
          ./build/hull version
          # Assert the embed actually took. A hull that silently lost its
          # platform archives would fail later at `hull build` with a confusing
          # "not found", and doctor is the surface that knows. Expect
          # multi-arch, since this embedded BOTH cosmo archives.
          ./build/hull doctor --json > doctor.json || true
          grep -o '"platform_library"[^,]*' doctor.json || cat doctor.json

      # THE PAYOFF: a hull COMPILED on Windows builds an app, and that app RUNS.
      #
      # Shape of this check, all three parts learned by running it (2026-09-09):
      #
      #   * `--no-verify-platform` is REQUIRED. A locally built hull carries no
      #     embedded platform manifest, and without the flag `hull build` stops
      #     with "this hull has no embedded platform manifest". The sibling
      #     cosmocc-windows-e2e.yml passes it for the same reason.
      #   * The app is an `app.main` CLI printing a marker, NOT `hull new`'s web
      #     scaffold. A server does not exit, so it cannot be asserted on in a
      #     step; a marker on stdout can.
      #   * The verdict is the MARKER, never the exit status. A cosmocc APE on
      #     Windows reports its exit code shifted left by 8 (a raw wait status),
      #     so a POSIX shell sees 0 for every failure - isolated with a two-line
      #     C program, see the unit-test step for the measurements. This is a
      #     TOOLCHAIN limitation, not a Hull defect, and it is not something
      #     Hull can work around: `hull build` on an app whose manifest fails to
      #     extract correctly calls exit(1), prints "the build cannot continue"
      #     and writes no artifact - and the shell still sees 0. Any script
      #     doing `hull build && ...` on Windows proceeds after a failed build.
      #     Assert the artifact and its output instead.
      - name: hull new + hull build + run the produced APE
        shell: msys2 {0}
        run: |
          set -uo pipefail
          export PATH="$PATH:$PWD/cosmo/bin"

          work=$(mktemp -d)/demo
          mkdir -p "$work"
          cat > "$work/app.lua" <<'LUA'
          app.manifest({ modules = {} })
          app.main(function(ctx) ctx.stdout:write("APP-MARKER-OK\n"); return 0 end)
          LUA
          sed -i 's/^          //' "$work/app.lua"
          echo "--- app.lua ---"; cat "$work/app.lua"

          # DIAGNOSTICS. The first CI run of this step failed here while the
          # identical build succeeds on a Windows 11 desktop, so print what
          # hull actually sees before asking it to build. Cheap, and the run
          # that fails is the only place the answer exists.
          echo "--- toolchain as this shell sees it ---"
          echo "cosmocc: $(command -v cosmocc || echo '(not on PATH)')"
          for d in x86_64-unknown-cosmo-cc aarch64-unknown-cosmo-cc; do
            p=$(command -v "$d" 2>/dev/null || true)
            # A tar that cannot create symlinks leaves these as ~10-byte text
            # files holding the link target, which still lets `cosmocc` work
            # but breaks the per-arch drivers. Observed locally, so check.
            echo "$d: ${p:-(absent)} $( [ -n "$p" ] && echo "size=$(stat -c%s "$p" 2>/dev/null)" )"
          done
          echo "--- what hull reports about itself ---"
          ./build/hull doctor --json | tr ',' '\n' \
            | grep -E '"(platform|platform_embedded|build_compiler|hull_build)"' || true

          ./build/hull build "$work" --no-verify-platform --verbose 2>&1 | tee hull-app-build.log
          echo "--- hull build exit (informational only, see comment): ${PIPESTATUS[0]} ---"

          # On Windows the artifact is app.com: Windows will not execute an
          # extensionless file, which is what hl_host_exe_suffix() encodes.
          app="$work/app.com"
          if [ ! -f "$app" ]; then
            echo "FAIL expected $app to exist"
            ls -la "$work"
            exit 1
          fi
          ls -la "$app"

          out=$("$app" 2>&1) || true
          echo "--- app output ---"
          echo "$out"
          if printf '%s' "$out" | grep -q 'APP-MARKER-OK'; then
            echo "APP BUILD OK: a Windows-compiled hull produced an APE that runs"
          else
            echo "FAIL the produced app did not print its marker"
            exit 1
          fi

      - name: Upload the app-build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hull-windows-app-build-logs
          path: |
            platform-cosmo.log
            hull-embed.log
            doctor.json
          if-no-files-found: warn
          retention-days: 14
