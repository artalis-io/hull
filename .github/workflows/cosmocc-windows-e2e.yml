name: cosmocc Windows E2E

# The payoff for the cosmocc-on-Windows epic (docs/cosmocc_install.md items A-E):
# prove that a cosmo `hull` built from THIS branch, given the trimmed cosmocc +
# busybox bundle, actually `hull build`s a working APE on a stock Windows box -
# exercising item D (resolver $HOME->$USERPROFILE + bundle probe), item A (the
# transparent cosmocc->busybox reroute in the spawn layer), and E.1 (the trim +
# busybox ride-along producer) end to end.
#
# Three jobs: build the cosmo hull (Linux, EMBED_PLATFORM=cosmo), build the
# bundle (Linux, also validates the producer + its size gate), then Windows:
# install the bundle the way `hull tools install` would and run `hull build`.
#
# Non-required / on demand: run when the cosmocc code paths or the producer
# change. It is the acceptance test for E; the release wiring (E.3) follows once
# this is green.
#
# SPDX-License-Identifier: AGPL-3.0-or-later

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cosmocc-windows-e2e.yml'
      - 'scripts/build_cosmocc_bundle.sh'
      - 'src/hull/cap/tool.c'
      - 'src/hull/runtime/lua/mod_tool.c'
      - 'src/hull/sandbox_tool.c'
      - 'src/hull/compiler.c'
      - 'src/hull/cap/tar.c'
      - 'src/hull/cap/fs.c'
      - 'src/hull/sandbox.c'
      - 'src/hull/shared/fs_util.c'
      - 'stdlib/cli/lua/hull/build.lua'

permissions:
  contents: read

env:
  COSMOCC_VERSION: 4.0.2
  COSMOCC_SHA256: 85b8c37a406d862e656ad4ec14be9f6ce474c1b436b9615e91a55208aced3f44
  BUSYBOX_URL: https://frippery.org/files/busybox/busybox64u.exe

jobs:
  build-cosmo-hull:
    name: Build cosmo hull from branch (EMBED_PLATFORM=cosmo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Install cosmocc
        run: |
          COSMOCC_DIR=/opt/cosmo make fetch-cosmocc
          echo "/opt/cosmo/bin" >> "$GITHUB_PATH"
      - name: Build platform (multi-arch) + hull (embedded)
        run: |
          make platform-cosmo
          make CC=cosmocc EMBED_PLATFORM=cosmo
          ./build/hull version
      # NOTE: a Linux-side "build the cosmo APE and run it here" isolation was
      # tried to classify the exit-256 (hull.json preload) bug, but this runner
      # environment corrupts the system ELF loader once cosmocc is installed
      # (every /bin/sh, cc, gcc, clang fails "libc.so.6: failed to map segment"),
      # so hull never reaches cosmocc and the produced APE is never built. The
      # bug was instead root-caused by construction (the weak
      # hl_stdlib_feature_entries seam not force-loaded on the composition-exempt
      # cosmo base) and localized locally (a NATIVE hull build of the same app
      # runs clean). The fix (whole-archive the cosmo base in build.lua) is
      # validated by the Windows leg below running the APE to exit 0.
      - uses: actions/upload-artifact@v4
        with:
          name: hull-cosmo-branch
          path: build/hull

  build-bundle:
    name: Build trimmed cosmocc bundle (+ size gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install strace (the producer traces a build to trim the tree)
        run: sudo apt-get update -qq && sudo apt-get install -y strace
      - name: Produce hull-cosmocc.tar
        shell: bash
        run: |
          # Pin busybox by computing its digest now (the real release, E.3, hard-
          # pins this constant; the E2E just needs it consistent with the fetch).
          curl -fsSL --retry 3 -L "$BUSYBOX_URL" -o bb.exe
          bb_sha=$(sha256sum bb.exe | cut -d' ' -f1)
          echo "busybox64u.exe sha256 = $bb_sha   (pin this in release.yml for E.3)"
          sh scripts/build_cosmocc_bundle.sh \
             "$COSMOCC_VERSION" "$COSMOCC_SHA256" \
             "$BUSYBOX_URL" "$bb_sha" \
             hull-cosmocc.tar
          ls -la hull-cosmocc.tar
      - uses: actions/upload-artifact@v4
        with:
          name: hull-cosmocc-tar
          path: hull-cosmocc.tar

  windows-e2e:
    name: Windows - install bundle + hull build an APE
    runs-on: windows-latest
    needs: [build-cosmo-hull, build-bundle]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hull-cosmo-branch
          path: hbin
      - uses: actions/download-artifact@v4
        with:
          name: hull-cosmocc-tar
          path: btar

      - name: Install the bundle to %USERPROFILE%\.hull\tools\cosmocc
        shell: pwsh
        run: |
          $dest = "$env:USERPROFILE\.hull\tools\cosmocc"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # bsdtar (tar.exe) preserves the arch-cc symlinks, matching what hull's
          # own symlink-aware hl_tar_extract (item B) produces.
          tar.exe -xpf btar\hull-cosmocc.tar -C $dest 2>&1 | Write-Host
          Copy-Item hbin\hull hull-cosmo.exe -Force
          Write-Host "cosmocc : $(Test-Path "$dest\bin\cosmocc")"
          Write-Host "busybox : $(Test-Path "$dest\bin\busybox.exe")"
          .\hull-cosmo.exe version

      # Regression guard for the Windows blob.init drive-root mkdir bug (nexogen
      # asset-tracker PLATFORM_GAPS 2026-07-14, mis-filed as "spaces in path"):
      # hl_mkdir_p walks an absolute path from the root and mkdir()s the drive-root
      # component ("/C", "/D"), which Cosmo-on-Windows rejects with EIO (not
      # EEXIST) - so blob.init failed for ANY path (case B has no space, and still
      # failed before the fix). The fix makes hl_ensure_dir stat-check for an
      # existing directory on any mkdir errno. All three path shapes must boot
      # blob.init cleanly; a regression fails the job. HULL_FS_DEBUG keeps the
      # mkdir-fail trace on if it ever breaks again.
      - name: blob.init on Windows (drive-root mkdir + spaces regression guard)
        shell: pwsh
        run: |
          $lua = @'
          local blob = require("hull.blob")
          app.manifest({ modules = { "hull/blob@1" }, fs = { write = { "data/blobs" } } })
          app.main(function(ctx)
            local ok, err = pcall(function() blob.init({ dir = "data/blobs" }) end)
            ctx.stdout:write("REPRO blob.init ok=" .. tostring(ok) .. " err=" .. tostring(err) .. "\n")
            return ok and 0 or 3
          end)
          '@
          $env:HULL_FS_DEBUG = "1"
          $script:fails = @()
          function Try-Path($label, $dir) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Set-Content -NoNewline "$dir\app.lua" -Value $lua -Encoding ascii
            Write-Host "=== [$label] cosmo hull on: $dir ==="
            $out = & .\hull-cosmo.exe "$dir\app.lua" 2>&1 | Out-String
            Write-Host $out
            if ($out -match "REPRO blob.init ok=true") { Write-Host "[$label] OK" }
            else { Write-Host "[$label] FAIL"; $script:fails += $label }
            Write-Host "------------------------------------------------------------"
          }
          # A: RUNNER_TEMP (clean prefix, no 8.3) + a SPACE.
          Try-Path "A space-clean-prefix" "$env:RUNNER_TEMP\sp ace\reproapp"
          # B: RUNNER_TEMP, NO space (control - drive-root mkdir path).
          Try-Path "B nospace-clean-prefix" "$env:RUNNER_TEMP\nospace\reproapp"
          # C: TEMP (8.3 'RUNNER~1' short-name) + a space (the original report).
          Try-Path "C space-and-83" "$env:TEMP\has space\reproapp"
          if ($script:fails.Count -gt 0) {
            Write-Host "BLOB-WINDOWS-FAIL: $($script:fails -join ', ')"
            exit 1
          }
          Write-Host "BLOB-WINDOWS-OK: blob.init works on Windows for all path shapes"

      - name: hull build a trivial app -> APE
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app | Out-Null
          # Print a marker + return 0 so we can see whether main runs cleanly and
          # what exit code it produces (the exit=256 follow-up).
          "app.manifest({ modules = {} })`napp.main(function(ctx) ctx.stdout:write('APP-MARKER-OK\n'); return 0 end)" | Set-Content -NoNewline app\app.lua -Encoding ascii
          # Audit on so the reroute (busybox sh -c 'exec cosmocc ...') is visible.
          $out = .\hull-cosmo.exe build app -o app.exe --no-verify-platform --audit 2>&1 | Out-String
          Write-Host $out
          Write-Host "--- build exit: $LASTEXITCODE ---"

      - name: Verdict - did hull build produce a runnable APE on Windows?
        shell: pwsh
        run: |
          $built = Test-Path app.exe
          Write-Host "app.exe built: $built"
          $ran = $false
          if ($built) {
            # Capture stdout+stderr: exit=256 (=1<<8) means main errored (rc=1)
            # and printed to stderr - surface it.
            $appout = & .\app.exe 2>&1 | Out-String
            $rc = $LASTEXITCODE; $global:LASTEXITCODE = 0
            $lo = $rc -band 0xFF; $hi = ($rc -shr 8) -band 0xFF
            Write-Host "app.exe output: [$appout]"
            Write-Host "app.exe ran, exit=$rc (lo=$lo hi=$hi; expected 0)"
            # The APE's real exit code is the HIGH byte on Windows (§0.6); 0 = OK.
            if ($rc -eq 0 -or $hi -eq 0) { $ran = $true }
          }
          Write-Host "=================================================================="
          if ($built -and $ran) {
            Write-Host "E2E PASS: a cosmo hull built from this branch drove the trimmed"
            Write-Host "cosmocc+busybox bundle to a working APE on stock Windows - items"
            Write-Host "A (reroute) + D (resolver) + E.1 (bundle) verified end to end."
            exit 0
          }
          Write-Host "E2E FAIL (built=$built ran=$ran): see the --audit tool.spawn lines"
          Write-Host "above for where the cosmocc reroute broke (resolve / compile /"
          Write-Host "apelink)."
          exit 1

      # 0.13.1 PR#1 acceptance: the app.main control above proves BUILD + EXIT,
      # but the field failure was a produced HTTP app that BUILDS + RUNS yet
      # never serves (the fat cosmo platform archive's weak http_weakstub.o
      # shadowed the strong per-runtime hl_<rt>_wire_routes_server, so serve
      # aborted on the -1 no-op). This step builds two-line Lua + JS /ping apps
      # with the SAME branch cosmo hull + bundled cosmocc and asserts each
      # actually answers 'pong' - the coverage the app.main-only control missed.
      - name: hull build HTTP apps -> APE and assert they SERVE (PR#1)
        shell: pwsh
        run: |
          $fail = 0
          function Build-And-Serve($dir, $ext, $src, [string]$bin, [int]$port) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Set-Content -NoNewline "$dir\app.$ext" -Value $src -Encoding ascii
            $bout = .\hull-cosmo.exe build $dir -o $bin --no-verify-platform 2>&1 | Out-String
            Write-Host $bout
            if (-not (Test-Path $bin)) { Write-Host "FAIL $dir did not build"; $script:fail = 1; return }
            $p = Start-Process -FilePath ".\$bin" -ArgumentList @('-p', "$port") -PassThru `
                     -RedirectStandardOutput "$dir.out" -RedirectStandardError "$dir.err" -WindowStyle Hidden
            $resp = ''
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 400
              try { $resp = (Invoke-WebRequest "http://127.0.0.1:$port/ping" -UseBasicParsing -TimeoutSec 3).Content; break } catch {}
              if ($p.HasExited) { break }
            }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            if ($resp -eq 'pong') { Write-Host "PASS $dir served pong" }
            else { Write-Host "FAIL $dir did not serve (resp='$resp'); stderr:"; Get-Content "$dir.err" -ErrorAction SilentlyContinue | Write-Host; $script:fail = 1 }
          }
          $lua = "app.manifest({ modules = { `"hull/http-server@1`" } })`napp.get(`"/ping`", function(req, res) res:text(`"pong`") end)"
          $js  = "import { app } from `"hull:app`";`napp.manifest({ modules: [`"hull/http-server@1`"] });`napp.get(`"/ping`", (req, res) => res.text(`"pong`"));"
          Build-And-Serve "httplua" "lua" $lua "lua_windows.com" 39310
          Build-And-Serve "httpjs"  "js"  $js  "js_windows.com"  39311
          # Stage the produced APEs (+ the app.main control) for the macOS
          # second-host portability leg.
          New-Item -ItemType Directory -Force -Path apes | Out-Null
          Copy-Item lua_windows.com apes\ -Force
          Copy-Item js_windows.com  apes\ -Force
          if (Test-Path app.exe) { Copy-Item app.exe apes\main_windows.com -Force }
          if ($fail -ne 0) { Write-Host "PR#1 ACCEPTANCE FAIL: a produced cosmo HTTP app did not serve"; exit 1 }
          Write-Host "PR#1 ACCEPTANCE PASS: produced cosmo Lua+JS HTTP apps serve pong on Windows"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: cosmo-http-apes
          path: apes/*.com
          if-no-files-found: warn
          retention-days: 7

  macos-serve:
    name: macOS - second-host portability (produced APEs serve)
    runs-on: macos-latest
    needs: [windows-e2e]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/download-artifact@v4
        with:
          name: cosmo-http-apes
          path: apes
      # The Windows-produced cosmo APEs must serve on a second, independent APE
      # host too (proves the fix is a portable produced-binary property, not a
      # Windows-run quirk). download-artifact strips the exec bit; the script
      # chmods before running.
      - name: Run produced APEs on macOS and assert serve
        run: APES_DIR=apes sh tests/cosmo_http_serve_run.sh
