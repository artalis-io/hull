name: CI

on:
  push:
    branches: [main]
    # Site / docs / changelog updates don't touch any C, Lua, JS, Makefile,
    # or workflow surface that CI validates — skip the full build matrix
    # for those. deploy-site.yml handles site/** independently.
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'LICENSING.md'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'LICENSING.md'
      - '**.md'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Linux (clang)
            os: ubuntu-latest
            cc: clang
          - name: Linux (aarch64)
            os: ubuntu-24.04-arm
          - name: macOS
            os: macos-latest

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc || 'cc' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        run: make

      - name: Unit tests
        timeout-minutes: 5
        run: make test

      - name: E2E tests
        timeout-minutes: 2
        run: make e2e

      - name: Sandbox tests
        timeout-minutes: 2
        run: make e2e-sandbox

      - name: Example E2E tests
        timeout-minutes: 5
        run: make e2e-examples

      - name: Compute E2E tests
        timeout-minutes: 2
        run: make e2e-compute

      - name: TCC E2E tests
        timeout-minutes: 3
        run: make e2e-tcc

      - name: Install + completions E2E tests
        timeout-minutes: 2
        run: make e2e-install

      - name: CA bundle E2E tests
        timeout-minutes: 2
        run: make e2e-ca-bundle

      - name: Update E2E tests
        timeout-minutes: 2
        run: make e2e-update

      - name: hull test (examples)
        timeout-minutes: 2
        run: make hull-test-examples

  # Reproducibility gate. Two properties tested independently:
  #
  #   1. Self-build (bootstrap): hull can build hull2 can build hull3.
  #      Proves the build pipeline produces working binaries that can
  #      themselves produce working binaries.
  #
  #   2. Reproducible-check (byte-identity): `hull build` is
  #      deterministic. Build the same fixture twice with the same hull
  #      to the SAME output path, and verify the two snapshots are
  #      byte-identical. (Same-path matters: macOS ld64 hashes the
  #      output path into LC_UUID, so building to different paths
  #      yields different UUIDs even for identical content. Same-path
  #      isolates the question we actually care about: link output
  #      stability for fixed inputs. See Makefile comment on the
  #      target.)
  #
  # Both run on Linux. A separate macOS check exists as a local
  # diagnostic (works there too after the same-path methodology fix).
  reproducibility:
    name: Reproducible build (self-build + byte-identity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build hull
        timeout-minutes: 5
        run: make
      - name: Self-build chain (hull -> hull2 -> hull3)
        timeout-minutes: 5
        run: make self-build
      - name: Reproducibility (byte-identical builds, same output path)
        timeout-minutes: 5
        run: make reproducible-check

  build-pipeline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    name: Build Pipeline (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build pipeline E2E tests
        timeout-minutes: 10
        run: make e2e-build

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and test with sanitizers
        timeout-minutes: 10
        run: |
          make clean
          make DEBUG=1 test

  msan:
    name: MSan + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: MSan test
        timeout-minutes: 10
        run: make msan

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools cppcheck

      - name: scan-build
        run: make analyze

      - name: cppcheck
        run: make cppcheck

  cosmo:
    name: Cosmopolitan (APE)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cosmocc
        run: |
          COSMOCC_DIR=/opt/cosmo make fetch-cosmocc
          echo "/opt/cosmo/bin" >> $GITHUB_PATH

      - name: Build platform (multi-arch)
        run: make platform-cosmo

      - name: Build hull
        run: make CC=cosmocc

      - name: Unit tests
        timeout-minutes: 5
        run: make test CC=cosmocc

      - name: Sandbox tests (cosmo)
        timeout-minutes: 2
        run: make e2e-sandbox CC=cosmocc

      - name: Example E2E tests
        timeout-minutes: 5
        run: make e2e-examples CC=cosmocc

      - name: Compute E2E tests
        timeout-minutes: 2
        run: make e2e-compute CC=cosmocc

      - name: hull test (examples)
        timeout-minutes: 2
        run: make hull-test-examples CC=cosmocc

  gpu:
    name: GPU Compute (macOS Metal)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch wgpu-native
        run: make fetch-wgpu

      - name: Build with GPU
        run: make HL_ENABLE_GPU=1

      - name: Unit tests (GPU)
        timeout-minutes: 5
        run: make test HL_ENABLE_GPU=1

      - name: E2E tests
        timeout-minutes: 2
        run: make e2e HL_ENABLE_GPU=1

      - name: Compute E2E tests
        timeout-minutes: 2
        run: make e2e-compute HL_ENABLE_GPU=1

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Generate coverage
        timeout-minutes: 10
        run: make coverage

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/html/

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck

      - name: Lua lint
        run: make lint-lua

      - name: Install Biome
        run: npm install -g @biomejs/biome@1.9.4

      - name: JS lint
        run: make lint-js

  benchmark:
    name: Benchmark (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    strategy:
      matrix:
        runtime: [lua, js]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Build
        run: make

      - name: Benchmark
        run: RUNTIME=${{ matrix.runtime }} DURATION=5s CONNECTIONS=50 THREADS=2 sh bench/bench.sh

      - name: Template Benchmark
        run: RUNTIME=${{ matrix.runtime }} DURATION=5s CONNECTIONS=50 THREADS=2 sh bench/bench_template.sh
