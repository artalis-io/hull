          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::spans example e2e failed (rc=$rc)"; exit "$rc"; }
          if grep -qE '\bSKIP\b' spans_ex.log; then
            echo "::error::spans example e2e skipped (no clang / no embedded hull / no wamrc)"; exit 1
          fi
          grep -qE "spans-example: 22 passed, 0 failed" spans_ex.log \
            || { echo "::error::spans example e2e did not run its 22 checks to pass"; exit 1; }
          echo "mapped_spans example: public SDK read correct on interp + AOT, both runtimes."

  # Multiple named spans (3b final slice): declaration-order discovery + per-name
  # lookup (+ unknown -1), Lua AND JS, interpreter AND AOT via the production
  # `hull build` path. Needs a wasm clang + wamrc + an embedded hull; non-skippable.
  spans-multi:
    needs: [classify, wamrc-x86_64]
    if: needs.classify.outputs.run_compute == 'true'
    name: mapped spans - multiple named spans, Lua + JS, interp + AOT
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install clang + lld + LLVM + cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm-18-dev cmake

      - name: Download verified wamrc artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wamrc-x86_64
          path: artifact

      - name: Build embedded hull (platform lib) + consume verified wamrc
        timeout-minutes: 15
        run: |
          make platform
          if command -v llvm-config-18 >/dev/null 2>&1; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=$(llvm-config-18 --cmakedir)"
          fi
          sh tests/ci_wamrc_consume.sh
          # Embed LAST: a later bare `make` would clobber the embedding
          # (EMBED_PLATFORM is not in the config sentinel), and the e2e needs it.
          make EMBED_PLATFORM=1

      - name: Multiple-named-spans E2E (Lua + JS, interp + AOT, must NOT skip)
        timeout-minutes: 12
        run: |
          set -o pipefail
          sh tests/ci_ensure_wamrc.sh
          sh tests/e2e_spans_multi.sh 2>&1 | tee spans_multi.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::spans-multi e2e failed (rc=$rc)"; exit "$rc"; }
          if grep -qE '\bSKIP\b' spans_multi.log; then
            echo "::error::spans-multi e2e skipped (no clang / no embedded hull / no wamrc)"; exit 1
          fi
          grep -qE "spans-multi: 22 passed, 0 failed" spans_multi.log \
            || { echo "::error::spans-multi e2e did not run its 22 checks to pass"; exit 1; }
          echo "multiple named spans: declaration-order discovery + lookup on interp + AOT, both runtimes."

  # Sparse > 4 GiB window (exact 64-bit foffset) + hull_span_setup() capacity
  # (exact/excess/insufficient + true count) + real-window bounded reads
  # (first/exact-end/one-past/straddle), Lua + JS, interpreter + AOT (3b
  # completion). Uses a SPARSE 5 GiB file (no real disk) so it runs anywhere.
  spans-hugefile:
    needs: [classify, wamrc-x86_64]
    if: needs.classify.outputs.run_compute == 'true'
    name: mapped spans - >4GiB foffset + setup capacity, Lua + JS, interp + AOT
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install clang + lld + LLVM + cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm-18-dev cmake

      - name: Download verified wamrc artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wamrc-x86_64
          path: artifact

      - name: Build embedded hull (platform lib) + consume verified wamrc
        timeout-minutes: 15
        run: |
          make platform
          if command -v llvm-config-18 >/dev/null 2>&1; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=$(llvm-config-18 --cmakedir)"
          fi
          sh tests/ci_wamrc_consume.sh
          make EMBED_PLATFORM=1

      - name: Huge-file / setup-capacity E2E (Lua + JS, interp + AOT, must NOT skip)
        timeout-minutes: 12
        run: |
          set -o pipefail
          sh tests/ci_ensure_wamrc.sh
          sh tests/e2e_spans_hugefile.sh 2>&1 | tee spans_huge.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::spans-hugefile e2e failed (rc=$rc)"; exit "$rc"; }
          if grep -qE '\bSKIP\b' spans_huge.log; then
            echo "::error::spans-hugefile e2e skipped (no clang / no embedded hull / no wamrc / no python3)"; exit 1
          fi
          grep -qE "spans-hugefile: 34 passed, 0 failed" spans_huge.log \
            || { echo "::error::spans-hugefile e2e did not run its 34 checks to pass"; exit 1; }
          echo ">4GiB foffset + hull_span_setup capacity + bounded reads: interp + AOT, both runtimes."

  # patch 0004 arm64 AOT gate. The x86_64 job above proves the guarded-subrange
  # AOT path on x86_64; this runs the same non-skipped AOT matrix on arm64, where
  # WAMR sets the emitted load/store alignment to the WASM hint and a span whose
  # data starts at a non-N-aligned FILE offset yields a native-misaligned access.
  # arm64 tolerates that in hardware, but the design mandates confirming it on the
  # shipped arch rather than assuming it. Interp coverage on arm64 comes from the
  # aarch64 build job's `make test`; this closes the arm64 AOT leg.
  wasm-guarded-aot-arm64:
    needs: [classify]
    if: needs.classify.outputs.run_compute == 'true'
    name: Guarded-subrange AOT C-API test (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install LLVM + cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev cmake

      - name: Build wamrc (applies the WAMR patch carriage)
        timeout-minutes: 12
        run: |
          if command -v llvm-config-18 >/dev/null 2>&1; then
            llvm_cmakedir=$(llvm-config-18 --cmakedir)
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=${llvm_cmakedir}"
          fi
          make wamrc

      - name: Build + run the guarded-subrange AOT cases (arm64, must NOT skip)
        timeout-minutes: 12
        run: |
          # Precondition: guarantee THIS step's own executable wamrc rather than
          # trusting a prior step's mutable build/ state (see the helper header).
          sh tests/ci_ensure_wamrc.sh
          rm -f build/gen_gsub_aot_sw.h
          make build/test_wasm_guarded_subrange
          set -o pipefail
          ./build/test_wasm_guarded_subrange 2>&1 | tee gsub.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::test_wasm_guarded_subrange failed (rc=$rc)"; exit "$rc"; }
          for c in aot_sw_bounds; do
            if grep -qE "SKIPPED.*wasm_guarded\.$c" gsub.log; then
              echo "::error::guarded AOT case $c took the wamrc-unavailable skip path"; exit 1
            fi
            grep -qE "OK[^A-Za-z].*wasm_guarded\.$c" gsub.log \
              || { echo "::error::guarded AOT case $c did not run to OK"; exit 1; }
          done
          echo "arm64 guarded-subrange AOT case (SW-bound) ran against a real wamrc .aot and passed."

      - name: Build + run the mapped-span AOT lifecycle case (arm64, must NOT skip)
        timeout-minutes: 12
        run: |
          # Precondition: guarantee THIS step's own executable wamrc rather than
          # trusting a prior step's mutable build/ state (see the helper header).
          sh tests/ci_ensure_wamrc.sh
          # the span lifecycle + Design B window under a real AOT
          # instance. FAIL if the AOT case takes the wamrc-unavailable skip path.
          rm -f build/gen_ro_heap_span_aot.h
          make build/test_wasm_spans
          set -o pipefail
          ./build/test_wasm_spans 2>&1 | tee spans.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::test_wasm_spans failed (rc=$rc)"; exit "$rc"; }
          if grep -qE "SKIPPED.*wasm_spans\\.aot_span_lifecycle" spans.log; then
            echo "::error::span AOT lifecycle case took the wamrc-unavailable skip path"; exit 1
          fi
          grep -qE "OK[^A-Za-z].*wasm_spans\\.aot_span_lifecycle" spans.log \
            || { echo "::error::span AOT lifecycle case did not run to OK"; exit 1; }
          echo "arm64 mapped-span AOT lifecycle case ran against a real wamrc .aot and passed."
          # #334 Case B on arm64: the mem64 span readback runs in the same
          # test_wasm_spans invocation above; assert it did NOT take the skip path.
          if grep -qE "SKIPPED.*wasm_spans\\.memory64_span_readback" spans.log; then
            echo "::error::arm64 Memory64 span readback took the wamrc-unavailable skip path"; exit 1
          fi
          grep -qE "OK[^A-Za-z].*wasm_spans\\.memory64_span_readback" spans.log \
            || { echo "::error::arm64 Memory64 span readback did not run to OK"; exit 1; }
          echo "arm64 Memory64 span readback ran against a real wamrc .aot and passed."

      - name: Build + run the Memory64 8-cell AOT dispatch (arm64, must NOT skip)
        timeout-minutes: 12
        run: |
          # #336 Case A on arm64: the heap-less Memory64 dispatch (echo64, no spans/
          # segments) must run correctly on aarch64 too -- the permanent aarch64
          # half of the transparent-policy confirmation.
          sh tests/ci_ensure_wamrc.sh
          rm -f build/gen_echo64_aot.h
          make build/test_wasm
          set -o pipefail
          ./build/test_wasm --filter='*memory64_aot_dispatch' 2>&1 | tee m64arm.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::arm64 memory64_aot_dispatch crashed/failed (rc=$rc)"; exit "$rc"; }
          if grep -qE "SKIPPED.*hl_cap_wasm\\.memory64_aot_dispatch" m64arm.log; then
            echo "::error::arm64 Memory64 AOT dispatch took the wamrc-unavailable skip path"; exit 1
          fi
          grep -qE "OK[^A-Za-z].*hl_cap_wasm\\.memory64_aot_dispatch" m64arm.log \
            || { echo "::error::arm64 Memory64 AOT dispatch did not run to OK"; exit 1; }
          echo "arm64 heap-less Memory64 8-cell AOT dispatch ran against a real wamrc .aot and passed."

      - name: Build + run the hull_span.h native-vs-WASM differential (arm64, must NOT skip)
        timeout-minutes: 12
        run: |
          sh tests/ci_ensure_wamrc.sh
          rm -f build/gen_spandiff_aot.h
          make build/test_span_diff
          set -o pipefail
          ./build/test_span_diff 2>&1 | tee spandiff.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::test_span_diff failed (rc=$rc)"; exit "$rc"; }
          if grep -qE "SKIPPED spandiff\.aot_diff" spandiff.log; then
            echo "::error::span diff AOT sub-case took the wamrc-unavailable skip path"; exit 1
          fi
          grep -qE "spandiff\.aot_diff ran" spandiff.log \
            || { echo "::error::span diff AOT sub-case did not run"; exit 1; }
          echo "arm64 hull_span.h decodes identically native vs wasm (interp + AOT)."

  # Reproducibility gate. Three properties tested independently on
  # both Linux and macOS via matrix strategy:
  #
  #   1. Self-build (bootstrap): hull can build hull2 can build hull3.
  #      Proves the build pipeline produces working binaries that can
  #      themselves produce working binaries.
  #
  #   2. Hull-itself reproducibility: `make` from a clean tree
  #      produces a byte-identical `build/hull` between runs. Gates
  #      MANIFESTO's "same source = same binary" claim at the runtime
  #      level (not just for apps `hull build` produces).
  #
  #   3. Hull-build reproducibility: `hull build` produces byte-
  #      identical outputs for the same input. Build the same fixture
  #      twice to the SAME output path. (macOS ld64 hashes the output
  #      path into LC_UUID; same-path isolates the question we
  #      actually care about: link output stability for fixed
  #      inputs. See Makefile comment on the target.)
  # Build the documented HL_ENABLE_* build combinations and smoke-test each.
  # The default `build` job only covers the all-on build; without this, a
  # reference to a feature-gated symbol from an always-compiled TU would only
  # break under a narrower flag set, which nothing else exercises. (server-only
  # / client-only were removed as products in #114; the HTTP axis is now full vs
  # pure-compute, and pure-compute exercises both HTTP halves off at once.)
  flavors:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: Build flavor (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compute-only (no db)
            flags: HL_ENABLE_DB=0
          # pure-compute: both HTTP halves off, so mbedTLS is dropped entirely.
          # Core hashing (crypto.c, release_io.c, sbom.c, verify_self.c) runs on
          # the cap layer's self-contained SHA-256 + hand-rolled SHA-1, and HMAC
          # routes through the portable backend. This flavor proves none of that
          # silently regressed back onto an mbedTLS symbol.
          - name: pure-compute (no http at all)
            flags: HL_ENABLE_HTTP=0
          # PostgreSQL backend on top of SQLite: links the pure-C wire client
          # (cap/pgwire.c, cap/pg_conn.c, cap/db_postgres.c) + the shared TLS
          # client into the full binary. Guards the POSTGRES=1 link + the
          # HL_LINK_TLS gating.
          - name: sqlite + postgres
            flags: HL_ENABLE_POSTGRES=1
          # Postgres-only: SQLite dropped entirely. Proves the SQLite-specific
          # code (cap/db.c engine, db.udf bindings, agent DB introspection,
          # the hl_db_sqlite_* accessors) is gated on HL_ENABLE_SQLITE and the
          # backend selector / worker / migration runner have no residual hard
          # dependency on the SQLite backend TU.
          - name: postgres-only (no sqlite)
            flags: HL_ENABLE_SQLITE=0 HL_ENABLE_POSTGRES=1
          # MySQL / MariaDB backend (Phase 1 skeleton): guards the HL_ENABLE_MYSQL
          # link + HL_LINK_TLS gating + the selector registration so the backend
          # keeps building as the wire protocol lands.
          - name: sqlite + mysql
            flags: HL_ENABLE_MYSQL=1
          - name: mysql-only (no sqlite)
            flags: HL_ENABLE_SQLITE=0 HL_ENABLE_MYSQL=1
          # image-less: drops cap/image + stb (image's sole consumer). Guards
          # the HL_ENABLE_IMAGE=0 link (mod_image/mod_gpu image paths gated) and
          # that stb is fully unlinked.
          - name: image-less (no image codecs)
            flags: HL_ENABLE_IMAGE=0
          # EXPERIMENT (do not merge): does the LTO configuration fail on main,
          # i.e. WITHOUT the Keel flag-propagation change in #463? Neither
          # configuration has ever been built in CI, so "my change broke it"
          # and "it was already broken" look identical from #463 alone.
          - name: LTO
            flags: HL_ENABLE_LTO=1
          - name: LTO + CFI (clang)
            flags: CC=clang HL_ENABLE_CFI=1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build
        run: make ${{ matrix.flags }}

      # Guards the link-regression class (a feature-gated symbol referenced
      # from an always-compiled TU): the build step above is the real link
      # check; `hull version` confirms the binary starts.
      - name: Smoke (binary links + starts)
        timeout-minutes: 1
        run: ./build/hull version

      # Exercises the runtime entry path (serve_cli.c for HL_ENABLE_HTTP_SERVER=0,
      # serve.c otherwise), including the kernel sandbox, so a Linux-only crash
      # like the serve_cli.c missing-phase-1-pledge SIGABRT can't regress.
      - name: Smoke (app.main runs, return code propagates)
        timeout-minutes: 1
        run: |
          tmp="$(mktemp -d)"
          cat > "$tmp/app.lua" <<'LUA'
          app.manifest({ name = "flavor-smoke" })
          app.main(function(ctx) return 7 end)
          LUA
          set +e
          ./build/hull "$tmp/app.lua" >"$tmp/out.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 7 ]; then
            echo "expected exit 7, got $rc; hull output:"
            cat "$tmp/out.log"
            exit 1
          fi

  reproducibility:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: Reproducible build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Build hull
        timeout-minutes: 5
        run: make
      - name: Self-build chain (hull -> hull2 -> hull3)
        timeout-minutes: 5
        run: make self-build
      - name: Hull-itself reproducibility (make twice, then cmp)
        timeout-minutes: 10
        run: |
          set -eu
          cp build/hull /tmp/hull-rep-1
          make clean
          make
          if cmp -s /tmp/hull-rep-1 build/hull; then
            echo "PASS: build/hull is byte-identical across rebuilds ($(wc -c < build/hull) bytes)"
          else
            echo "FAIL: build/hull differs between rebuilds"
            shasum -a 256 /tmp/hull-rep-1 build/hull
            exit 1
          fi
      - name: Reproducibility (hull build byte-identical, same output path)
        timeout-minutes: 5
        run: make reproducible-check

  # Reproducible build inside the registry-less, snapshot-pinned container
  # (roadmap 0.3.1). Proves the containerized toolchain yields a byte-identical
  # hull across a clean rebuild, and exercises the whole mechanism (base-image
  # digest pin + apt snapshot pin + baked SHA-pinned cosmocc) that the Linux and
  # cosmo release jobs will adopt. This is what makes "reproducible across time"
  # hold indefinitely for the Linux artifacts, not just within the runner's
  # major-version window. macOS is intentionally excluded: no container touches
  # the macos-15 Xcode runner. See docs/security.md "Build-environment
  # immutability" and .github/docker/README.md.
  reproducibility-container:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: Reproducible build (Linux container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Build twice in the reproducible container and cmp
        uses: ./.github/actions/hull-build-container
        with:
          run: |
            make
            cp build/hull /tmp/hull-c1
            make clean
            make
            if cmp -s /tmp/hull-c1 build/hull; then
              echo "PASS: containerized build byte-identical across rebuilds ($(wc -c < build/hull) bytes)"
            else
              echo "FAIL: containerized build differs between rebuilds"
              sha256sum /tmp/hull-c1 build/hull
              exit 1
            fi

  # Proves the release build-native interleaving: build hull inside the
  # container as the runner user (user: host), then on the HOST run the produced
  # binary and write alongside it in build/. release.yml's Platform-sig E2E does
  # exactly this (host-side keygen/sign into build/ + running the freshly built
  # hull), and release.yml is tag-only so it cannot be exercised on a PR. This
  # job is the PR-validatable proxy for that ownership + run path. Roadmap 0.3.1.
  reproducibility-container-interleave:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: Reproducible build (Linux container, host interleave)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Build hull in-container as the runner user
        uses: ./.github/actions/hull-build-container
        with:
          user: host
          run: make
      - name: Host runs the container-built binary and writes into build/
        run: |
          set -eu
          ./build/hull version
          # build/ must be host-writable (user: host), exactly as the release
          # Platform-sig E2E requires when it does keygen/sign into build/.
          touch build/interleave-probe
          test -f build/interleave-probe
          echo "PASS: host ran the container-built hull and wrote into build/"

  # Cosmo APE byte-reproducibility (roadmap 0.3.7). The reproducibility job
  # above builds twice in ONE job and cmps; that pattern can't be used for
  # cosmo because a second `make platform-cosmo` in one job corrupts the
  # dynamic loader. So build hull-cosmo on two independent runners (each does
  # exactly one platform-cosmo build) and byte-compare the artifacts in a
  # third job. This tests cross-runner reproducibility and verifies the
  # "Cosmopolitan produces deterministic output" claim (docs/security.md) for
  # the hull-cosmo release binary itself.
  reproducibility-cosmo:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: Reproducible build (Cosmo ${{ matrix.n }})
    strategy:
      fail-fast: false
      matrix:
        n: [a, b]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      # Build inside the snapshot-pinned reproducible container (roadmap 0.3.1).
      # cosmocc is baked into the image, so there is no fetch step. One
      # `make platform-cosmo` per job: the a/b split exists because a second
      # cosmo platform build in one job corrupts the loader.
      - name: Build hull-cosmo in the reproducible container
        uses: ./.github/actions/hull-build-container
        with:
          run: |
            make platform-cosmo
            make CC=cosmocc
      - name: Upload hull-cosmo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hull-cosmo-repro-${{ matrix.n }}
          path: build/hull
          if-no-files-found: error

  reproducibility-cosmo-compare:
    if: needs.classify.outputs.run_core_common == 'true'
    name: Reproducible build (Cosmo compare)
    needs: [reproducibility-cosmo, classify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
      - name: Byte-compare the two independent cosmo builds
        run: |
          set -eu
          A=artifacts/hull-cosmo-repro-a/hull
          B=artifacts/hull-cosmo-repro-b/hull
          ls -la "$A" "$B"
          if cmp -s "$A" "$B"; then
            echo "PASS: hull-cosmo is byte-identical across independent runners ($(wc -c < "$A") bytes)"
          else
            echo "::error::hull-cosmo differs between builds; the cosmo APE is not byte-reproducible"
            sha256sum "$A" "$B"
            echo "--- first differing bytes ---"
            cmp -l "$A" "$B" | head -20 || true
            exit 1
          fi

  build-pipeline:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15

    name: Build Pipeline (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build pipeline E2E tests
        timeout-minutes: 10
        run: make e2e-build

  sanitizers:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: ASan + UBSan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build and test with sanitizers
        timeout-minutes: 10
        run: |
          make clean
          make DEBUG=1 test

  msan:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: MSan + UBSan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: WAMR MSan shadow-gap annotation policy fixture (patch 0006)
        # Asserts (against the actual compile commands, not comments) that WAMR
        # stays uninstrumented under MSan, that -DHL_MSAN is passed so patch 0006's
        # targeted __msan_unpoison compiles in, that normal builds carry neither,
        # and that the annotation stays scoped to the signature buffer + placed
        # before the intercepted comparison. Runs before `make msan` (which cleans).
        run: make check-wamr-msan-annotation

      - name: MSan test
        # Raised 15 -> 30 min. The crypto-heavy auth-stack unit tests
        # (TOTP enrollment / PBKDF2 verify) dominate MSan runtime and
        # were tipping the whole suite past the 15 min cap on GitHub's
        # shared runners, timing out in js_stdlib.totp_brute_force_lockout.
        # PBKDF2 under MSan instrumentation is inherently slow and its work
        # must NOT be reduced (that would weaken coverage of the real auth
        # path), so raising the honest wall-clock cap is the correct fix.
        # If total runtime keeps growing, split the MSan suite into parallel
        # jobs rather than cutting work.
        timeout-minutes: 30
        run: make msan

  tsan:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: TSan (worker pool)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: TSan test (worker-pool / shared-state paths)
        # ThreadSanitizer over the suites that spin worker threads: the
        # WASM compute worker (cap/wasm.c + worker_wasm.c, home of the
        # shared-segment vs in-flight-async-call fix) and both thread-pool
        # async backends (Keel-backed + poll). Guards against a regression
        # of the inflight_async use-after-free fix and any future race in
        # the worker handoff shared by db.async / compute.async / gpu.async.
        timeout-minutes: 15
        run: make CC=clang tsan

  # The WAMR shared-heap lifecycle is race-sensitive (shared_heap_list +
  # attached_count under shared_heap_list_lock, patch 0003; the mapped-span
  # attachment layer built on it). The worker-pool TSan job above leaves WAMR
  # uninstrumented, so this dedicated job builds the staged WAMR TUs WITH
  # ThreadSanitizer (WAMR_TSAN=1) and runs BOTH the shared-heap-destroy matrix and
  # the mapped-span attachment-lifecycle test, so a race inside destroy / attach /
  # detach / chain / span-set teardown is caught in CI, not only locally.
  # Isolated from the worker-pool job so instrumenting WAMR does not perturb that
  # signal.
  tsan-shared-heap:
    needs: [classify]
    if: needs.classify.outputs.run_compute == 'true'
    name: TSan (WAMR shared-heap destroy + guarded subrange + spans)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: WAMR-instrumented TSan (destroy + guarded-subrange + span lifecycle)
        timeout-minutes: 20
        run: make CC=clang tsan-shared-heap

  # -- fuzz split (docs/ci_architecture_design.md section 11): native protocol /
  # security fuzzers, the Lua source parser fuzzer, and the JS source parser
  # fuzzer as INDEPENDENT jobs so path-aware selection can run only the relevant
  # target. Each keeps its sanitizer instrumentation + 60s libFuzzer budget. --
  # the former single `fuzz-native-security` job is split into three
  # atomic jobs owning a FIXED target subset each. The UNION of the three equals
  # the former 13-target set (asserted by scripts/ci/test_job_plan.py :: fuzz_union).
  # Checkpoint 3 assigns each to its subsystem group: core fuzzers -> core-common
  # (run_core_common), DB wire -> the db-any umbrella (run_db_any), compute spans
  # -> compute (run_compute). So a narrow-native DB change runs only fuzz-db-wire.
  fuzz-core-security:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: Fuzz (core security)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build core fuzz targets
        run: |
          make CC=clang \
            fuzz/fuzz_sh_json fuzz/fuzz_path_normalize fuzz/fuzz_mime_sniff \
            fuzz/fuzz_host_match
      - name: Run core fuzzers (60s each)
        timeout-minutes: 10
        run: |
          set -e
          for f in sh_json path_normalize mime_sniff host_match; do
            echo "== fuzz $f =="
            ./fuzz/fuzz_$f fuzz/corpus_$f/ -max_total_time=60
          done

  fuzz-db-wire:
    needs: [classify]
    if: needs.classify.outputs.run_db_any == 'true'
    name: Fuzz (DB wire protocols)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build DB wire fuzz targets
        run: |
          make CC=clang \
            fuzz/fuzz_pgwire fuzz/fuzz_pg_dsn fuzz/fuzz_pg_rewrite \
            fuzz/fuzz_mysqlwire fuzz/fuzz_mysql_dsn fuzz/fuzz_respwire \
            fuzz/fuzz_valkey_dsn
      - name: Run DB wire fuzzers (60s each)
        timeout-minutes: 15
        run: |
          set -e
          for f in pgwire pg_dsn pg_rewrite mysqlwire mysql_dsn respwire valkey_dsn; do
            echo "== fuzz $f =="
            ./fuzz/fuzz_$f fuzz/corpus_$f/ -max_total_time=60
          done

  fuzz-compute-span:
    needs: [classify]
    if: needs.classify.outputs.run_compute == 'true'
    name: Fuzz (compute mapped-span SDK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build compute fuzz targets
        run: |
          make CC=clang fuzz/fuzz_span_sdk fuzz/fuzz_span_window
      - name: Run compute fuzzers (60s each)
        timeout-minutes: 10
        run: |
          set -e
          for f in span_sdk span_window; do
            echo "== fuzz $f =="
            ./fuzz/fuzz_$f fuzz/corpus_$f/ -max_total_time=60
          done

  fuzz-lua-source:
    needs: [classify]
    if: needs.classify.outputs.run_fuzz_lua == 'true'
    name: Fuzz (Lua source parser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Fuzz Lua source parser (60s)
        # hull.source.lua: adversarial bytes -> lua.parse() over a bounded lua_State,
        # ASan/UBSan on the instrumented VM; corpus staged from the repo root.
        timeout-minutes: 5
        run: make fuzz-lua-source CC=clang FUZZ_TIME=60

  fuzz-js-source:
    needs: [classify]
    if: needs.classify.outputs.run_fuzz_js == 'true'
    name: Fuzz (JS source parser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Fuzz JS source parser (60s)
        # hull:source:parser through the restricted QuickJS session (fuzz_parse entry);
        # sanitizer split keeps UBSan off vendored QuickJS. Corpus staged first.
        timeout-minutes: 5
        run: make fuzz-js-source CC=clang FUZZ_TIME=60

  # -- focused source-frontend jobs (docs/ci_architecture_design.md sections 4, 9):
  # a FRESH embedded-host build + the frontend unit suite + the discovery /
  # dev-agent / inspect lifecycle. ADDITIVE in this checkpoint (they run on every
  # PR/push alongside the full matrix); classifier-based skipping of the redundant
  # full build for tooling PRs is the next checkpoint, gated on coverage
  # equivalence. --
  focused-js-frontend:
    needs: [classify]
    if: needs.classify.outputs.run_focused_js == 'true'
    name: Focused JS frontend (fresh embedded host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: recursive
      - name: JS frontend tests (fresh registry embed)
        run: make test-js-frontend
      - name: Project source-discovery lifecycle (hull dev --agent -> inspect, JS)
        timeout-minutes: 6
        run: make e2e-project-discovery

  focused-lua-frontend:
    needs: [classify]
    if: needs.classify.outputs.run_focused_lua == 'true'
    name: Focused Lua frontend (fresh embedded host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: recursive
      - name: Lua source + frontend tests (fresh registry embed)
        run: make test-lua-frontend
      - name: Project source-discovery lifecycle (lua-only)
        timeout-minutes: 6
        run: make e2e-project-discovery-lua

  # End-to-end against a real PostgreSQL 16 (started in Docker by the script).
  # Exercises the whole path the unit tests can't: DSN -> SCRAM-SHA-256 auth
  # (plaintext + TLS via a self-signed cert) -> parameterized query + typed
  # decode -> startup migrations (multi-statement, simple-query path) ->
  # db.async on a worker connection -> the DB-backed stdlib (session / outbox
  # / auth-health) on Postgres. The script self-builds with
  # HL_ENABLE_POSTGRES=1 and skips cleanly if Docker is unavailable.
  postgres:
    needs: [classify]
    if: needs.classify.outputs.run_db_postgres == 'true'
    name: PostgreSQL e2e
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: PostgreSQL end-to-end
        timeout-minutes: 15
        run: make e2e-postgres

  # The PostgreSQL-over-Keel unit tests (the shared cap/db_transport.c AND cap/pg_conn.c,
  # whose connection layer now drives through the transport) are
  # HL_ENABLE_POSTGRES-gated, so the base `sanitizers` / `build` jobs do not build
  # them. This standing leg builds + runs both under ASan+UBSan with LSan (on by
  # default on Linux), giving durable coverage of the transport's
  # allocation-preservation and descriptor-lifecycle behavior AND the pg_conn
  # codec / handshake / adopt path so neither can silently regress.
  pg-transport-sanitize:
    needs: [classify]
    if: needs.classify.outputs.run_db_postgres == 'true'
    name: pg_transport ASan/LSan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: build test_pg_transport + test_pg_conn under ASan+UBSan (+LSan), Postgres enabled
        run: make DEBUG=1 HL_ENABLE_POSTGRES=1 build/test_pg_transport build/test_pg_conn

      - name: run test_pg_transport (LSan leak detection on by default on Linux)
        run: ASAN_OPTIONS=detect_leaks=1 ./build/test_pg_transport

      - name: run test_pg_conn (LSan leak detection on by default on Linux)
        run: ASAN_OPTIONS=detect_leaks=1 ./build/test_pg_conn

  # Real MySQL 8 in Docker: mysql:// DSN -> backend select -> handshake ->
  # parameterized db.exec / db.query (binary prepared statements) -> typed
  # decode; multi-statement migrations; db.async on a worker connection; the
  # DB-backed stdlib (session / outbox / inbox / rbac / audit-log / transaction
  # / insert_if_absent) on the MySQL dialect; and caching_sha2 full-auth over
  # TLS. Self-builds with HL_ENABLE_MYSQL=1; skips cleanly without Docker.
  mysql:
    needs: [classify]
    if: needs.classify.outputs.run_db_mysql == 'true'
    name: MySQL e2e
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: MySQL end-to-end (mysql:8, plaintext + caching_sha2-over-TLS)
        timeout-minutes: 15
        run: make e2e-mysql

      # MariaDB defaults to mysql_native_password; validate the plaintext path
      # against a real MariaDB server (its TLS matrix is a later checkpoint, so
      # SKIP_TLS=1). Sequential: e2e_mysql.sh's EXIT trap removes the shared
      # container before this run recreates it.
      - name: MariaDB end-to-end (plaintext)
        timeout-minutes: 15
        run: MYSQL_IMAGE=mariadb:11 SKIP_TLS=1 make e2e-mysql

  # The MySQL-over-Keel transport unit test (the shared cap/db_transport.c, driven
  # through the MySQL seam) is HL_ENABLE_MYSQL-gated, so the base sanitizer /
  # build jobs do not build it. test_mysql_conn now also drives hl_my_conn_start
  # through that transport (adopt path), so it is HL_ENABLE_MYSQL-gated too and
  # would otherwise be orphaned from the base `make test`. This standing leg builds
  # + runs BOTH under ASan+UBSan with LSan (on by default on Linux), giving durable
  # coverage of the transport's allocation-preservation and descriptor-lifecycle
  # behavior AND the mysql_conn codec / handshake / adopt path so neither can
  # silently regress. Mirrors pg-transport-sanitize.
  mysql-transport-sanitize:
    needs: [classify]
    if: needs.classify.outputs.run_db_mysql == 'true'
    name: mysql_transport ASan/LSan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: build test_mysql_transport + test_mysql_conn under ASan+UBSan (+LSan), MySQL enabled
        run: make DEBUG=1 HL_ENABLE_MYSQL=1 build/test_mysql_transport build/test_mysql_conn

      - name: run test_mysql_transport (LSan leak detection on by default on Linux)
        run: ASAN_OPTIONS=detect_leaks=1 ./build/test_mysql_transport

      - name: run test_mysql_conn (LSan leak detection on by default on Linux)
        run: ASAN_OPTIONS=detect_leaks=1 ./build/test_mysql_conn

  # The Valkey RESP connection now rides the shared cap/db_transport.c (Keel v3;
  # docs/valkey_keel_transport_slice5.md), so test_valkey_conn / test_valkey_backend
  # are HL_ENABLE_VALKEY-gated (moved out of the default suite) - this job is their
  # permanent ASan/LSan home, mirroring pg/mysql-transport-sanitize.
  valkey-conn-sanitize:
    needs: [classify]
    if: needs.classify.outputs.run_db_valkey == 'true'
    name: valkey_conn ASan/LSan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: build test_valkey_conn + test_valkey_backend under ASan+UBSan (+LSan), Valkey enabled
        run: make DEBUG=1 HL_ENABLE_VALKEY=1 build/test_valkey_conn build/test_valkey_backend

      - name: run test_valkey_conn (LSan leak detection on by default on Linux)
        run: ASAN_OPTIONS=detect_leaks=1 ./build/test_valkey_conn

      - name: run test_valkey_backend (LSan leak detection on by default on Linux)
        run: ASAN_OPTIONS=detect_leaks=1 ./build/test_valkey_backend

  # Real Valkey/Redis: kv.open{backend="valkey"} / cache.open over the RESP wire
  # -> get/set/del/exists/TTL/incr/CAS/scan/clear, the borrow-copy guard, and
  # kv/cache namespace isolation, in BOTH runtimes (e2e-valkey, a compiled-in
  # HL_ENABLE_VALKEY=1 hull); then the production --with=valkey compose path,
  # asserting the base stays valkey-free + the kv.dynamic host allowlist +
  # network_outbound sandbox grant (e2e-feature-valkey builds its own base).
  # redis-server from apt (no Docker); the e2e scripts also fall back to Docker.
  valkey:
    needs: [classify]
    if: needs.classify.outputs.run_db_valkey == 'true'
    name: Valkey/Redis e2e
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install redis-server
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          # Ship the daemon disabled; the e2e scripts start their own on a test port.
          sudo systemctl disable --now redis-server || true

      # The e2e-valkey target sub-makes a HL_ENABLE_VALKEY=1 hull itself, so it is
      # a single step: a separate `make HL_ENABLE_VALKEY=1` build step followed by
      # a plain `make e2e-valkey` would flip the build-config fingerprint and the
      # config-sentinel would clean the just-built hull.
      - name: Valkey/Redis end-to-end (compiled-in, both runtimes)
        timeout-minutes: 15
        run: make e2e-valkey

      - name: Valkey/Redis feature compose (--with=valkey)
        timeout-minutes: 15
        run: make e2e-feature-valkey

  analyze:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: Static Analysis
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools cppcheck

      - name: scan-build
        run: make analyze

      - name: cppcheck
        run: make cppcheck

  cosmo:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: Cosmopolitan (APE)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install cosmocc
        run: |
          COSMOCC_DIR=/opt/cosmo make fetch-cosmocc
          echo "/opt/cosmo/bin" >> $GITHUB_PATH

      - name: Build platform (multi-arch)
        run: make platform-cosmo

      - name: Build hull
        run: make CC=cosmocc

      - name: Hardening summary (cosmocc)
        run: make CC=cosmocc hardening

      - name: Unit tests
        timeout-minutes: 5
        run: make test CC=cosmocc

      - name: Sandbox tests (cosmo)
        timeout-minutes: 2
        run: make e2e-sandbox CC=cosmocc

      - name: Example E2E tests
        timeout-minutes: 5
        run: make e2e-examples CC=cosmocc

      - name: Blob storage E2E tests
        timeout-minutes: 2
        run: make e2e-blob CC=cosmocc

      - name: Multipart upload E2E tests
        timeout-minutes: 3
        run: make e2e-multipart CC=cosmocc

      - name: Attachment E2E tests
        timeout-minutes: 2
        run: make e2e-attachment CC=cosmocc

      - name: Compute E2E tests
        timeout-minutes: 2
        run: make e2e-compute CC=cosmocc

      # Regression guard for the exit-256 class: a PRODUCED cosmo app must boot
      # with a populated runtime VFS (require "hull.json" resolves). The strong
      # hl_stdlib_feature_entries() override (build.lua emits it; the seam-
      # hardening change made a MISSING one a link error, not a silent empty VFS)
      # must win over the composition-exempt base. Uses `hull build` (not eject):
      # it is APE-only (the cosmo hull APE drives cosmocc APE -> an app.com APE),
      # so it is immune to this runner's known post-cosmo-build native-ELF-loader
      # corruption (/bin/sh + system cc/ld fail "libc.so.6: failed to map
      # segment") that the eject path's `make` + gen_registry.sh depend on. Placed
      # LAST so it can never skip the real cosmo tests above; the class is also
      # covered end to end by cosmocc-windows-e2e.yml. No prior e2e ran a PRODUCED
      # cosmo app (e2e_compute builds with --cc cc and never runs it).
      - name: Produced cosmo app boots (hull build + hull.json)
        timeout-minutes: 3
        run: |
          set -u
          APP=$(mktemp -d)
          cat > "$APP/app.lua" <<'LUA'
          app.manifest({ modules = { "hull/json@1" } })
          app.main(function(ctx)
              local json = require("hull.json")
              ctx.stdout:write(json.encode({ marker = "COSMO-STDLIB-OK" }) .. "\n")
              return 0
          end)
          LUA
          # The cosmo hull defaults its compiler to cosmocc (no --cc/--compiler
          # needed). This runner's post-cosmo-build native-ELF-loader corruption
          # (compiler probes fail "libc.so.6: failed to map segment") can still
          # defeat the LINK. So: if hull build can't even produce the APE, SKIP
          # (the class is covered end to end by the green cosmocc-windows-e2e.yml);
          # if it DOES produce one, ENFORCE that it boots with a populated runtime
          # VFS - that runtime check (the strong stdlib override winning) is the
          # actual exit-256 regression we guard.
          if ! ./build/hull build "$APP" -o "$APP/app.com" --no-verify-platform; then
            echo "SKIP: hull build could not produce the cosmo APE on this runner"
            echo "      (known post-cosmo native-toolchain corruption); the class"
            echo "      is guarded end to end by cosmocc-windows-e2e.yml."
            exit 0
          fi
          out=$("$APP/app.com" 2>&1); echo "app output: $out"
          echo "$out" | grep -q COSMO-STDLIB-OK \
            || { echo "FAIL: produced cosmo app did not load hull.json"; exit 1; }
          echo "PASS: produced cosmo app booted with a populated runtime VFS"

      # (pure-compute is a build.lua preset on the default composable
      # base, not a pre-built per-flavor lib, so there is no cosmo flavor lib to
      # build here. The `--flavor` preset path is covered on native runners by
      # `make e2e-build-flavor`.)

  gpu:
    needs: [classify]
    if: needs.classify.outputs.run_gpu == 'true'
    name: GPU Compute (macOS Metal)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Fetch wgpu-native
        run: make fetch-wgpu

      - name: Build with GPU
        run: make HL_ENABLE_GPU=1

      - name: Unit tests (GPU)
        timeout-minutes: 5
        run: make test HL_ENABLE_GPU=1

      - name: E2E tests
        timeout-minutes: 2
        run: make e2e HL_ENABLE_GPU=1

      - name: Compute E2E tests
        timeout-minutes: 2
        run: make e2e-compute HL_ENABLE_GPU=1

  duckdb:
    needs: [classify]
    if: needs.classify.outputs.run_db_duckdb == 'true'
    name: DuckDB backend (Linux)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      # fetch-duckdb isolates DuckDB's bundled mbedTLS (objcopy --redefine-syms)
      # so it coexists with Hull's own mbedTLS. This builds the FULL default
      # flavor (HTTP + TLS + DuckDB) to prove the coexistence. See
      # docs/duckdb_backend_design.md §3.4.
      - name: Fetch DuckDB static libs (with mbedTLS symbol isolation)
        run: make fetch-duckdb

      - name: Build with DuckDB (full HTTP/TLS flavor)
        run: make HL_ENABLE_DUCKDB=1

      - name: DuckDB unit tests
        timeout-minutes: 5
        run: |
          make HL_ENABLE_DUCKDB=1 build/test_db_duckdb build/test_db_select build/test_crypto
          ./build/test_db_duckdb
          ./build/test_db_select
          ./build/test_crypto   # Hull's own mbedTLS must stay unaffected by the isolation

      - name: DuckDB feature archive (link-smoke, no --start-group)
        timeout-minutes: 5
        run: |
          set -e
          # Phase 2 of DuckDB-as-a-feature: `make feature-duckdb` bundles the
          # backend + isolated DuckDB static libs into ONE archive. This proves,
          # on Linux/ELF, that the combined archive is self-contained -- linking a
          # harness against ONLY it, with NO -Wl,--start-group, must resolve every
          # DuckDB symbol and run. (The base build still needs --start-group for
          # the separate archives; combining removes that at the composing link.)
          make feature-duckdb
          test -f build/libhull_feature-duckdb.a
          nm build/libhull_feature-duckdb.a | grep -qw hl_db_backend_duckdb
          cc -std=c11 -DHL_ENABLE_DUCKDB -Ivendor/duckdb -Iinclude \
             tests/feature_duckdb_link.c build/libhull_feature-duckdb.a \
             -lstdc++ -ldl -lm -lpthread -o /tmp/feature_duckdb_link
          OUT=$(/tmp/feature_duckdb_link)
          echo "$OUT"
          echo "$OUT" | grep -q "FEATURE DUCKDB LINK OK"

      - name: hull feature command smoke
        timeout-minutes: 2
        run: |
          set -e
          # Phase 3: the `hull feature` command (install/list/uninstall), which
          # fetches libhull_feature-<name>-<arch>.a via the signed release chain.
          # The live install needs a release that publishes the asset (Phase 5),
          # so here we only exercise the offline surface: list + validation.
          ./build/hull feature list | tee /tmp/feat_list.txt
          grep -q duckdb /tmp/feat_list.txt
          # unknown feature => error + non-zero exit
          if ./build/hull feature install nonexistent 2>/tmp/feat_err.txt; then
              echo "expected failure for unknown feature"; exit 1
          fi
          grep -q "unknown feature" /tmp/feat_err.txt

      - name: DuckDB app smoke (duckdb://:memory:)
        timeout-minutes: 2
        run: |
          set -eu
          mkdir -p /tmp/ddbsmoke
          cat > /tmp/ddbsmoke/app.lua <<'EOF'
          app.manifest({ modules = { "hull/db@1" } })
          app.main(function(ctx)
              local d = require("hull.db").default()
              d.exec("CREATE TABLE t (id INTEGER, name VARCHAR)")
              d.exec("INSERT INTO t VALUES (?, ?)", { 7, "alice" })
              local rows = d.query("SELECT id, name FROM t")
              assert(#rows == 1 and rows[1].id == 7 and rows[1].name == "alice", "row mismatch")
              assert(d.backend_name == "duckdb", "backend mismatch")
              local ok = pcall(function() d.query("SELECT * FROM read_csv('/etc/hosts')") end)
              assert(not ok, "external file access was NOT blocked")
              print("DUCKDB SMOKE OK")
              return 0
          end)
          EOF
          # hull runs the app under the full pledge/unveil sandbox and must exit
          # 0 (the sandbox_db_path fix lets DuckDB's :memory: engine run + tear
          # down cleanly). set -e fails the step on a non-zero hull exit; the
          # grep then gates on the in-app asserts (rows, backend routing, and the
          # external-access lockdown).
          ./build/hull -d "duckdb://:memory:" /tmp/ddbsmoke/app.lua > /tmp/ddbsmoke/out.txt 2>&1
          cat /tmp/ddbsmoke/out.txt
          grep -q "DUCKDB SMOKE OK" /tmp/ddbsmoke/out.txt

      - name: DuckDB mode B (fs.read -> allowed_directories, named connection)
        timeout-minutes: 3
        run: |
          set -eu
          # Mode B: a named (db.connect) / dynamic (db.open) DuckDB connection may
          # read files WITHIN the app's declared fs.read dirs (which are unveiled)
          # via read_csv / read_parquet / COPY, under the full pledge/unveil
          # sandbox; reads outside are blocked by the kernel unveil. The named
          # connection opens lazily from app.main -- AFTER the sandbox seals --
          # which spawns DuckDB's worker pool there. That requires the vendor/pledge
          # rseq fix: a thread created post-sandbox must be able to register rseq or
          # glibc aborts ("rseq registration failed"). This gate runs WITHOUT the
          # GLIBC_TUNABLES rseq workaround, so it passes only if that fix holds --
          # i.e. it doubles as the regression test for the pledge patch. The default
          # -d connection opens in phase 6 (pre-sandbox) and stays mode A. §3.2/§6.
          mkdir -p /tmp/ddbmodeb/data
          printf 'id,name\n1,alice\n2,bob\n' > /tmp/ddbmodeb/data/test.csv
          cat > /tmp/ddbmodeb/app.lua <<'EOF'
          app.manifest({
              modules = { "hull/db@1" },
              fs = { read = { "data/*.csv" } },
              databases = { named = { analytics = "duckdb://:memory:" } },
          })
          app.main(function(ctx)
              local d = require("hull.db").connect("analytics")
              local rows = d.query("SELECT id, name FROM read_csv('/tmp/ddbmodeb/data/test.csv')")
              assert(rows and #rows == 2 and rows[1].name == "alice", "declared-dir read failed")
              print("DUCKDB MODE B OK")
              return 0
          end)
          EOF
          if ! ./build/hull /tmp/ddbmodeb/app.lua > /tmp/ddbmodeb/out.txt 2>&1; then
              echo "mode B run failed (exit $?):"
              cat /tmp/ddbmodeb/out.txt
              exit 1
          fi
          cat /tmp/ddbmodeb/out.txt
          grep -q "DUCKDB MODE B OK" /tmp/ddbmodeb/out.txt

  # DuckDB as a composable FEATURE (not compiled into the base). A separate job
  # with a fresh build tree: it builds a BASE hull (no DuckDB) + the feature
  # archive, then `hull build --with=duckdb` an app and runs it. Must not share a
  # tree with the HL_ENABLE_DUCKDB=1 job above (flag-flip object staleness).
  duckdb-feature:
    needs: [classify]
    if: needs.classify.outputs.run_db_duckdb == 'true'
    name: DuckDB feature build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Fetch DuckDB static libs
        run: make fetch-duckdb
      - name: Compose the DuckDB feature into an app binary (e2e)
        timeout-minutes: 15
        run: sh tests/e2e_feature_duckdb.sh

  # GPU (wgpu-native) as a composable FEATURE. Own fresh build tree (the
  # HL_ENABLE_GPU=1 flag flip via `make feature-gpu` cleans the base objects).
  # Build-only: gpu.dispatch needs a physical device CI lacks, so the e2e app
  # branches on gpu.available() and just confirms the composed binary links +
  # boots. The composed binary links -lvulkan; libvulkan-dev provides the link
  # library and pulls in the runtime loader (libvulkan1) so it boots with 0
  # devices. See docs/features_and_flavors.md.
  gpu-feature:
    needs: [classify]
    if: needs.classify.outputs.run_gpu == 'true'
    name: GPU feature build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Install Vulkan loader + dev headers (compose links -lvulkan)
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev
      - name: Fetch wgpu-native static lib
        run: make fetch-wgpu
      - name: Compose the GPU feature into an app binary (e2e)
        timeout-minutes: 15
        run: sh tests/e2e_feature_gpu.sh

  # TUI as a composable FEATURE. Own fresh build tree. Builds a TUI-free base
  # (EMBED_PLATFORM=1 HL_ENABLE_TUI=0) + the tui feature archive, then
  # `hull build --with=tui` an app and boots it (asserts hull.tui registered).
  # Pure C, no vendored lib and no extra link libs, so no install step.
  tui-feature:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: TUI feature build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Compose the TUI feature into an app binary (e2e)
        timeout-minutes: 15
        run: sh tests/e2e_feature_tui.sh

  postgres-feature:
    needs: [classify]
    if: needs.classify.outputs.run_db_postgres == 'true'
    name: Postgres feature build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Compose the Postgres feature into an app binary (e2e)
        timeout-minutes: 15
        run: sh tests/e2e_feature_postgres.sh

  mysql-feature:
    needs: [classify]
    if: needs.classify.outputs.run_db_mysql == 'true'
    name: MySQL feature build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Compose the MySQL feature into an app binary (e2e)
        timeout-minutes: 15
        run: sh tests/e2e_feature_mysql.sh

  # The shared SQL-wire transport (cap/db_transport.c) composed by BOTH DB
  # features at once, in both --with orders, resolving exactly one impl
  # (docs/db_transport_extraction.md). Mapped to db-postgres: cap/db_transport.c
  # is in DB_SHARED_FILES, which fans out to every DB backend fact (incl.
  # db_postgres_changed), so a change to it sets run_db_postgres and triggers this.
  db-shared-feature:
    needs: [classify]
    if: needs.classify.outputs.run_db_postgres == 'true'
    name: Shared DB transport (both features)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Compose postgres + mysql together and assert one shared transport (e2e)
        timeout-minutes: 20
        run: sh tests/e2e_feature_db_shared.sh

  # The JS-less side of the project-discovery lifecycle, on its OWN clean
  # RUNTIME=lua build (QuickJS + the JS frontend dropped). The recipe pins HULL_E2E_EXPECT_JS=0,
  # so this job FAILS if JavaScript is somehow analyzable here - the JS-less branch can never
  # silently skip. The analyzable side is pinned (EXPECT_JS=1) in the main `build` job's step.
  project-discovery-lua:
    needs: [classify]
    if: needs.classify.outputs.run_web == 'true'
    name: Project source-discovery E2E (lua-only, JS unavailable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: JS-less lifecycle (RUNTIME=lua, expect JS not analyzable)
        timeout-minutes: 10
        run: make e2e-project-discovery-lua

  coverage:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: Code Coverage
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Generate coverage
        timeout-minutes: 10
        run: make coverage

      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-report
          path: build/coverage/html/

  lint:
    name: Lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck

      - name: Lua lint
        run: make lint-lua

      # #334: guard the hand-authored (memory i64) span fixture against silent
      # drift -- recompile spanread64.wat with wat2wasm --enable-memory64 and
      # verify its SHA-256 matches the committed spanread64.wasm + the pin in the
      # build script. A .wat edit without regenerating (or a wat2wasm encoding
      # change) fails here loudly.
      - name: Memory64 span fixture drift check
        run: sudo apt-get install -y wabt && sh tests/fixtures/compute/build_spanread64.sh

      - name: Install Biome
        run: npm install -g @biomejs/biome@1.9.4

      - name: JS lint
        run: make lint-js

      - name: Compute-SDK header canonical-copy check (#331)
        run: make check-sdk-headers

      - name: Compute-SDK header check self-test (negative) (#331)
        run: make check-sdk-headers-selftest

      - name: Documentation-integrity gate
        run: make check-docs-integrity

      - name: Documentation-integrity self-test (negative)
        run: make check-docs-integrity-selftest

      - name: No-em-dash gate (living prose, H1/S5)
        run: make check-no-emdash

      - name: No-em-dash self-test (negative)
        run: make check-no-emdash-selftest

      - name: No-new-milestone-narration gate (H1/S5)
        run: make check-no-milestone-narration

      - name: No-new-milestone-narration self-test (negative)
        run: make check-no-milestone-narration-selftest

      - name: Site-consistency gate (version + install tabs)
        run: make check-site-consistency

      - name: Site-consistency self-test (negative)
        run: make check-site-consistency-selftest

  htmx-browser:
    needs: [classify]
    if: needs.classify.outputs.run_web == 'true'
    name: HTMX browser tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build
        run: make

      # Cache playwright + chromium across runs (large download, ~150 MB).
      # Key on the playwright pin from the test script so a version bump
      # auto-invalidates. PLAYWRIGHT_BROWSERS_PATH points into the cache.
      - name: Cache Playwright + Chromium
        uses: actions/cache@v4
        with:
          path: tests/.playwright
          key: playwright-${{ runner.os }}-v1.48.0

      - name: HTMX browser E2E (dev)
        timeout-minutes: 6
        run: make e2e-htmx-playwright

      # Same suite, but against `hull build` standalone binaries -
      # exercises the embedded-VFS code path. Needs hull rebuilt
      # with EMBED_PLATFORM=1, which we do inline so the
      # MODE=dev step above still gets the lighter binary.
      #
      # EMBED_PLATFORM=1 MUST carry to ALL THREE makes: the build config
      # sentinel (Makefile ~1849) fingerprints EMBED_PLATFORM, so a make that
      # omits it flips the fingerprint back, PURGES the embedded hull, and
      # rebuilds it NON-embedded - which then trips the target's own
      # "hull built without embedded platform" guard. (A flagless third make
      # was the deterministic HTMX-build failure on both Linux and macOS.)
      - name: HTMX browser E2E (build mode)
        timeout-minutes: 8
        env:
          EMBED_PLATFORM: "1"
        run: |
          make platform
          make
          make e2e-htmx-playwright-build

      # On failure either suite writes playwright traces + final-state
      # screenshots under build/playwright-artifacts/. Upload them so
      # the diff between "test failed in CI" and "test failed for me
      # locally" disappears - `npx playwright show-trace trace.zip`
      # opens an interactive timeline (network log, DOM snapshots,
      # console events, screenshots per action).
      - name: Upload playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: htmx-playwright-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/playwright-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  benchmark:
    needs: [classify]
    name: Benchmark (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && needs.classify.outputs.run_core_common == 'true'

    strategy:
      matrix:
        runtime: [lua, js]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Build
        run: make

      - name: Benchmark
        run: RUNTIME=${{ matrix.runtime }} DURATION=5s CONNECTIONS=50 THREADS=2 sh bench/bench.sh

      - name: Template Benchmark
        run: RUNTIME=${{ matrix.runtime }} DURATION=5s CONNECTIONS=50 THREADS=2 sh bench/bench_template.sh

  # ── libhull reference embedders (L-5) ──
  # Prove the hl_embed_* C ABI is consumable from a foreign language. Each job
  # links libhull.a + Keel and runs examples/embed_{rust,zig} through the ABI.
  # The make target skips when the toolchain is absent, so we assert it actually
  # ran (grep for the OK line) rather than silently pass.
  embed-rust:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: libhull embedder (Rust)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Rust toolchain
        run: rustc --version && cargo --version   # preinstalled on GitHub runners

      - name: Run Rust reference embedder
        run: |
          out=$(make embed-rust-smoke 2>&1); echo "$out"
          echo "$out" | grep -q "embed-rust-smoke: OK" \
            || { echo "::error::embed_rust did not run to completion"; exit 1; }

  embed-zig:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: libhull embedder (Zig)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install Zig 0.13.0
        run: |
          set -eu
          # --retry-all-errors also retries a partial transfer (curl exit 18),
          # the observed ziglang.org download flake.
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            -o /tmp/zig.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"

      - name: Zig version
        run: zig version

      - name: Run Zig reference embedder
        run: |
          out=$(make embed-zig-smoke 2>&1); echo "$out"
          echo "$out" | grep -q "embed-zig-smoke: OK" \
            || { echo "::error::embed_zig did not run to completion"; exit 1; }

  musl:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    name: musl (Alpine)
    runs-on: ubuntu-24.04
    # A plain ubuntu runner (not container: alpine) so actions/checkout keeps
    # working - GitHub's node runs on the glibc host. tests/e2e_musl.sh detects
    # the non-musl host and re-execs itself inside an alpine:3.20 container,
    # building hull under musl and running emit-path compute + HTTP apps.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: recursive

      - name: Build + emit/run E2E under musl (Docker Alpine)
        run: sh tests/e2e_musl.sh

  # -- applicability-aware result gate (docs/ci_architecture_design.md section 16).
  # `if: always()` makes it EVALUATE; scripts/ci/ci_gate.py decides pass/fail. It
  # depends on EVERY job (check_gate_completeness.py enforces that in `classify`),
  # requires each to succeed, and permits ONLY a declared-inapplicable skip - in
  # A push-only `benchmark` job on a PR. This job is NOT yet a
  # required status check; making it one is a separate, explicitly authorized
  # branch-protection step. --
  ci-success:
    name: CI success (applicability-aware gate)
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - classify
      - build
      - wamrc-x86_64
      - wamrc-artifact-verify
      - wasm-readonly-heap-aot
      - mapped-span-bench
      - compute-aot-shared-heap
      - compute-memops-freestanding
      - stream-meta
      - spans-example
      - spans-multi
      - spans-hugefile
      - wasm-guarded-aot-arm64
      - flavors
      - reproducibility
      - reproducibility-container
      - reproducibility-container-interleave
      - reproducibility-cosmo
      - reproducibility-cosmo-compare
      - build-pipeline
      - sanitizers
      - msan
      - tsan
      - tsan-shared-heap
      - fuzz-core-security
      - fuzz-db-wire
      - fuzz-compute-span
      - fuzz-lua-source
      - fuzz-js-source
      - focused-js-frontend
      - focused-lua-frontend
      - postgres
      - pg-transport-sanitize
      - mysql
      - mysql-transport-sanitize
      - valkey
      - valkey-conn-sanitize
      - analyze
      - cosmo
      - gpu
      - duckdb
      - duckdb-feature
      - gpu-feature
      - tui-feature
      - postgres-feature
      - mysql-feature
      - db-shared-feature
      - project-discovery-lua
      - coverage
      - lint
      - htmx-browser
      - benchmark
      - embed-rust
      - embed-zig
      - musl
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Evaluate required job results
        env:
          # A matrix job exposes ONE aggregate result here; ci_gate.py handles it.
          NEEDS_JSON: ${{ toJSON(needs) }}
          PLAN: ${{ needs.classify.outputs.plan_json }}
          EVENT: ${{ github.event_name }}
        run: |
          printf '%s' "$NEEDS_JSON" > needs.json
          # Allow-skip is DERIVED from the classifier plan via scripts/ci/job_plan.py
          # - the SAME map the job `if:` conditions use, so the gate and the skips
          # cannot disagree. A job whose group is inapplicable may skip; everything
          # else (and `classify`) must succeed. benchmark (push-only) may skip on
          # non-push.
          python3 scripts/ci/ci_gate.py --needs needs.json \
            --plan "$PLAN" --event "$EVENT" --require-present classify

