name: CI

on:
  push:
    branches: [main]
    # Site / docs / changelog updates don't touch any C, Lua, JS, Makefile,
    # or workflow surface that CI validates — skip the full build matrix
    # for those. deploy-site.yml handles site/** independently.
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'LICENSING.md'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'LICENSING.md'
      - '**.md'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Linux (clang)
            os: ubuntu-24.04
            cc: clang
          - name: Linux (aarch64)
            os: ubuntu-24.04-arm
          - name: macOS
            os: macos-15

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc || 'cc' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build
        run: make

      - name: Hardening summary
        run: make hardening

      - name: Hardening verification (release flags present)
        timeout-minutes: 1
        run: make check-hardening

      - name: Unit tests
        timeout-minutes: 5
        run: make test

      - name: E2E tests
        timeout-minutes: 2
        run: make e2e

      - name: Blob storage E2E tests
        timeout-minutes: 2
        run: make e2e-blob

      - name: Multipart upload E2E tests
        timeout-minutes: 3
        run: make e2e-multipart

      - name: Attachment E2E tests
        timeout-minutes: 2
        run: make e2e-attachment

      - name: Hypermedia entry upload E2E tests
        timeout-minutes: 2
        run: make e2e-hypermedia-photos-upload

      - name: JWT asymmetric verify E2E tests
        timeout-minutes: 2
        run: make e2e-jwt-asym

      - name: OIDC OAuth flow E2E tests
        timeout-minutes: 3
        run: make e2e-oauth

      - name: Install zbar (for TOTP + QR e2e)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install zbar
          else
            sudo apt-get update && sudo apt-get install -y zbar-tools
          fi

      - name: TOTP + QR round-trip E2E tests
        timeout-minutes: 3
        run: make e2e-totp

      - name: Auth flows E2E tests
        timeout-minutes: 3
        run: make e2e-auth-flows

      - name: Auth flows + TOTP 2FA composition E2E tests
        timeout-minutes: 3
        run: make e2e-auth-flows-2fa

      - name: Auth flows hardening (resend / lockout / revoke / pwned) E2E
        timeout-minutes: 3
        run: make e2e-auth-flows-hardening

      - name: Sign-in events + device management E2E
        timeout-minutes: 3
        run: make e2e-sign-in-events

      - name: Sandbox tests
        timeout-minutes: 2
        run: make e2e-sandbox

      - name: Example E2E tests
        timeout-minutes: 5
        run: make e2e-examples

      - name: Compute E2E tests
        timeout-minutes: 2
        run: make e2e-compute

      - name: Named-connection async/udf E2E tests
        timeout-minutes: 2
        run: make e2e-named-connections

      - name: Dynamic-connection (db.open) E2E tests
        timeout-minutes: 2
        run: make e2e-dynamic-connections

      - name: TCC E2E tests
        timeout-minutes: 3
        run: make e2e-tcc

      - name: Build-flavor E2E tests
        timeout-minutes: 6
        run: make e2e-build-flavor

      - name: Install + completions E2E tests
        timeout-minutes: 2
        run: make e2e-install

      - name: CA bundle E2E tests
        timeout-minutes: 2
        run: make e2e-ca-bundle

      - name: Update E2E tests
        timeout-minutes: 2
        run: make e2e-update

      - name: hull test (examples)
        timeout-minutes: 2
        run: make hull-test-examples

  # Reproducibility gate. Three properties tested independently on
  # both Linux and macOS via matrix strategy:
  #
  #   1. Self-build (bootstrap): hull can build hull2 can build hull3.
  #      Proves the build pipeline produces working binaries that can
  #      themselves produce working binaries.
  #
  #   2. Hull-itself reproducibility: `make` from a clean tree
  #      produces a byte-identical `build/hull` between runs. Gates
  #      MANIFESTO's "same source = same binary" claim at the runtime
  #      level (not just for apps `hull build` produces).
  #
  #   3. Hull-build reproducibility: `hull build` produces byte-
  #      identical outputs for the same input. Build the same fixture
  #      twice to the SAME output path. (macOS ld64 hashes the output
  #      path into LC_UUID; same-path isolates the question we
  #      actually care about: link output stability for fixed
  #      inputs. See Makefile comment on the target.)
  # Build the documented HL_ENABLE_* flavor combinations and smoke-test each.
  # The default `build` job only covers the all-on flavor; without this, a
  # reference to a feature-gated symbol from an always-compiled TU (e.g. a
  # tool binding calling an HTTP-server-only hl_agent_*/hl_dev_state_*) would
  # only break the flavor link, which nothing else exercises.
  flavors:
    name: Build flavor (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client-only / CLI (no http server)
            flags: HL_ENABLE_HTTP_SERVER=0
          - name: server-only (no http client)
            flags: HL_ENABLE_HTTP_CLIENT=0
          - name: compute-only (no db)
            flags: HL_ENABLE_DB=0
          # pure-compute: both HTTP halves off, so mbedTLS is dropped entirely.
          # Core hashing (crypto.c, release_io.c, sbom.c, verify_self.c) runs on
          # the cap layer's self-contained SHA-256 + hand-rolled SHA-1, and HMAC
          # routes through the portable backend. This flavor proves none of that
          # silently regressed back onto an mbedTLS symbol.
          - name: pure-compute (no http at all)
            flags: HL_ENABLE_HTTP=0
          # PostgreSQL backend on top of SQLite: links the pure-C wire client
          # (cap/pgwire.c, cap/pg_conn.c, cap/db_postgres.c) + the shared TLS
          # client into the full binary. Guards the POSTGRES=1 link + the
          # HL_LINK_TLS gating.
          - name: sqlite + postgres
            flags: HL_ENABLE_POSTGRES=1
          # Postgres-only: SQLite dropped entirely. Proves the SQLite-specific
          # code (cap/db.c engine, db.udf bindings, agent DB introspection,
          # the hl_db_sqlite_* accessors) is gated on HL_ENABLE_SQLITE and the
          # backend selector / worker / migration runner have no residual hard
          # dependency on the SQLite backend TU.
          - name: postgres-only (no sqlite)
            flags: HL_ENABLE_SQLITE=0 HL_ENABLE_POSTGRES=1
          # MySQL / MariaDB backend (Phase 1 skeleton): guards the HL_ENABLE_MYSQL
          # link + HL_LINK_TLS gating + the selector registration so the backend
          # keeps building as the wire protocol lands.
          - name: sqlite + mysql
            flags: HL_ENABLE_MYSQL=1
          - name: mysql-only (no sqlite)
            flags: HL_ENABLE_SQLITE=0 HL_ENABLE_MYSQL=1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build
        run: make ${{ matrix.flags }}

      # Guards the link-regression class (a feature-gated symbol referenced
      # from an always-compiled TU): the build step above is the real link
      # check; `hull version` confirms the binary starts.
      - name: Smoke (binary links + starts)
        timeout-minutes: 1
        run: ./build/hull version

      # Exercises the runtime entry path (serve_cli.c for HL_ENABLE_HTTP_SERVER=0,
      # serve.c otherwise), including the kernel sandbox, so a Linux-only crash
      # like the serve_cli.c missing-phase-1-pledge SIGABRT can't regress.
      - name: Smoke (app.main runs, return code propagates)
        timeout-minutes: 1
        run: |
          tmp="$(mktemp -d)"
          cat > "$tmp/app.lua" <<'LUA'
          app.manifest({ name = "flavor-smoke" })
          app.main(function(ctx) return 7 end)
          LUA
          set +e
          ./build/hull "$tmp/app.lua" >"$tmp/out.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 7 ]; then
            echo "expected exit 7, got $rc; hull output:"
            cat "$tmp/out.log"
            exit 1
          fi

  reproducibility:
    name: Reproducible build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Build hull
        timeout-minutes: 5
        run: make
      - name: Self-build chain (hull -> hull2 -> hull3)
        timeout-minutes: 5
        run: make self-build
      - name: Hull-itself reproducibility (make twice, then cmp)
        timeout-minutes: 10
        run: |
          set -eu
          cp build/hull /tmp/hull-rep-1
          make clean
          make
          if cmp -s /tmp/hull-rep-1 build/hull; then
            echo "PASS: build/hull is byte-identical across rebuilds ($(wc -c < build/hull) bytes)"
          else
            echo "FAIL: build/hull differs between rebuilds"
            shasum -a 256 /tmp/hull-rep-1 build/hull
            exit 1
          fi
      - name: Reproducibility (hull build byte-identical, same output path)
        timeout-minutes: 5
        run: make reproducible-check

  # Reproducible build inside the registry-less, snapshot-pinned container
  # (roadmap 0.3.1). Proves the containerized toolchain yields a byte-identical
  # hull across a clean rebuild, and exercises the whole mechanism (base-image
  # digest pin + apt snapshot pin + baked SHA-pinned cosmocc) that the Linux and
  # cosmo release jobs will adopt. This is what makes "reproducible across time"
  # hold indefinitely for the Linux artifacts, not just within the runner's
  # major-version window. macOS is intentionally excluded: no container touches
  # the macos-15 Xcode runner. See docs/security.md "Build-environment
  # immutability" and .github/docker/README.md.
  reproducibility-container:
    name: Reproducible build (Linux container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Build twice in the reproducible container and cmp
        uses: ./.github/actions/hull-build-container
        with:
          run: |
            make
            cp build/hull /tmp/hull-c1
            make clean
            make
            if cmp -s /tmp/hull-c1 build/hull; then
              echo "PASS: containerized build byte-identical across rebuilds ($(wc -c < build/hull) bytes)"
            else
              echo "FAIL: containerized build differs between rebuilds"
              sha256sum /tmp/hull-c1 build/hull
              exit 1
            fi

  # Proves the release build-native interleaving: build hull inside the
  # container as the runner user (user: host), then on the HOST run the produced
  # binary and write alongside it in build/. release.yml's Platform-sig E2E does
  # exactly this (host-side keygen/sign into build/ + running the freshly built
  # hull), and release.yml is tag-only so it cannot be exercised on a PR. This
  # job is the PR-validatable proxy for that ownership + run path. Roadmap 0.3.1.
  reproducibility-container-interleave:
    name: Reproducible build (Linux container, host interleave)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Build hull in-container as the runner user
        uses: ./.github/actions/hull-build-container
        with:
          user: host
          run: make
      - name: Host runs the container-built binary and writes into build/
        run: |
          set -eu
          ./build/hull version
          # build/ must be host-writable (user: host), exactly as the release
          # Platform-sig E2E requires when it does keygen/sign into build/.
          touch build/interleave-probe
          test -f build/interleave-probe
          echo "PASS: host ran the container-built hull and wrote into build/"

  # Cosmo APE byte-reproducibility (roadmap 0.3.7). The reproducibility job
  # above builds twice in ONE job and cmps; that pattern can't be used for
  # cosmo because a second `make platform-cosmo` in one job corrupts the
  # dynamic loader. So build hull-cosmo on two independent runners (each does
  # exactly one platform-cosmo build) and byte-compare the artifacts in a
  # third job. This tests cross-runner reproducibility and verifies the
  # "Cosmopolitan produces deterministic output" claim (docs/security.md) for
  # the hull-cosmo release binary itself.
  reproducibility-cosmo:
    name: Reproducible build (Cosmo ${{ matrix.n }})
    strategy:
      fail-fast: false
      matrix:
        n: [a, b]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      # Build inside the snapshot-pinned reproducible container (roadmap 0.3.1).
      # cosmocc is baked into the image, so there is no fetch step. One
      # `make platform-cosmo` per job: the a/b split exists because a second
      # cosmo platform build in one job corrupts the loader.
      - name: Build hull-cosmo in the reproducible container
        uses: ./.github/actions/hull-build-container
        with:
          run: |
            make platform-cosmo
            make CC=cosmocc
      - name: Upload hull-cosmo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hull-cosmo-repro-${{ matrix.n }}
          path: build/hull
          if-no-files-found: error

  reproducibility-cosmo-compare:
    name: Reproducible build (Cosmo compare)
    needs: reproducibility-cosmo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
      - name: Byte-compare the two independent cosmo builds
        run: |
          set -eu
          A=artifacts/hull-cosmo-repro-a/hull
          B=artifacts/hull-cosmo-repro-b/hull
          ls -la "$A" "$B"
          if cmp -s "$A" "$B"; then
            echo "PASS: hull-cosmo is byte-identical across independent runners ($(wc -c < "$A") bytes)"
          else
            echo "::error::hull-cosmo differs between builds; the cosmo APE is not byte-reproducible"
            sha256sum "$A" "$B"
            echo "--- first differing bytes ---"
            cmp -l "$A" "$B" | head -20 || true
            exit 1
          fi

  build-pipeline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15

    name: Build Pipeline (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build pipeline E2E tests
        timeout-minutes: 10
        run: make e2e-build

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build and test with sanitizers
        timeout-minutes: 10
        run: |
          make clean
          make DEBUG=1 test

  msan:
    name: MSan + UBSan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: MSan test
        # Bumped from 10 → 15 min in round-8. The crypto-heavy auth-
        # stack unit tests (TOTP enrollment / PBKDF2 verify) plus the
        # round-8 additions push the total MSan runtime past 10 min on
        # GitHub's shared runners. Bumping the cap is cheaper than
        # cutting test coverage; PBKDF2 isn't going to get faster.
        timeout-minutes: 15
        run: make msan

  tsan:
    name: TSan (worker pool)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: TSan test (worker-pool / shared-state paths)
        # ThreadSanitizer over the suites that spin worker threads: the
        # WASM compute worker (cap/wasm.c + worker_wasm.c, home of the
        # shared-segment vs in-flight-async-call fix) and both thread-pool
        # async backends (Keel-backed + poll). Guards against a regression
        # of the inflight_async use-after-free fix and any future race in
        # the worker handoff shared by db.async / compute.async / gpu.async.
        timeout-minutes: 15
        run: make CC=clang tsan

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build fuzz targets
        run: make fuzz CC=clang

      - name: Fuzz sh_json (60s)
        # Parses untrusted request-body / config JSON. ASan + UBSan over
        # 60s of libFuzzer; a crash writes crash-<sha> and fails the job.
        timeout-minutes: 3
        run: ./fuzz/fuzz_sh_json fuzz/corpus_sh_json/ -max_total_time=60

      - name: Fuzz path_normalize (60s)
        # require()/import() path canonicaliser — a .. escape or OOB write
        # is a sandbox-traversal primitive.
        timeout-minutes: 3
        run: ./fuzz/fuzz_path_normalize fuzz/corpus_path_normalize/ -max_total_time=60

      - name: Fuzz mime_sniff (60s)
        # Magic-byte / shape sniffer over the first ~4 KiB of untrusted stored
        # upload bytes — an over-read past len is a crash / info-leak.
        timeout-minutes: 3
        run: ./fuzz/fuzz_mime_sniff fuzz/corpus_mime_sniff/ -max_total_time=60

      - name: Fuzz host_match (60s)
        # Host-allowlist matcher: glob + CIDR (inet_pton / bit compare) over
        # attacker-influenced allowlist patterns and hosts (dynamic DB conns).
        timeout-minutes: 3
        run: ./fuzz/fuzz_host_match fuzz/corpus_host_match/ -max_total_time=60

      - name: Fuzz pgwire (60s)
        # PostgreSQL v3 wire-protocol reader over untrusted server bytes. The
        # bounds-checked framing / cursor is the trust boundary for a
        # malicious or MITM'd Postgres; an OOB read is an info-leak / crash.
        timeout-minutes: 3
        run: ./fuzz/fuzz_pgwire fuzz/corpus_pgwire/ -max_total_time=60

      - name: Fuzz pg_dsn (60s)
        # DSN parser: percent-decoding + bounded field splitting over a
        # user-supplied connection string.
        timeout-minutes: 3
        run: ./fuzz/fuzz_pg_dsn fuzz/corpus_pg_dsn/ -max_total_time=60

      - name: Fuzz pg_rewrite (60s)
        # ?-to-$n placeholder rewriter: literal / comment / dollar-quote-aware
        # SQL scan. A miscount or OOB write here corrupts the parameterized
        # query the app sends.
        timeout-minutes: 3
        run: ./fuzz/fuzz_pg_rewrite fuzz/corpus_pg_rewrite/ -max_total_time=60

      - name: Fuzz mysqlwire (60s)
        # MySQL/MariaDB wire reader over untrusted server bytes: bounds-checked
        # framing + length-encoded int/string cursor is the trust boundary for a
        # malicious or MITM'd MySQL. An OOB read is an info-leak / crash.
        timeout-minutes: 3
        run: ./fuzz/fuzz_mysqlwire fuzz/corpus_mysqlwire/ -max_total_time=60

      - name: Fuzz mysql_dsn (60s)
        # MySQL/MariaDB DSN parser: percent-decoding + bounded field splitting
        # over a user-supplied connection string.
        timeout-minutes: 3
        run: ./fuzz/fuzz_mysql_dsn fuzz/corpus_mysql_dsn/ -max_total_time=60

  # End-to-end against a real PostgreSQL 16 (started in Docker by the script).
  # Exercises the whole path the unit tests can't: DSN -> SCRAM-SHA-256 auth
  # (plaintext + TLS via a self-signed cert) -> parameterized query + typed
  # decode -> startup migrations (multi-statement, simple-query path) ->
  # db.async on a worker connection -> the DB-backed stdlib (session / outbox
  # / auth-health) on Postgres. The script self-builds with
  # HL_ENABLE_POSTGRES=1 and skips cleanly if Docker is unavailable.
  postgres:
    name: PostgreSQL e2e
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: PostgreSQL end-to-end
        timeout-minutes: 15
        run: make e2e-postgres

  # Real MySQL 8 in Docker: mysql:// DSN -> backend select -> handshake ->
  # parameterized db.exec / db.query (binary prepared statements) -> typed
  # decode; multi-statement migrations; db.async on a worker connection; the
  # DB-backed stdlib (session / outbox / inbox / rbac / audit-log / transaction
  # / insert_if_absent) on the MySQL dialect; and caching_sha2 full-auth over
  # TLS. Self-builds with HL_ENABLE_MYSQL=1; skips cleanly without Docker.
  mysql:
    name: MySQL e2e
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: MySQL end-to-end
        timeout-minutes: 15
        run: make e2e-mysql

  analyze:
    name: Static Analysis
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools cppcheck

      - name: scan-build
        run: make analyze

      - name: cppcheck
        run: make cppcheck

  cosmo:
    name: Cosmopolitan (APE)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install cosmocc
        run: |
          COSMOCC_DIR=/opt/cosmo make fetch-cosmocc
          echo "/opt/cosmo/bin" >> $GITHUB_PATH

      - name: Build platform (multi-arch)
        run: make platform-cosmo

      - name: Build hull
        run: make CC=cosmocc

      - name: Hardening summary (cosmocc)
        run: make CC=cosmocc hardening

      - name: Unit tests
        timeout-minutes: 5
        run: make test CC=cosmocc

      - name: Sandbox tests (cosmo)
        timeout-minutes: 2
        run: make e2e-sandbox CC=cosmocc

      - name: Example E2E tests
        timeout-minutes: 5
        run: make e2e-examples CC=cosmocc

      - name: Blob storage E2E tests
        timeout-minutes: 2
        run: make e2e-blob CC=cosmocc

      - name: Multipart upload E2E tests
        timeout-minutes: 3
        run: make e2e-multipart CC=cosmocc

      - name: Attachment E2E tests
        timeout-minutes: 2
        run: make e2e-attachment CC=cosmocc

      - name: Compute E2E tests
        timeout-minutes: 2
        run: make e2e-compute CC=cosmocc

      # Cosmo per-flavor coverage: build the dual-arch pure-compute flavor
      # platform libs and verify both arch archives are produced. This is the
      # cosmo-specific deliverable -- the `platform-cosmo-%` pattern rule with
      # per-flavor HL_ENABLE_* flags and the .aarch64/ apelink staging.
      #
      # We deliberately do NOT run `hull build --flavor` end-to-end here. After
      # this flavor platform build, the cosmo toolchain leaves the dynamic
      # loader unable to mmap libc.so.6, so any subsequent shell-out to a system
      # compiler dies with "failed to map segment from shared object" (disk and
      # RAM are abundant -- it is not a resource limit, and it reproduces on a
      # fresh runner doing a single build). The structurally-identical
      # `platform-cosmo` build above does not trip it because nothing shells out
      # to a compiler after it. The `hull build --flavor` + `--flavor=auto`
      # end-to-end path is covered on native runners by `make e2e-build-flavor`.
      # Run this last: it `make clean`s build/ (clobbering the cosmo hull).
      - name: Build-flavor libs (cosmo)
        timeout-minutes: 20
        run: |
          make platform-cosmo-pure-compute
          for arch in x86_64 aarch64; do
            f="build/libhull_platform-pure-compute.${arch}-cosmo.a"
            [ -s "$f" ] || { echo "missing flavor lib: $f"; exit 1; }
            head -c 8 "$f" | grep -q '^!<arch>' || { echo "not an ar archive: $f"; exit 1; }
          done
          echo "cosmo pure-compute flavor libs built + verified (both arches)"

  gpu:
    name: GPU Compute (macOS Metal)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Fetch wgpu-native
        run: make fetch-wgpu

      - name: Build with GPU
        run: make HL_ENABLE_GPU=1

      - name: Unit tests (GPU)
        timeout-minutes: 5
        run: make test HL_ENABLE_GPU=1

      - name: E2E tests
        timeout-minutes: 2
        run: make e2e HL_ENABLE_GPU=1

      - name: Compute E2E tests
        timeout-minutes: 2
        run: make e2e-compute HL_ENABLE_GPU=1

  duckdb:
    name: DuckDB backend (Linux)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      # fetch-duckdb isolates DuckDB's bundled mbedTLS (objcopy --redefine-syms)
      # so it coexists with Hull's own mbedTLS. This builds the FULL default
      # flavor (HTTP + TLS + DuckDB) to prove the coexistence. See
      # docs/duckdb_backend_design.md §3.4.
      - name: Fetch DuckDB static libs (with mbedTLS symbol isolation)
        run: make fetch-duckdb

      - name: Build with DuckDB (full HTTP/TLS flavor)
        run: make HL_ENABLE_DUCKDB=1

      - name: DuckDB unit tests
        timeout-minutes: 5
        run: |
          make HL_ENABLE_DUCKDB=1 build/test_db_duckdb build/test_db_select build/test_crypto
          ./build/test_db_duckdb
          ./build/test_db_select
          ./build/test_crypto   # Hull's own mbedTLS must stay unaffected by the isolation

      - name: DuckDB app smoke (duckdb://:memory:)
        timeout-minutes: 2
        run: |
          set -eu
          mkdir -p /tmp/ddbsmoke
          cat > /tmp/ddbsmoke/app.lua <<'EOF'
          app.manifest({ modules = { "hull/db@1" } })
          app.main(function(ctx)
              local d = require("hull.db").default()
              d.exec("CREATE TABLE t (id INTEGER, name VARCHAR)")
              d.exec("INSERT INTO t VALUES (?, ?)", { 7, "alice" })
              local rows = d.query("SELECT id, name FROM t")
              assert(#rows == 1 and rows[1].id == 7 and rows[1].name == "alice", "row mismatch")
              assert(d.backend_name == "duckdb", "backend mismatch")
              local ok = pcall(function() d.query("SELECT * FROM read_csv('/etc/hosts')") end)
              assert(not ok, "external file access was NOT blocked")
              print("DUCKDB SMOKE OK")
              return 0
          end)
          EOF
          # hull runs the app under the full pledge/unveil sandbox and must exit
          # 0 (the sandbox_db_path fix lets DuckDB's :memory: engine run + tear
          # down cleanly). set -e fails the step on a non-zero hull exit; the
          # grep then gates on the in-app asserts (rows, backend routing, and the
          # external-access lockdown).
          ./build/hull -d "duckdb://:memory:" /tmp/ddbsmoke/app.lua > /tmp/ddbsmoke/out.txt 2>&1
          cat /tmp/ddbsmoke/out.txt
          grep -q "DUCKDB SMOKE OK" /tmp/ddbsmoke/out.txt

      - name: DuckDB mode B rseq diagnostic (baseline vs rseq-disabled)
        timeout-minutes: 3
        run: |
          set -u
          # DIAGNOSTIC, not a gate. Run 1 of this probe already proved the mode-B
          # abort is NOT file I/O: hull dies with "Fatal glibc error: rseq
          # registration failed" at DuckDB's worker-pool spawn, BEFORE read_csv
          # runs. Root cause: vendor/pledge stubs rseq (+ openat2/statx/clone3/
          # memfd_create) to ENOSYS via SECCOMP_RET_ERRNO (a compat shim, no SIGSYS
          # log). glibc 2.39 registers rseq on the main thread pre-sandbox; a worker
          # thread created AFTER the sandbox seals gets ENOSYS and glibc treats the
          # inconsistency as fatal. Mode A works only because the default -d
          # connection opens in phase 6 (pre-sandbox). See §6.
          #
          # This run adds attempt 2 with GLIBC_TUNABLES=glibc.pthread.rseq=0, which
          # disables glibc rseq usage process-wide so post-sandbox threads never
          # register it. If attempt 2 gets past the abort we learn whether read_csv
          # then WORKS (rseq was the only wall -> mode B viable with an rseq fix) or
          # hits a FURTHER wall (the real file blocker, finally reached).
          mkdir -p /tmp/ddbmodeb/data
          printf 'id,name\n1,alice\n2,bob\n' > /tmp/ddbmodeb/data/test.csv
          cat > /tmp/ddbmodeb/app.lua <<'EOF'
          app.manifest({
              modules = { "hull/db@1" },
              fs = { read = { "data/*.csv" } },
              databases = { named = { analytics = "duckdb://:memory:" } },
          })
          app.main(function(ctx)
              local d = require("hull.db").connect("analytics")
              local rows = d.query("SELECT id, name FROM read_csv('/tmp/ddbmodeb/data/test.csv')")
              assert(rows and #rows == 2 and rows[1].name == "alice", "declared-dir read failed")
              print("DUCKDB MODE B OK")
              return 0
          end)
          EOF
          set +e
          echo "############ ATTEMPT 1: baseline (expected: rseq fatal) ############"
          ./build/hull /tmp/ddbmodeb/app.lua > /tmp/ddbmodeb/out1.txt 2>&1
          echo "=== attempt 1 exit: $? ==="
          cat /tmp/ddbmodeb/out1.txt
          echo ""
          echo "############ ATTEMPT 2: GLIBC_TUNABLES=glibc.pthread.rseq=0 ############"
          GLIBC_TUNABLES=glibc.pthread.rseq=0 ./build/hull /tmp/ddbmodeb/app.lua > /tmp/ddbmodeb/out2.txt 2>&1
          echo "=== attempt 2 exit: $? ==="
          cat /tmp/ddbmodeb/out2.txt
          echo ""
          echo "############ VERDICT ############"
          if grep -q "DUCKDB MODE B OK" /tmp/ddbmodeb/out2.txt; then
              echo "--> rseq WAS THE ONLY WALL. With rseq disabled, read_csv works under"
              echo "    the full sandbox. Mode B is viable; real fix is either a launch-time"
              echo "    GLIBC_TUNABLES=glibc.pthread.rseq=0 or allowing rseq in vendor/pledge"
              echo "    (RET_ALLOW instead of the ENOSYS stub; matches upstream pledge's fix)."
          elif grep -qi "rseq registration failed" /tmp/ddbmodeb/out2.txt; then
              echo "--> rseq STILL fatal even with the tunable (unexpected); the tunable must"
              echo "    be set at exec, before glibc init -- investigate whether the env"
              echo "    reached the child, or disable rseq in vendor/pledge instead."
          else
              echo "--> Got PAST rseq, but read_csv still fails -- this is the REAL file"
              echo "    blocker, finally reached. Inspect attempt-2 output above:"
              echo "    'error: pledge/bad syscall' => a file syscall; a bare EACCES/abort"
              echo "    with no pledge line => a Landlock path to unveil."
              grep -nE "error: (pledge|bad syscall)|EACCES|Permission|unique_ptr|InternalException|Aborted" /tmp/ddbmodeb/out2.txt || true
          fi
          # Diagnostic: report, never fail the job.
          exit 0

  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Generate coverage
        timeout-minutes: 10
        run: make coverage

      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-report
          path: build/coverage/html/

  lint:
    name: Lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck

      - name: Lua lint
        run: make lint-lua

      - name: Install Biome
        run: npm install -g @biomejs/biome@1.9.4

      - name: JS lint
        run: make lint-js

  htmx-browser:
    name: HTMX browser tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build
        run: make

      # Cache playwright + chromium across runs (large download, ~150 MB).
      # Key on the playwright pin from the test script so a version bump
      # auto-invalidates. PLAYWRIGHT_BROWSERS_PATH points into the cache.
      - name: Cache Playwright + Chromium
        uses: actions/cache@v4
        with:
          path: tests/.playwright
          key: playwright-${{ runner.os }}-v1.48.0

      - name: HTMX browser E2E (dev)
        timeout-minutes: 6
        run: make e2e-htmx-playwright

      # Same suite, but against `hull build` standalone binaries —
      # exercises the embedded-VFS code path. Needs hull rebuilt
      # with EMBED_PLATFORM=1, which we do inline so the
      # MODE=dev step above still gets the lighter binary.
      - name: HTMX browser E2E (build mode)
        timeout-minutes: 8
        run: |
          make platform
          make EMBED_PLATFORM=1
          make e2e-htmx-playwright-build

      # On failure either suite writes playwright traces + final-state
      # screenshots under build/playwright-artifacts/. Upload them so
      # the diff between "test failed in CI" and "test failed for me
      # locally" disappears — `npx playwright show-trace trace.zip`
      # opens an interactive timeline (network log, DOM snapshots,
      # console events, screenshots per action).
      - name: Upload playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: htmx-playwright-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/playwright-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  benchmark:
    name: Benchmark (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'

    strategy:
      matrix:
        runtime: [lua, js]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Build
        run: make

      - name: Benchmark
        run: RUNTIME=${{ matrix.runtime }} DURATION=5s CONNECTIONS=50 THREADS=2 sh bench/bench.sh

      - name: Template Benchmark
        run: RUNTIME=${{ matrix.runtime }} DURATION=5s CONNECTIONS=50 THREADS=2 sh bench/bench_template.sh

  # ── libhull reference embedders (L-5) ──
  # Prove the hl_embed_* C ABI is consumable from a foreign language. Each job
  # links libhull.a + Keel and runs examples/embed_{rust,zig} through the ABI.
  # The make target skips when the toolchain is absent, so we assert it actually
  # ran (grep for the OK line) rather than silently pass.
  embed-rust:
    name: libhull embedder (Rust)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Rust toolchain
        run: rustc --version && cargo --version   # preinstalled on GitHub runners

      - name: Run Rust reference embedder
        run: |
          out=$(make embed-rust-smoke 2>&1); echo "$out"
          echo "$out" | grep -q "embed-rust-smoke: OK" \
            || { echo "::error::embed_rust did not run to completion"; exit 1; }

  embed-zig:
    name: libhull embedder (Zig)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install Zig 0.13.0
        run: |
          set -eu
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            -o /tmp/zig.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"

      - name: Zig version
        run: zig version

      - name: Run Zig reference embedder
        run: |
          out=$(make embed-zig-smoke 2>&1); echo "$out"
          echo "$out" | grep -q "embed-zig-smoke: OK" \
            || { echo "::error::embed_zig did not run to completion"; exit 1; }
