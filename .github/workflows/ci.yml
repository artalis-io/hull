name: CI

on:
  push:
    branches: [main]
    # Site / docs / changelog updates don't touch any C, Lua, JS, Makefile,
    # or workflow surface that CI validates — skip the full build matrix
    # for those. deploy-site.yml handles site/** independently.
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'LICENSING.md'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'LICENSING.md'
      - '**.md'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Linux (clang)
            os: ubuntu-latest
            cc: clang
          - name: Linux (aarch64)
            os: ubuntu-24.04-arm
          - name: macOS
            os: macos-latest

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc || 'cc' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build
        run: make

      - name: Hardening summary
        run: make hardening

      - name: Hardening verification (release flags present)
        timeout-minutes: 1
        run: make check-hardening

      - name: Unit tests
        timeout-minutes: 5
        run: make test

      - name: E2E tests
        timeout-minutes: 2
        run: make e2e

      - name: Blob storage E2E tests
        timeout-minutes: 2
        run: make e2e-blob

      - name: Multipart upload E2E tests
        timeout-minutes: 3
        run: make e2e-multipart

      - name: Attachment E2E tests
        timeout-minutes: 2
        run: make e2e-attachment

      - name: Hypermedia entry upload E2E tests
        timeout-minutes: 2
        run: make e2e-hypermedia-photos-upload

      - name: JWT asymmetric verify E2E tests
        timeout-minutes: 2
        run: make e2e-jwt-asym

      - name: OIDC OAuth flow E2E tests
        timeout-minutes: 3
        run: make e2e-oauth

      - name: Install zbar (for TOTP + QR e2e)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install zbar
          else
            sudo apt-get update && sudo apt-get install -y zbar-tools
          fi

      - name: TOTP + QR round-trip E2E tests
        timeout-minutes: 3
        run: make e2e-totp

      - name: Auth flows E2E tests
        timeout-minutes: 3
        run: make e2e-auth-flows

      - name: Auth flows + TOTP 2FA composition E2E tests
        timeout-minutes: 3
        run: make e2e-auth-flows-2fa

      - name: Auth flows hardening (resend / lockout / revoke / pwned) E2E
        timeout-minutes: 3
        run: make e2e-auth-flows-hardening

      - name: Sign-in events + device management E2E
        timeout-minutes: 3
        run: make e2e-sign-in-events

      - name: Sandbox tests
        timeout-minutes: 2
        run: make e2e-sandbox

      - name: Example E2E tests
        timeout-minutes: 5
        run: make e2e-examples

      - name: Compute E2E tests
        timeout-minutes: 2
        run: make e2e-compute

      - name: TCC E2E tests
        timeout-minutes: 3
        run: make e2e-tcc

      - name: Install + completions E2E tests
        timeout-minutes: 2
        run: make e2e-install

      - name: CA bundle E2E tests
        timeout-minutes: 2
        run: make e2e-ca-bundle

      - name: Update E2E tests
        timeout-minutes: 2
        run: make e2e-update

      - name: hull test (examples)
        timeout-minutes: 2
        run: make hull-test-examples

  # Reproducibility gate. Three properties tested independently on
  # both Linux and macOS via matrix strategy:
  #
  #   1. Self-build (bootstrap): hull can build hull2 can build hull3.
  #      Proves the build pipeline produces working binaries that can
  #      themselves produce working binaries.
  #
  #   2. Hull-itself reproducibility: `make` from a clean tree
  #      produces a byte-identical `build/hull` between runs. Gates
  #      MANIFESTO's "same source = same binary" claim at the runtime
  #      level (not just for apps `hull build` produces).
  #
  #   3. Hull-build reproducibility: `hull build` produces byte-
  #      identical outputs for the same input. Build the same fixture
  #      twice to the SAME output path. (macOS ld64 hashes the output
  #      path into LC_UUID; same-path isolates the question we
  #      actually care about: link output stability for fixed
  #      inputs. See Makefile comment on the target.)
  reproducibility:
    name: Reproducible build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Build hull
        timeout-minutes: 5
        run: make
      - name: Self-build chain (hull -> hull2 -> hull3)
        timeout-minutes: 5
        run: make self-build
      - name: Hull-itself reproducibility (make twice, then cmp)
        timeout-minutes: 10
        run: |
          set -eu
          cp build/hull /tmp/hull-rep-1
          make clean
          make
          if cmp -s /tmp/hull-rep-1 build/hull; then
            echo "PASS: build/hull is byte-identical across rebuilds ($(wc -c < build/hull) bytes)"
          else
            echo "FAIL: build/hull differs between rebuilds"
            shasum -a 256 /tmp/hull-rep-1 build/hull
            exit 1
          fi
      - name: Reproducibility (hull build byte-identical, same output path)
        timeout-minutes: 5
        run: make reproducible-check

  build-pipeline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    name: Build Pipeline (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build pipeline E2E tests
        timeout-minutes: 10
        run: make e2e-build

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build and test with sanitizers
        timeout-minutes: 10
        run: |
          make clean
          make DEBUG=1 test

  msan:
    name: MSan + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: MSan test
        # Bumped from 10 → 15 min in round-8. The crypto-heavy auth-
        # stack unit tests (TOTP enrollment / PBKDF2 verify) plus the
        # round-8 additions push the total MSan runtime past 10 min on
        # GitHub's shared runners. Bumping the cap is cheaper than
        # cutting test coverage; PBKDF2 isn't going to get faster.
        timeout-minutes: 15
        run: make msan

  tsan:
    name: TSan (worker pool)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: TSan test (worker-pool / shared-state paths)
        # ThreadSanitizer over the suites that spin worker threads: the
        # WASM compute worker (cap/wasm.c + worker_wasm.c, home of the
        # shared-segment vs in-flight-async-call fix) and both thread-pool
        # async backends (Keel-backed + poll). Guards against a regression
        # of the inflight_async use-after-free fix and any future race in
        # the worker handoff shared by db.async / compute.async / gpu.async.
        timeout-minutes: 15
        run: make CC=clang tsan

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools cppcheck

      - name: scan-build
        run: make analyze

      - name: cppcheck
        run: make cppcheck

  cosmo:
    name: Cosmopolitan (APE)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install cosmocc
        run: |
          COSMOCC_DIR=/opt/cosmo make fetch-cosmocc
          echo "/opt/cosmo/bin" >> $GITHUB_PATH

      - name: Build platform (multi-arch)
        run: make platform-cosmo

      - name: Build hull
        run: make CC=cosmocc

      - name: Hardening summary (cosmocc)
        run: make CC=cosmocc hardening

      - name: Unit tests
        timeout-minutes: 5
        run: make test CC=cosmocc

      - name: Sandbox tests (cosmo)
        timeout-minutes: 2
        run: make e2e-sandbox CC=cosmocc

      - name: Example E2E tests
        timeout-minutes: 5
        run: make e2e-examples CC=cosmocc

      - name: Blob storage E2E tests
        timeout-minutes: 2
        run: make e2e-blob CC=cosmocc

      - name: Multipart upload E2E tests
        timeout-minutes: 3
        run: make e2e-multipart CC=cosmocc

      - name: Attachment E2E tests
        timeout-minutes: 2
        run: make e2e-attachment CC=cosmocc

      - name: Compute E2E tests
        timeout-minutes: 2
        run: make e2e-compute CC=cosmocc

      - name: hull test (examples)
        timeout-minutes: 2
        run: make hull-test-examples CC=cosmocc

  gpu:
    name: GPU Compute (macOS Metal)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Fetch wgpu-native
        run: make fetch-wgpu

      - name: Build with GPU
        run: make HL_ENABLE_GPU=1

      - name: Unit tests (GPU)
        timeout-minutes: 5
        run: make test HL_ENABLE_GPU=1

      - name: E2E tests
        timeout-minutes: 2
        run: make e2e HL_ENABLE_GPU=1

      - name: Compute E2E tests
        timeout-minutes: 2
        run: make e2e-compute HL_ENABLE_GPU=1

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Generate coverage
        timeout-minutes: 10
        run: make coverage

      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-report
          path: build/coverage/html/

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck

      - name: Lua lint
        run: make lint-lua

      - name: Install Biome
        run: npm install -g @biomejs/biome@1.9.4

      - name: JS lint
        run: make lint-js

  htmx-browser:
    name: HTMX browser tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Build
        run: make

      # Cache playwright + chromium across runs (large download, ~150 MB).
      # Key on the playwright pin from the test script so a version bump
      # auto-invalidates. PLAYWRIGHT_BROWSERS_PATH points into the cache.
      - name: Cache Playwright + Chromium
        uses: actions/cache@v4
        with:
          path: tests/.playwright
          key: playwright-${{ runner.os }}-v1.48.0

      - name: HTMX browser E2E (dev)
        timeout-minutes: 6
        run: make e2e-htmx-playwright

      # Same suite, but against `hull build` standalone binaries —
      # exercises the embedded-VFS code path. Needs hull rebuilt
      # with EMBED_PLATFORM=1, which we do inline so the
      # MODE=dev step above still gets the lighter binary.
      - name: HTMX browser E2E (build mode)
        timeout-minutes: 8
        run: |
          make platform
          make EMBED_PLATFORM=1
          make e2e-htmx-playwright-build

      # On failure either suite writes playwright traces + final-state
      # screenshots under build/playwright-artifacts/. Upload them so
      # the diff between "test failed in CI" and "test failed for me
      # locally" disappears — `npx playwright show-trace trace.zip`
      # opens an interactive timeline (network log, DOM snapshots,
      # console events, screenshots per action).
      - name: Upload playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: htmx-playwright-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/playwright-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  benchmark:
    name: Benchmark (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    strategy:
      matrix:
        runtime: [lua, js]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Build
        run: make

      - name: Benchmark
        run: RUNTIME=${{ matrix.runtime }} DURATION=5s CONNECTIONS=50 THREADS=2 sh bench/bench.sh

      - name: Template Benchmark
        run: RUNTIME=${{ matrix.runtime }} DURATION=5s CONNECTIONS=50 THREADS=2 sh bench/bench_template.sh
