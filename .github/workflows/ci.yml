name: CI

on:
  # NO paths-ignore (docs/ci_architecture_design.md sections 3, 10): the
  # orchestrator must ALWAYS run so `classify` + `ci-success` always appear as
  # checks and can never leave a required check pending because the whole
  # workflow was path-skipped. A docs-only change now runs `classify` (-> the
  # docs-only plan) + `lint` + `ci-success` and skips everything else via the
  # classifier, instead of skipping the entire workflow.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual force-full trigger (docs/ci_architecture_design.md section 15). The
  # mechanism may ADD coverage, never suppress required work.
  workflow_dispatch:
    inputs:
      force_full:
        description: "Run the full suite regardless of changed paths."
        type: boolean
        default: false

# CI-architecture (docs/ci_architecture_design.md): the `classify`
# orchestrator emits per-group run-flags from the change plan; each expensive job
# gates on its flag (`if: needs.classify.outputs.run_*`), and the `ci-success`
# gate derives its allow-skip from the SAME job-applicability map
# (scripts/ci/job_plan.py, enforced by check_job_plan_consistency.py). Only the
# PROVEN narrow classes skip - docs-only, JS frontend/fuzz, Lua frontend/fuzz -
# every other plan (core, tooling, domain, examples, generic tests, unknown,
# main/full/force-full) runs the broad suite. `ci-success` is still NOT a
# required check; branch protection is unchanged.
jobs:
  # -- orchestrator: classify the change, self-test the classifier/gate/map, then
  # emit the per-group run-flags every expensive job gates on. --
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      plan_json: ${{ steps.run.outputs.plan_json }}
      # the monolithic run_full_matrix / run_fuzz_native
      # flags are replaced by the core-common floor + native subsystem groups +
      # the broad-only web bucket. The set here MUST equal job_plan.GROUP_FLAG's
      # values (check_job_plan_consistency.py keeps the job `if:` conditions in
      # lockstep with this map).
      run_core_common: ${{ steps.flags.outputs.run_core_common }}
      run_web: ${{ steps.flags.outputs.run_web }}
      run_db_postgres: ${{ steps.flags.outputs.run_db_postgres }}
      run_db_mysql: ${{ steps.flags.outputs.run_db_mysql }}
      run_db_valkey: ${{ steps.flags.outputs.run_db_valkey }}
      run_db_duckdb: ${{ steps.flags.outputs.run_db_duckdb }}
      run_db_any: ${{ steps.flags.outputs.run_db_any }}
      run_gpu: ${{ steps.flags.outputs.run_gpu }}
      run_compute: ${{ steps.flags.outputs.run_compute }}
      run_focused_js: ${{ steps.flags.outputs.run_focused_js }}
      run_focused_lua: ${{ steps.flags.outputs.run_focused_lua }}
      run_fuzz_js: ${{ steps.flags.outputs.run_fuzz_js }}
      run_fuzz_lua: ${{ steps.flags.outputs.run_fuzz_lua }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - name: Classifier + gate + applicability self-tests
        run: |
          python3 scripts/ci/test_classify_changes.py
          python3 scripts/ci/test_ci_gate.py
          python3 scripts/ci/test_job_plan.py
          python3 scripts/ci/test_wamrc_artifact.py
          python3 scripts/ci/check_gate_completeness.py
          python3 scripts/ci/check_job_plan_consistency.py
      - name: Classify the change (merge-base diff -> plan)
        id: run
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL: ${{ github.event.inputs.force_full }}
        run: |
          set -uo pipefail   # NOT -e: a diff hiccup must fail CLOSED (full), never redden CI
          if [ "$EVENT" = "pull_request" ]; then
            git fetch -q --no-tags origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
            MB="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo '')"
            PATHS_FILE="$(mktemp)"
            # Stage the diff into a file: a FAILING `git diff` falls back to
            # --force-full (full_all) rather than leaving the pipeline nonzero and
            # reddening the step. A diff failure EXPANDS coverage; it does not fail
            # classification.
            if [ -n "$MB" ] && git diff --name-only -z --no-renames "$MB" "$HEAD_SHA" > "$PATHS_FILE" 2>/dev/null; then
              python3 scripts/ci/classify_changes.py --event pull_request --paths-from "$PATHS_FILE"
            else
              python3 scripts/ci/classify_changes.py --event pull_request --force-full < /dev/null
            fi
          elif [ "$EVENT" = "push" ]; then
            python3 scripts/ci/classify_changes.py --event push_main < /dev/null
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE_FULL" != "true" ]; then
            python3 scripts/ci/classify_changes.py --event push_main < /dev/null
          else
            python3 scripts/ci/classify_changes.py --event pull_request --force-full < /dev/null
          fi
      - name: Emit per-group run-flags (the single map the job `if:` conditions use)
        id: flags
        run: python3 scripts/ci/job_plan.py --plan "$PLAN"
        env:
          PLAN: ${{ steps.run.outputs.plan_json }}

  build:
    needs: [classify]
    if: needs.classify.outputs.run_core_common == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Linux (clang)
            os: ubuntu-24.04
            cc: clang
          - name: Linux (aarch64)
            os: ubuntu-24.04-arm
          - name: macOS
            os: macos-15

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc || 'cc' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      # fail fast if feature.c FEATURES[] drifts from the mk/feature.mk
      # feature registry (the single source of truth). Cheap (grep + make vars).
      # Also asserts every installable feature has a FEATURE_SPECS codegen entry (T4e).
      - name: Feature registry consistency (feature.c vs mk/feature.mk vs FEATURE_SPECS)
        run: make check-feature-registry

      # T4d: the side-load tool REGISTRY (tools_install.c) vs the release workflow
      # that must publish each tool's asset.
      - name: Tool registry consistency (tools_install.c vs release.yml)
        run: make check-tools-registry

      # WAMR out-of-tree read-only patch carriage: deterministic dry-run that
      # fails on a drifted base commit, a stale patch hash, an apply offset, a
      # reverse-check mismatch, or any changed/new file the patches do not
      # declare. Keeps patches/wamr/* in lockstep with the pinned submodule.
      - name: WAMR patch carriage dry-run (base/stale/offset/unexpected-source)
        run: make wamr-patch-check

      - name: Build
        run: make

      # a2 base-drop guard (docs/tls_feature.md): the TLS-less app-build base
      # (HL_TLS_FEATURE=1) must build and carry zero mbedTLS. Self-verifying.
      - name: TLS-less base builds + is mbedTLS-free
        timeout-minutes: 3
        run: make platform-tlsless

      # The Keel-less app-build base (HL_KEEL_FEATURE=1) must build and drop the
      # Keel event loop (serve.o + async_keel.o + net_keel.o). Self-verifying.
      - name: Keel-less base builds + drops the event loop
        timeout-minutes: 3
        run: make platform-keelless

      - name: Hardening summary
        run: make hardening

      - name: Hardening verification (release flags present)
        timeout-minutes: 1
        run: make check-hardening

      - name: Unit tests
        timeout-minutes: 5
        run: make test

      - name: E2E tests
        timeout-minutes: 2
        run: make e2e

      - name: Blob storage E2E tests
        timeout-minutes: 2
        run: make e2e-blob

      - name: Test-harness fs + multipart E2E tests
        timeout-minutes: 2
        run: make e2e-test-harness

      - name: Jobs queue E2E tests
        timeout-minutes: 2
        run: make e2e-jobs

      - name: Multipart upload E2E tests
        timeout-minutes: 3
        run: make e2e-multipart

      - name: Template Lua/JS escaping-parity E2E test
        timeout-minutes: 2
        run: make e2e-template-parity

      - name: Hex Lua/JS byte-string parity E2E test
        timeout-minutes: 2
        run: make e2e-hex-parity

      - name: Client-IP Lua/JS parity E2E test
        timeout-minutes: 2
        run: make e2e-client-ip-parity

      - name: Email error-convention Lua/JS E2E test
        timeout-minutes: 2
        run: make e2e-email

      - name: UUID (v4/v7) E2E test
        timeout-minutes: 2
        run: make e2e-uuid

      - name: Cache module (TTL/LRU) Lua/JS parity E2E test
        timeout-minutes: 2
        run: make e2e-cache-module

      - name: KV + cache backends (memory/sqlite) conformance E2E test
        timeout-minutes: 2
        run: make e2e-kv

      - name: Ratelimit (hull.cache-backed) Lua/JS parity E2E test
        timeout-minutes: 2
        run: make e2e-ratelimit-parity

      - name: Config (typed env + .env) Lua/JS parity E2E test
        timeout-minutes: 2
        run: make e2e-config-parity

      - name: Retry (generic backoff) Lua/JS parity E2E test
        timeout-minutes: 2
        run: make e2e-retry

      - name: Logx (contextual logging) Lua/JS parity E2E test
        timeout-minutes: 2
        run: make e2e-logx-parity

      - name: Naming-reconciliation alias E2E test (canonical + alias both work)
        timeout-minutes: 2
        run: make e2e-naming-aliases

      - name: CSRF session-id cookie-fallback Lua/JS parity E2E test
        timeout-minutes: 2
        run: make e2e-csrf-cookie-fallback

      - name: Validate Lua/JS parity E2E test
        timeout-minutes: 2
        run: make e2e-validate-parity

      - name: Path Lua/JS parity E2E test
        timeout-minutes: 2
        run: make e2e-path-parity

      - name: Token wire-format interop E2E test (jwt/envelope/csrf mint<->verify)
        timeout-minutes: 2
        run: make e2e-token-interop

      - name: Runtime slim E2E test (single-runtime app drops the other interpreter)
        timeout-minutes: 3
        run: make e2e-feature-runtime

      - name: WASM feature E2E test (compute-free app drops WAMR; needs_wasm gate)
        timeout-minutes: 4
        run: make e2e-feature-wasm

      - name: Image feature E2E test (image-free app drops stb; needs_image gate)
        timeout-minutes: 4
        run: make e2e-feature-image

      - name: TLS feature E2E test (tls-free app drops mbedTLS; needs_tls gate)
        timeout-minutes: 5
        run: make e2e-feature-tls

      - name: Compiler-free build E2E test (emit app_registry.o + bundled trampoline, no cc)
        timeout-minutes: 4
        run: make e2e-compiler-free

      - name: Cross-build E2E test (emit + cross-link ELF for both arches via lld)
        timeout-minutes: 3
        run: |
          command -v ld.lld >/dev/null 2>&1 || sudo apt-get install -y lld 2>/dev/null || true
          make e2e-cross-build

      - name: Linker (lld) E2E test (hull build --linker=lld)
        timeout-minutes: 4
        run: |
          command -v ld.lld >/dev/null 2>&1 || sudo apt-get install -y lld 2>/dev/null || true
          make e2e-linker

      - name: Linker (zig) E2E test (hull build --linker=zig)
        # Linux x86_64 only (the e2e self-skips elsewhere: a foreign-target link
        # needs a matching platform lib). Install the same Zig the embed-zig job
        # uses, then build + run a real app through the zig linker backend.
        if: runner.os == 'Linux' && runner.arch == 'X64'
        timeout-minutes: 5
        run: |
          if ! command -v zig >/dev/null 2>&1; then
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
              https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
              -o /tmp/zig.tar.xz
            sudo mkdir -p /opt/zig
            sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
            echo "/opt/zig" >> "$GITHUB_PATH"
            export PATH="/opt/zig:$PATH"
          fi
          make e2e-linker-zig

      - name: musl cross-build E2E (hull build --target=…-linux-musl --linker=zig)
        # Linux x86_64 + Docker only (self-skips elsewhere). Builds the musl
        # archive set (scripts/build_musl_platform.sh, Alpine), stages it + the
        # zig installed above, cross-builds a compute app, and RUNS the static
        # musl result in Alpine. Audit #4c. The musl archive build is the slow
        # part, hence the wider timeout.
        if: runner.os == 'Linux' && runner.arch == 'X64'
        timeout-minutes: 25
        run: |
          command -v zig >/dev/null 2>&1 || export PATH="/opt/zig:$PATH"
          make e2e-musl-cross

      - name: Attachment E2E tests
        timeout-minutes: 2
        run: make e2e-attachment

      - name: Hypermedia entry upload E2E tests
        timeout-minutes: 2
        run: make e2e-hypermedia-photos-upload

      - name: JWT asymmetric verify E2E tests
        timeout-minutes: 2
        run: make e2e-jwt-asym

      - name: OIDC OAuth flow E2E tests
        timeout-minutes: 3
        run: make e2e-oauth

      - name: Install zbar (for TOTP + QR e2e)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install zbar
          else
            sudo apt-get update && sudo apt-get install -y zbar-tools
          fi

      - name: TOTP + QR round-trip E2E tests
        timeout-minutes: 3
        run: make e2e-totp

      - name: Auth flows E2E tests
        timeout-minutes: 3
        run: make e2e-auth-flows

      - name: Auth flows + TOTP 2FA composition E2E tests
        timeout-minutes: 3
        run: make e2e-auth-flows-2fa

      - name: Auth flows hardening (resend / lockout / revoke / pwned) E2E
        timeout-minutes: 3
        run: make e2e-auth-flows-hardening

      - name: Sign-in events + device management E2E
        timeout-minutes: 3
        run: make e2e-sign-in-events

      - name: Sandbox tests
        timeout-minutes: 2
        run: make e2e-sandbox

      - name: Example E2E tests
        timeout-minutes: 5
        run: make e2e-examples

      - name: Compute E2E tests
        timeout-minutes: 2
        run: make e2e-compute

      - name: Windowed fs.mmap binding E2E tests
        timeout-minutes: 2
        run: make e2e-spans-mmap

      - name: Mapped-span binding parse E2E tests
        timeout-minutes: 2
        run: make e2e-spans-bind

      - name: Mapped-span async forwarding E2E tests
        timeout-minutes: 2
        run: make e2e-spans-async

      - name: Persistent-instance async E2E tests
        timeout-minutes: 2
        run: make e2e-persistent-async

      - name: Async-trap surfacing E2E (Lua #317 + JS #319, cross-consumer)
        timeout-minutes: 2
        run: make e2e-compute-async-trap

      - name: Sync span forwarding E2E (compute.call + instance:call, #325)
        timeout-minutes: 2
        run: make e2e-sync-spans

      - name: Compute header install/refresh E2E (hull_compute.h + hull_span.h, 3b)
        timeout-minutes: 2
        run: make e2e-compute-headers

      - name: Named-connection async/udf E2E tests
        timeout-minutes: 2
        run: make e2e-named-connections

      - name: Dynamic-connection (db.open) E2E tests
        timeout-minutes: 2
        run: make e2e-dynamic-connections

      - name: Build-flavor E2E tests
        timeout-minutes: 6
        run: make e2e-build-flavor

      - name: SMTP feature link-seam E2E test
        timeout-minutes: 3
        run: make e2e-smtp-link-seam

      - name: Install + completions E2E tests
        timeout-minutes: 2
        run: make e2e-install

      - name: CA bundle E2E tests
        timeout-minutes: 2
        run: make e2e-ca-bundle

      # First-run developer experience: doctor's state classification +
      # platform-aware advice, CLI logging hygiene, and the POSIX half of the
      # build-artifact contract (default output name unchanged, one shippable
      # binary in the app root). The Windows half runs on a real Windows
      # runner in cosmocc-windows-e2e.yml.
      - name: Onboarding / first-run E2E tests
        timeout-minutes: 3
        run: make e2e-onboarding

      - name: Update E2E tests
        timeout-minutes: 2
        run: make e2e-update

      - name: Project source-discovery E2E tests (hull agent inspect, JS analyzable)
        timeout-minutes: 4
        run: make e2e-project-discovery

      - name: hull test (examples)
        timeout-minutes: 2
        run: make hull-test-examples

  # (docs/ci_architecture_design.md Appendix D): the wamrc PRODUCER.
  # Builds wamrc ONCE (LLVM-18 + the WAMR patch carriage), emits an identity +
  # provenance manifest, and uploads an immutable, run-scoped artifact. In this
  # ADDITIVE checkpoint the artifact is proven by the verify job below; the 8
  # x86_64 AOT consumers still build their own wamrc (unchanged) until a later
  # checkpoint flips them to rely on it. Compute-group gated (run_compute), so a
  # non-compute plan builds no wamrc.
  wamrc-x86_64:
    needs: [classify]
    if: needs.classify.outputs.run_compute == 'true'
    name: wamrc producer (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Install LLVM + cmake
        run: sudo apt-get update && sudo apt-get install -y llvm-18-dev cmake
      - name: Build wamrc (the WAMR patch carriage)
        timeout-minutes: 12
        run: |
          if command -v llvm-config-18 >/dev/null 2>&1; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=$(llvm-config-18 --cmakedir)"
          fi
          make wamrc
      - name: Emit provenance manifest
        run: |
          if command -v llvm-config-18 >/dev/null 2>&1; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=$(llvm-config-18 --cmakedir)"
          fi
          python3 scripts/ci/wamrc_artifact.py manifest \
            --wamrc build/wamrc --producer wamrc-x86_64 > build/wamrc.manifest.json
          cat build/wamrc.manifest.json
      - name: Upload wamrc artifact (run-scoped, immutable)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wamrc-x86_64
          path: |
            build/wamrc
            build/wamrc.manifest.json
          retention-days: 1
          if-no-files-found: error

  # the verify + equivalence CONSUMER (representative). Downloads the
  # producer artifact, verifies identity + provenance + checksum + arch + linkage
  # + usability (FAILS the job on any mismatch - it never rebuilds and pretends),
  # then byte-compares the artifact-wamrc .aot against a FRESH-built wamrc .aot on
  # a wasm32 + a Memory64 fixture, and asserts a corrupted artifact is rejected.
  wamrc-artifact-verify:
    needs: [classify, wamrc-x86_64]
    if: needs.classify.outputs.run_compute == 'true'
    name: wamrc artifact verify + equivalence (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true
      - name: Install LLVM + cmake
        run: sudo apt-get update && sudo apt-get install -y llvm-18-dev cmake
      - name: Download wamrc artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wamrc-x86_64
          path: artifact
      # COLD verification: configure the wamrc toolchain (generate CMakeCache.txt
      # with the resolved compilers) WITHOUT compiling wamrc, then verify. This is
      # the reliance-flip precondition - a real consumer will NOT build wamrc, so
      # the identity must reproduce from configure alone. `make wamrc-configure`
      # must NOT leave an executable build/wamrc.
      - name: Configure toolchain (no compile) + COLD verify (before any build)
        timeout-minutes: 6
        run: |
          set -e
          if command -v llvm-config-18 >/dev/null 2>&1; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=$(llvm-config-18 --cmakedir)"
          fi
          chmod +x artifact/wamrc
          make wamrc-configure
          if [ -x build/wamrc ]; then
            echo "::error::wamrc was built during configure - cold verify is not cold"; exit 1
          fi
          python3 scripts/ci/wamrc_artifact.py verify \
            --manifest artifact/wamrc.manifest.json --wamrc artifact/wamrc --producer wamrc-x86_64
      - name: Linkage (ldd, HARD) + usability (AOT compile with the artifact wamrc)
        run: |
          set -e
          LDD_OUT="$(ldd artifact/wamrc 2>&1 || true)"
          echo "== ldd artifact/wamrc =="; echo "$LDD_OUT"
          if printf '%s' "$LDD_OUT" | grep -qi 'not found'; then
            echo "::error::artifact/wamrc has UNRESOLVED dynamic dependencies"; exit 1
          fi
          # usability: the ARTIFACT wamrc (no fresh build yet) must run + emit a
          # non-empty .aot; a wamrc that cannot load its libLLVM fails HERE.
          artifact/wamrc -o /tmp/probe.aot tests/fixtures/compute/echo.wasm
          test -s /tmp/probe.aot
          echo "artifact wamrc runnable (emitted $(wc -c < /tmp/probe.aot)-byte .aot)"
      - name: Output equivalence (NOW build fresh wamrc, compare .aot byte-for-byte)
        timeout-minutes: 12
        run: |
          set -e
          if command -v llvm-config-18 >/dev/null 2>&1; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=$(llvm-config-18 --cmakedir)"
          fi
          make wamrc          # the from-source baseline (only needed for equivalence)
          for w in tests/fixtures/compute/echo.wasm tests/fixtures/compute/echo64.wasm; do
            artifact/wamrc -o /tmp/a.aot "$w"
            build/wamrc     -o /tmp/b.aot "$w"
            if ! cmp -s /tmp/a.aot /tmp/b.aot; then
              echo "::error::AOT output differs between artifact-wamrc and fresh-wamrc for $w"
              exit 1
            fi
            echo "equivalence OK (byte-identical .aot): $w"
          done
      - name: Corruption rejection (negative)
        run: |
          set -e
          cp artifact/wamrc /tmp/wamrc.corrupt
          printf '\xff' | dd of=/tmp/wamrc.corrupt bs=1 seek=64 count=1 conv=notrunc status=none
          if command -v llvm-config-18 >/dev/null 2>&1; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=$(llvm-config-18 --cmakedir)"
          fi
          if python3 scripts/ci/wamrc_artifact.py verify \
               --manifest artifact/wamrc.manifest.json --wamrc /tmp/wamrc.corrupt --producer wamrc-x86_64; then
            echo "::error::a corrupted wamrc was NOT rejected"; exit 1
          fi
          echo "corruption correctly rejected (checksum mismatch -> job would FAIL)"

  # Read-only shared-heap enforcement (Phase 0): prove the AOT write-trap path
  # THROUGH HULL'S OWN BUILD, not just the interpreter or the WAMR unit config.
  # The `build` job's `make test` runs test_wasm_readonly_heap too, but with no
  # wamrc there it takes the AOT skip path (interp case only). This job installs
  # LLVM-18, builds Hull's wamrc (which forces the WAMR patch carriage), then
  # builds + runs the C-API test with a real wamrc-emitted .aot fixture and FAILS
  # if the AOT sub-case is SKIPPED. That closes the "AOT is dormant in CI" gap.
  wasm-readonly-heap-aot:
    needs: [classify, wamrc-x86_64]
    if: needs.classify.outputs.run_compute == 'true'
    name: WAMR AOT C-API tests (readonly + guarded, x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install LLVM + cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev cmake

      - name: Download verified wamrc artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wamrc-x86_64
          path: artifact

      - name: Consume verified wamrc artifact (cold-verify, no build)
        timeout-minutes: 12
        run: |
          if command -v llvm-config-18 >/dev/null 2>&1; then
            llvm_cmakedir=$(llvm-config-18 --cmakedir)
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=${llvm_cmakedir}"
          fi
          sh tests/ci_wamrc_consume.sh

      - name: Build + run the AOT C-API case (must NOT skip)
        timeout-minutes: 12
        run: |
          # Precondition: guarantee THIS step's own executable wamrc rather than
          # trusting a prior step's mutable build/ state (see the helper header).
          sh tests/ci_ensure_wamrc.sh
          # Regenerate the fixture header now that wamrc exists, then build + run.
          rm -f build/gen_ro_heap_aot.h
          make build/test_wasm_readonly_heap
          set -o pipefail
          ./build/test_wasm_readonly_heap 2>&1 | tee ro_heap.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::test_wasm_readonly_heap failed (rc=$rc)"; exit "$rc"; }
          if grep -qE 'SKIPPED.*wasm_readonly_heap\.aot' ro_heap.log; then
            echo "::error::AOT C-API case took the wamrc-unavailable skip path"; exit 1
          fi
          grep -qE 'OK[^A-Za-z].*wasm_readonly_heap\.aot' ro_heap.log \
            || { echo "::error::AOT C-API case did not run to OK"; exit 1; }
          echo "AOT read-only-heap C-API case ran against a real wamrc .aot and passed."

      - name: Build + run the guarded-subrange AOT cases (must NOT skip)
        timeout-minutes: 12
        run: |
          # Precondition: guarantee THIS step's own executable wamrc rather than
          # trusting a prior step's mutable build/ state (see the helper header).
          sh tests/ci_ensure_wamrc.sh
          # patch 0004: regenerate the SW- and HW-bound AOT fixtures now that
          # wamrc exists, then run the guarded matrix. FAIL if either AOT case
          # takes the wamrc-unavailable skip path (closes "AOT dormant in CI").
          rm -f build/gen_gsub_aot_sw.h
          make build/test_wasm_guarded_subrange
          set -o pipefail
          ./build/test_wasm_guarded_subrange 2>&1 | tee gsub.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::test_wasm_guarded_subrange failed (rc=$rc)"; exit "$rc"; }
          for c in aot_sw_bounds; do
            if grep -qE "SKIPPED.*wasm_guarded\.$c" gsub.log; then
              echo "::error::guarded AOT case $c took the wamrc-unavailable skip path"; exit 1
            fi
            grep -qE "OK[^A-Za-z].*wasm_guarded\.$c" gsub.log \
              || { echo "::error::guarded AOT case $c did not run to OK"; exit 1; }
          done
          echo " guarded-subrange AOT case (SW-bound) ran against a real wamrc .aot and passed."

      - name: Build + run the mapped-span AOT lifecycle case (must NOT skip)
        timeout-minutes: 12
        run: |
          # Precondition: guarantee THIS step's own executable wamrc rather than
          # trusting a prior step's mutable build/ state (see the helper header).
          sh tests/ci_ensure_wamrc.sh
          # the span lifecycle + Design B window under a real AOT
          # instance. FAIL if the AOT case takes the wamrc-unavailable skip path.
          rm -f build/gen_ro_heap_span_aot.h
          make build/test_wasm_spans
          set -o pipefail
          ./build/test_wasm_spans 2>&1 | tee spans.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::test_wasm_spans failed (rc=$rc)"; exit "$rc"; }
          if grep -qE "SKIPPED.*wasm_spans\\.aot_span_lifecycle" spans.log; then
            echo "::error::span AOT lifecycle case took the wamrc-unavailable skip path"; exit 1
          fi
          grep -qE "OK[^A-Za-z].*wasm_spans\\.aot_span_lifecycle" spans.log \
            || { echo "::error::span AOT lifecycle case did not run to OK"; exit 1; }
          echo "mapped-span AOT lifecycle case ran against a real wamrc .aot and passed."

      - name: Build + run the hull_span.h native-vs-WASM differential (must NOT skip)
        timeout-minutes: 12
        run: |
          # 3b: identical fixtures through the native SDK and a real wasm guest on
          # interpreter AND AOT must agree byte-for-byte. FAIL if the AOT diff
          # sub-case takes the wamrc-unavailable skip path.
          sh tests/ci_ensure_wamrc.sh
          rm -f build/gen_spandiff_aot.h
          make build/test_span_diff
          set -o pipefail
          ./build/test_span_diff 2>&1 | tee spandiff.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::test_span_diff failed (rc=$rc)"; exit "$rc"; }
          if grep -qE "SKIPPED spandiff\.aot_diff" spandiff.log; then
            echo "::error::span diff AOT sub-case took the wamrc-unavailable skip path"; exit 1
          fi
          grep -qE "spandiff\.aot_diff ran" spandiff.log \
            || { echo "::error::span diff AOT sub-case did not run"; exit 1; }
          echo "hull_span.h decodes identically native vs wasm (interp + AOT)."

      - name: Build + run the Memory64 8-cell AOT dispatch (must NOT skip)
        timeout-minutes: 12
        run: |
          # #318 D4.3: a real (memory i64) module (echo64) AOT-compiled by wamrc
          # (which auto-detects Memory64 from the module -- there is no
          # --enable-memory64 flag), loaded as AOT + Memory64, run through
          # hl_cap_wasm_call -- exercising the 8-cell hull_process(i64,i64,i64,i64)
          # argv marshalling and the output readback (the dispatch path that was
          # dead while Memory64 detection was compiled out). FAIL if it takes the
          # wamrc-unavailable skip path.
          sh tests/ci_ensure_wamrc.sh
          rm -f build/gen_echo64_aot.h
          make build/test_wasm
          set -o pipefail
          # Run the dispatch case in ISOLATION (utest --filter) so its result is
          # unambiguous -- a crash can't hide in the buffered full-suite output (the
          # full test_wasm regression is covered by the normal + ASan CI jobs).
          ./build/test_wasm --filter='*memory64_aot_dispatch' 2>&1 | tee m64.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::memory64_aot_dispatch crashed/failed (rc=$rc)"; exit "$rc"; }
          if grep -qE "SKIPPED.*hl_cap_wasm\\.memory64_aot_dispatch" m64.log; then
            echo "::error::Memory64 AOT dispatch case took the wamrc-unavailable skip path"; exit 1
          fi
          grep -qE "OK[^A-Za-z].*hl_cap_wasm\\.memory64_aot_dispatch" m64.log \
            || { echo "::error::Memory64 AOT dispatch case did not run to OK"; exit 1; }
          echo "Memory64 8-cell AOT dispatch ran against a real wamrc .aot and passed."

      - name: Build + run the Memory64 SPAN_INFO readback (must NOT skip)
        timeout-minutes: 12
        run: |
          # #334: a (memory i64) guest (spanread64) AOT-compiled by wamrc with
          # --enable-shared-heap, with ONE mapped span attached, reads window[0]
          # through the record's 64-bit `base` (a window placed above UINT32_MAX
          # under mem64) -- validating the SPAN_INFO-under-Memory64-AOT path incl.
          # WAMR's guarded-subrange RO shared-heap addressing. FAIL if it takes the
          # wamrc-unavailable skip path.
          sh tests/ci_ensure_wamrc.sh
          rm -f build/gen_spanread64_aot.h
          make build/test_wasm_spans
          set -o pipefail
          # Isolated (utest --filter, leading-only wildcard) so the result is
          # unambiguous; the full test_wasm_spans regression is covered elsewhere.
          ./build/test_wasm_spans --filter='*memory64_span_readback' 2>&1 | tee m64span.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::memory64_span_readback crashed/failed (rc=$rc)"; exit "$rc"; }
          if grep -qE "SKIPPED.*wasm_spans\\.memory64_span_readback" m64span.log; then
            echo "::error::Memory64 SPAN_INFO readback took the wamrc-unavailable skip path"; exit 1
          fi
          grep -qE "OK[^A-Za-z].*wasm_spans\\.memory64_span_readback" m64span.log \
            || { echo "::error::Memory64 SPAN_INFO readback did not run to OK"; exit 1; }
          echo "Memory64 SPAN_INFO readback ran against a real wamrc .aot and passed."

  # Mapped-span performance benchmark (#337 follow-up). Builds wamrc, then runs
  # the controlled bench at the required CI dataset size (96 MiB) through the real
  # cap layer + a wamrc-built AOT guest, enforcing the methodology gates: G1 drift
  # (guest wasm reproduces from source), G2 must-not-skip (every workload ran AOT
  # + span), G3 in-process correctness (every wasm checksum == native AND the
  # per-scan host-call delta == 0 BEFORE timing is trusted), G4 static bytecode
  # inspection (host_call only in the 2 setup sites). The steady-state overhead
  # (HullSpan vs native mmap) is REPORTED as an artifact, NOT gated, until per-arch
  # baselines stabilize (docs/mapped_span_benchmark_design.md D11). A 1 GiB
  # controlled run is the separate manually-triggered bench_mapped_span_1g.yml.
  mapped-span-bench:
    needs: [classify, wamrc-x86_64]
    if: needs.classify.outputs.run_compute == 'true'
    name: Mapped-span benchmark (96 MiB, x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install LLVM + cmake + wabt + clang/lld
        run: |
          sudo apt-get update
          # clang + lld give the G1 drift guard a real wasm32 toolchain (wasm-ld);
          # wabt provides wasm-objdump for the G4 static bytecode gate.
          sudo apt-get install -y llvm-18-dev cmake wabt clang lld

      - name: Download verified wamrc artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wamrc-x86_64
          path: artifact

      - name: Consume verified wamrc artifact (cold-verify, no build)
        timeout-minutes: 12
        run: |
          if command -v llvm-config-18 >/dev/null 2>&1; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=$(llvm-config-18 --cmakedir)"
          fi
          sh tests/ci_wamrc_consume.sh

      - name: Run mapped-span benchmark (must NOT skip AOT)
        timeout-minutes: 30
        env:
          DATASET_MB: "96"
          ITERS: "15"
          WARMUPS: "3"
        run: |
          # Guarantee this step's own executable wamrc, then regen the AOT header.
          sh tests/ci_ensure_wamrc.sh
          rm -f build/gen_bench_span_aot.h
          sh tests/bench_mapped_span.sh

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mapped-span-bench-96m
          path: build/bench_mapped_span.json

  # Compute AOT shared-heap reads (#326): `hull build` must pass
  # --enable-shared-heap so a plugin that reads a mapped SPAN or a compute.SEGMENT
  # (both WAMR shared heaps) reads correct nonzero bytes under AOT, not zeros.
  # Drives the REAL production `hull build` path (embedded hull + wamrc), so the
  # AOT is exercised non-skippably.
  compute-aot-shared-heap:
    needs: [classify, wamrc-x86_64]
    if: needs.classify.outputs.run_compute == 'true'
    name: Compute AOT shared-heap reads (spans + segments)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install LLVM + cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev cmake

      - name: Download verified wamrc artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wamrc-x86_64
          path: artifact

      - name: Build embedded hull (platform lib) + consume verified wamrc
        timeout-minutes: 15
        run: |
          make platform
          if command -v llvm-config-18 >/dev/null 2>&1; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=$(llvm-config-18 --cmakedir)"
          fi
          sh tests/ci_wamrc_consume.sh
          # Embed LAST: a later bare `make` would clobber the embedding
          # (EMBED_PLATFORM is not in the config sentinel), and the e2e needs it.
          make EMBED_PLATFORM=1

      - name: Modular local-module resolution E2E (0.13.1 PR#2, must NOT skip)
        timeout-minutes: 4
        run: |
          set -o pipefail
          # Run the script DIRECTLY (not `make e2e-modular-resolution`): any bare
          # `make` here trips the config sentinel and clobbers the embedded hull.
          sh tests/e2e_modular_resolution.sh 2>&1 | tee modres.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::modular resolution e2e failed (rc=$rc)"; exit "$rc"; }
          grep -q "e2e_modular_resolution: ALL PASS" modres.log \
            || { echo "::error::modular resolution e2e did not reach ALL PASS"; exit 1; }

      - name: Compute AOT shared-heap E2E (spans + segments, must NOT skip)
        timeout-minutes: 12
        run: |
          set -o pipefail
          # Precondition: guarantee an executable wamrc so `hull build`'s AOT runs
          # and the e2e cannot take the no-wamrc skip path (see the helper header).
          sh tests/ci_ensure_wamrc.sh
          # Run the script DIRECTLY, not `make ...`: any `make` invocation without
          # EMBED_PLATFORM=1 trips the config sentinel and clobbers the embedded
          # build/hull, which would make the e2e skip.
          sh tests/e2e_compute_aot_shared_heap.sh 2>&1 | tee aotsh.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::compute AOT shared-heap e2e failed (rc=$rc)"; exit "$rc"; }
          if grep -qE '\bSKIP\b' aotsh.log; then
            echo "::error::AOT shared-heap e2e skipped (no embedded hull / no wamrc)"; exit 1
          fi
          grep -qE "compute-aot-shared-heap: 5 passed, 0 failed" aotsh.log \
            || { echo "::error::AOT shared-heap e2e did not run its 5 checks to pass"; exit 1; }
          echo "compute AOT read spans + segments correctly under a real wamrc .aot."

      - name: hull build of a Memory64 compute plugin E2E (#336, must NOT skip)
        timeout-minutes: 12
        run: |
          set -o pipefail
          # #336: the PRODUCTION pipeline for a Memory64 plugin -- Case A is the
          # heap-less-shared-heap confirmation of F1/F2/F3 through `hull build`, on
          # this job's arch. Same embedded-hull + wamrc preconditions as above.
          sh tests/ci_ensure_wamrc.sh
          sh tests/e2e_compute_memory64.sh 2>&1 | tee m64e2e.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::Memory64 hull build e2e failed (rc=$rc)"; exit "$rc"; }
          if grep -qE '\bSKIP\b' m64e2e.log; then
            echo "::error::Memory64 hull build e2e skipped (no embedded hull / no wamrc)"; exit 1
          fi
          grep -qE "compute-memory64: 6 passed, 0 failed" m64e2e.log \
            || { echo "::error::Memory64 hull build e2e did not run its 6 checks to pass"; exit 1; }
          echo "hull build produced a working Memory64 plugin binary (heap-less + span)."

  # Freestanding libc on the real toolchain (#327). A compute plugin whose
  # clang-lowered struct copies / runtime-length loops emit implicit
  # memcpy/memset/memmove must build via `hull compute build` with NO undefined
  # `env.memcpy`-style import and run correctly under BOTH interpreter and AOT.
  # Drives the real driver (needs a wasm clang + wasm-ld), so this job installs
  # clang + lld; the AOT leg needs an embedded hull + wamrc.
  compute-memops-freestanding:
    needs: [classify, wamrc-x86_64]
    if: needs.classify.outputs.run_compute == 'true'
    name: Freestanding libc (memcpy/memset/memmove) - interp + AOT
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install clang + lld + wabt + LLVM + cmake
        run: |
          sudo apt-get update
          # clang + lld give `hull compute build` a wasm32 clang and wasm-ld;
          # wabt provides wasm-objdump for the import scan; llvm-18-dev + cmake
          # are for building wamrc.
          sudo apt-get install -y clang lld wabt llvm-18-dev cmake

      - name: Download verified wamrc artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wamrc-x86_64
          path: artifact

      - name: Build embedded hull (platform lib) + consume verified wamrc
        timeout-minutes: 15
        run: |
          make platform
          if command -v llvm-config-18 >/dev/null 2>&1; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=$(llvm-config-18 --cmakedir)"
          fi
          sh tests/ci_wamrc_consume.sh
          # Embed LAST: a later bare `make` would clobber the embedding
          # (EMBED_PLATFORM is not in the config sentinel), and the e2e needs it.
          make EMBED_PLATFORM=1

      - name: Compute memops E2E (build + no-import + interp + AOT, must NOT skip)
        timeout-minutes: 12
        run: |
          set -o pipefail
          # Precondition: guarantee an executable wamrc for the non-skippable AOT
          # leg rather than trusting mutable build/ state (see the helper header).
          sh tests/ci_ensure_wamrc.sh
          sh tests/e2e_compute_memops.sh 2>&1 | tee memops.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::compute memops e2e failed (rc=$rc)"; exit "$rc"; }
          if grep -qE '\bSKIP\b' memops.log; then
            echo "::error::memops e2e skipped (no clang / no embedded hull / no wamrc)"; exit 1
          fi
          grep -qE "compute-memops: 7 passed, 0 failed" memops.log \
            || { echo "::error::memops e2e did not run its 7 checks to pass"; exit 1; }
          echo "freestanding memcpy/memset/memmove: no import, correct under interp + AOT."

  # Stream chunk-metadata SDK helpers restored to the canonical hull_compute.h
  # (#331): hull_stream_is_first/is_last/chunk_index over a real 3-chunk
  # compute.stream, Lua + JS, interpreter + AOT. Needs clang + wamrc + embedded hull.
  stream-meta:
    needs: [classify, wamrc-x86_64]
    if: needs.classify.outputs.run_compute == 'true'
    name: compute stream metadata helpers - Lua + JS, interp + AOT
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install clang + lld + LLVM + cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm-18-dev cmake

      - name: Download verified wamrc artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wamrc-x86_64
          path: artifact

      - name: Build embedded hull (platform lib) + consume verified wamrc
        timeout-minutes: 15
        run: |
          make platform
          if command -v llvm-config-18 >/dev/null 2>&1; then
            export WAMRC_CMAKE_FLAGS="-DLLVM_DIR=$(llvm-config-18 --cmakedir)"
          fi
          sh tests/ci_wamrc_consume.sh
          make EMBED_PLATFORM=1

      - name: Stream-metadata E2E (Lua + JS, interp + AOT, must NOT skip)
        timeout-minutes: 12
        run: |
          set -o pipefail
          sh tests/ci_ensure_wamrc.sh
          sh tests/e2e_stream_meta.sh 2>&1 | tee stream_meta.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::stream-meta e2e failed (rc=$rc)"; exit "$rc"; }
          if grep -qE '\bSKIP\b' stream_meta.log; then
            echo "::error::stream-meta e2e skipped (no clang / no embedded hull / no wamrc)"; exit 1
          fi
          grep -qE "stream-meta: 14 passed, 0 failed" stream_meta.log \
            || { echo "::error::stream-meta e2e did not run its 14 checks to pass"; exit 1; }
          echo "stream metadata helpers: first/middle/last + chunk-index + non-stream default, both runtimes, interp + AOT."

  # mapped_spans reference example (3b slice 2). The spanreader plugin uses only
  # the public hull_span.h SDK and reads a NON-page-aligned mapped-span window;
  # driven from Lua AND JS, on the interpreter and under AOT via the PRODUCTION
